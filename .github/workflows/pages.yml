name: Publish student practice

on:
  push:
    branches: [main]
    paths:
      - '第二週(09-17)/第1節_分級練習_30題隨機抽題.html'
      - '第三週(09-24)/第三週_感測器實驗室.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the student pages
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            第二週(09-17)/第1節_分級練習_30題隨機抽題.html
            第三週(09-24)/第三週_感測器實驗室.html
          sparse-checkout-cone-mode: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare the public student pages
        shell: bash
        run: |
          mkdir -p _site/week2/levels _site/week3/lab
          cp -- '第二週(09-17)/第1節_分級練習_30題隨機抽題.html' _site/index.html
          cp -- '第二週(09-17)/第1節_分級練習_30題隨機抽題.html' _site/week2/levels/index.html
          cp -- '第三週(09-24)/第三週_感測器實驗室.html' _site/week3/lab/index.html

      - name: Upload the website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy the website
        id: deployment
        uses: actions/deploy-pages@v4
