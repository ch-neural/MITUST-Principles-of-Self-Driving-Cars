name: Publish student practice

on:
  push:
    branches: [main]
    paths:
      - '第二週(09-17)/第1節_分級練習_30題隨機抽題.html'
      - '第三週(09-24)/第三週_感測器實驗室.html'
      - '第三週(09-24)/自動駕駛原理_第三週_課程講義.pdf'
      - '第三週(09-24)/Nguyên lý xe tự lái_Tuần 3_Tài liệu học tập.pdf'
      - '第三週(09-24)/第三週_課堂練習_學習單_教師解答.html'
      - '第四週(10-01)/第四週_自駕模擬器.html'
      - '第四週(10-01)/自動駕駛原理_第四週_課程講義.pdf'
      - '第四週(10-01)/Nguyên lý xe tự lái_Tuần 4_Tài liệu học tập.pdf'
      - '第五週(10-08)/第五週_規格判讀台.html'
      - '第五週(10-08)/自動駕駛原理_第五週_課程講義.pdf'
      - '第五週(10-08)/Nguyên lý xe tự lái_Tuần 5_Tài liệu học tập.pdf'
      - '第五週(10-08)/第五週_第1節_簡報.pdf'
      - '第五週(10-08)/第五週_第2節_簡報.pdf'
      - '第五週(10-08)/第五週_第3節_簡報.pdf'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the student pages
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            第二週(09-17)/第1節_分級練習_30題隨機抽題.html
            第三週(09-24)/第三週_感測器實驗室.html
            第三週(09-24)/自動駕駛原理_第三週_課程講義.pdf
            第三週(09-24)/Nguyên lý xe tự lái_Tuần 3_Tài liệu học tập.pdf
            第三週(09-24)/第三週_課堂練習_學習單_教師解答.html
            第四週(10-01)/第四週_自駕模擬器.html
            第四週(10-01)/自動駕駛原理_第四週_課程講義.pdf
            第四週(10-01)/Nguyên lý xe tự lái_Tuần 4_Tài liệu học tập.pdf
            第五週(10-08)/第五週_規格判讀台.html
            第五週(10-08)/自動駕駛原理_第五週_課程講義.pdf
            第五週(10-08)/Nguyên lý xe tự lái_Tuần 5_Tài liệu học tập.pdf
            第五週(10-08)/第五週_第1節_簡報.pdf
            第五週(10-08)/第五週_第2節_簡報.pdf
            第五週(10-08)/第五週_第3節_簡報.pdf
          sparse-checkout-cone-mode: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare the public student pages
        shell: bash
        run: |
          mkdir -p _site/week2/levels _site/week3/lab _site/week3/answers _site/week4/sim _site/week5/spec
          cp -- '第二週(09-17)/第1節_分級練習_30題隨機抽題.html' _site/index.html
          cp -- '第二週(09-17)/第1節_分級練習_30題隨機抽題.html' _site/week2/levels/index.html
          cp -- '第三週(09-24)/第三週_感測器實驗室.html' _site/week3/lab/index.html
          # 學生講義：檔名用 ASCII，方便在課堂上唸出來、也方便手機輸入
          cp -- '第三週(09-24)/自動駕駛原理_第三週_課程講義.pdf' _site/week3/note-zh.pdf
          cp -- '第三週(09-24)/Nguyên lý xe tự lái_Tuần 3_Tài liệu học tập.pdf' _site/week3/note-vi.pdf
          # 課堂練習的解答，課後才公布
          cp -- '第三週(09-24)/第三週_課堂練習_學習單_教師解答.html' _site/week3/answers/index.html
          cp -- '第四週(10-01)/第四週_自駕模擬器.html' _site/week4/sim/index.html
          cp -- '第四週(10-01)/自動駕駛原理_第四週_課程講義.pdf' _site/week4/note-zh.pdf
          cp -- '第四週(10-01)/Nguyên lý xe tự lái_Tuần 4_Tài liệu học tập.pdf' _site/week4/note-vi.pdf
          cp -- '第五週(10-08)/第五週_規格判讀台.html' _site/week5/spec/index.html
          cp -- '第五週(10-08)/自動駕駛原理_第五週_課程講義.pdf' _site/week5/note-zh.pdf
          cp -- '第五週(10-08)/Nguyên lý xe tự lái_Tuần 5_Tài liệu học tập.pdf' _site/week5/note-vi.pdf
          # 簡報的學生版：PDF 不含備忘稿，動圖只留第一格（每張動圖的第一格都是故意放結論那一格）
          cp -- '第五週(10-08)/第五週_第1節_簡報.pdf' _site/week5/slides-1.pdf
          cp -- '第五週(10-08)/第五週_第2節_簡報.pdf' _site/week5/slides-2.pdf
          cp -- '第五週(10-08)/第五週_第3節_簡報.pdf' _site/week5/slides-3.pdf

      - name: Upload the website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy the website
        id: deployment
        uses: actions/deploy-pages@v4
