<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>規格判讀台</title>
<style>
  :root{--navy:#0B1F3A;--navy2:#13314F;--teal:#00A896;--teal-d:#007F72;--amber:#FFB020;
        --line:#D8E0E8;--card:#F4F7FA;--mute:#5F7183;--ink:#1A2733;--red:#D9463E;--ok:#2E7D5B}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:#EEF2F6;color:var(--ink);
       font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",Arial,sans-serif;font-size:14px;line-height:1.5}
  #app{display:grid;grid-template-columns:330px 1fr 340px;gap:12px;padding:12px;min-height:100vh;align-items:start}
  .panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}
  h1{font-size:16px;margin:0 0 2px;color:var(--navy)}
  h1 .vi{display:block;font-size:11px;color:var(--mute);font-weight:400}
  h2{font-size:12.5px;margin:14px 0 6px;color:var(--teal-d);letter-spacing:.02em}
  h2:first-child{margin-top:0}
  .note{font-size:11.5px;color:var(--mute);margin:2px 0 8px;line-height:1.45}
  .grid{display:grid;gap:6px}
  .g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:1fr 1fr 1fr}
  button{font-family:inherit;font-size:12px;padding:7px 8px;border:1px solid var(--line);
         background:#fff;color:var(--ink);border-radius:7px;cursor:pointer;line-height:1.25}
  button:hover{border-color:var(--teal)}
  button.on{background:var(--navy);border-color:var(--navy);color:#fff}
  button .vi{display:block;font-size:9.5px;opacity:.75}
  /* 規格表：刻意做成 datasheet 的樣子，英文在前、中越文在後 */
  .ds{border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .ds .hd{background:var(--navy);color:#fff;padding:7px 10px;font-size:12.5px;font-weight:700}
  .ds .hd small{display:block;font-weight:400;opacity:.8;font-size:10px}
  .row{display:flex;gap:8px;padding:5px 10px;border-top:1px solid var(--line);font-size:12px;align-items:flex-start}
  .row:nth-child(odd){background:var(--card)}
  .row .k{flex:0 0 40%;color:var(--navy);font-weight:600}
  .row .k small{display:block;font-weight:400;color:var(--mute);font-size:10px}
  .row .v{flex:1;color:var(--ink)}
  .row.key{background:#FFF8E6}
.pic{padding:10px 12px 2px;text-align:center}
  .pic img{max-width:min(230px,70%);max-height:140px;border-radius:6px;border:1px solid var(--line)}
  .pic span{display:block;margin-top:4px;font-size:11px;color:var(--mute)}
    .src{font-size:10px;color:var(--mute);padding:6px 10px;border-top:1px solid var(--line);line-height:1.4}
  /* 判讀表 */
  .q{margin:0 0 8px}
  .q label{display:block;font-size:12px;color:var(--navy);font-weight:600;margin-bottom:3px}
  .q label small{display:block;font-weight:400;color:var(--mute);font-size:10px}
  select{width:100%;font-family:inherit;font-size:12.5px;padding:6px;border:1px solid var(--line);border-radius:6px;background:#fff}
  .fb{font-size:11.5px;margin-top:3px;min-height:15px}
  .fb.ok{color:var(--ok)} .fb.no{color:var(--red)}
  .res{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:12.5px}
  .res b{color:var(--navy)}
  .res .big{font-size:20px;font-weight:700;color:var(--navy);display:block;margin:2px 0}
  .verdict{border-radius:7px;padding:8px 10px;margin-top:8px;font-size:12.5px;line-height:1.5}
  .verdict.pass{background:#E8F6F0;border:1px solid var(--ok);color:#1C5E45}
  .verdict.fail{background:#FDECEC;border:1px solid var(--red);color:#96271F}
  .mini{border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-bottom:8px;background:#fff}
  .mini .t{font-size:12px;font-weight:700;color:var(--navy);margin-bottom:5px}
  .mini .t small{font-weight:400;color:var(--mute);font-size:10px;display:block}
  input[type=range]{width:100%;accent-color:var(--teal)}
  .rowv{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mute);margin:6px 0 1px}
  .rowv b{color:var(--navy);font-size:13px}
  .out{font-size:12px;color:var(--ink);background:var(--card);border-radius:6px;padding:6px 8px;margin-top:6px;line-height:1.5}
  .foot{font-size:10.5px;color:var(--mute);margin-top:10px;border-top:1px solid var(--line);padding-top:6px;line-height:1.45}
  .lang{position:fixed;top:10px;right:12px;display:flex;gap:4px;z-index:5}
  .lang button{padding:4px 8px;font-size:11px;background:#fff}
  #mtabs{display:none}
  @media (max-width:900px){
    #app{display:block;padding:8px}
    .panel{margin-bottom:8px}
    #mtabs{display:flex;position:sticky;top:0;z-index:4;background:#fff;border:1px solid var(--line);
           border-radius:8px;overflow:hidden;margin-bottom:8px}
    #mtabs button{flex:1 1 0;border:none;border-radius:0;padding:10px 4px;font-size:13px}
    #mtabs button.on{background:var(--navy);color:#fff}
    .lang{position:static;justify-content:flex-end;margin-bottom:6px}
    button{font-size:12.5px;padding:9px 8px;min-height:38px}
  }
</style>
</head>
<body>
<div class="lang"><button id="btnZh" class="on">中文</button><button id="btnVi">Tiếng Việt</button></div>

<div id="mtabs">
  <button data-tab="ds" class="on" data-zh="規格表" data-vi="Thông số"></button>
  <button data-tab="read" data-zh="判讀與試算" data-vi="Đọc &amp; tính"></button>
  <button data-tab="mini" data-zh="三個小工具" data-vi="Ba công cụ"></button>
</div>

<div id="app">
  <!-- 左：型號與規格表 -->
  <div class="panel" id="pDs">
    <h1 data-zh="規格判讀台" data-vi="Bàn đọc thông số"></h1>
    <div class="note" data-zh="黃色底的那幾行，是等一下要你自己找出來的。"
         data-vi="Những dòng nền vàng là thứ bạn phải tự tìm ra."></div>
    <h2 data-zh="選一個型號" data-vi="Chọn model"></h2>
    <div class="grid g2" id="mdlBtns"></div>
    <div class="grid g2" style="margin-top:10px">
      <button id="btnTr" class="on" data-zh="原文＋中文對照" data-vi="Kèm tiếng Việt"></button>
      <button id="btnEn" data-zh="只看英文原文" data-vi="Chỉ tiếng Anh"></button>
    </div>
    <div id="ds" style="margin-top:8px"></div>
  </div>

  <!-- 中：判讀表與情境試算 -->
  <div class="panel" id="pRead">
    <h2 data-zh="一、從規格表上找出四個數字" data-vi="1. Tìm bốn con số trong bảng"></h2>
    <div class="note" data-zh="答案都在左邊那張表上——也可能表上根本沒有。"
         data-vi="Đáp án nằm trong bảng bên trái — hoặc bảng không hề có."></div>
    <div id="quiz"></div>
    <div class="grid g2" style="margin-top:6px">
      <button id="btnCheck" data-zh="檢查我的答案" data-vi="Kiểm tra"></button>
      <button id="btnClear" data-zh="重來" data-vi="Làm lại"></button>
    </div>

    <h2 data-zh="二、這顆放進我的情境，夠不夠用" data-vi="2. Model này có đủ cho tình huống của tôi không"></h2>
    <div class="grid g3" id="sceBtns"></div>
    <div id="calc" style="margin-top:8px"></div>
  </div>

  <!-- 右：三個小工具 -->
  <div class="panel" id="pMini">
    <h2 data-zh="三個小工具" data-vi="Ba công cụ nhỏ"></h2>

    <div class="mini">
      <div class="t" data-zh="① 焦距 → 視野" data-vi="① Tiêu cự → góc nhìn"><small data-zh="感光元件寬 6.14 mm（AR0233AT：2048 × 3.0 µm）" data-vi="Cảm biến rộng 6,14 mm (AR0233AT)"></small></div>
      <div class="rowv"><span data-zh="鏡頭焦距 mm" data-vi="Tiêu cự mm"></span><b id="vF">8</b></div>
      <input type="range" id="sF" min="2" max="24" step="0.2" value="8">
      <div class="out" id="oF"></div>
    </div>

    <div class="mini">
      <div class="t" data-zh="② 每秒點數 ↔ 角解析度" data-vi="② Số điểm/giây ↔ phân giải góc"><small data-zh="規格表常只寫點數，角度要自己除出來" data-vi="Bảng thường chỉ ghi số điểm; góc phải tự chia"></small></div>
      <div class="rowv"><span data-zh="線束數" data-vi="Số kênh"></span><b id="vCh">64</b></div>
      <input type="range" id="sCh" min="0" max="4" step="1" value="3">
      <div class="rowv"><span data-zh="每圈水平點數" data-vi="Điểm ngang mỗi vòng"></span><b id="vCol">1024</b></div>
      <input type="range" id="sCol" min="0" max="2" step="1" value="1">
      <div class="rowv"><span data-zh="轉速 Hz" data-vi="Tốc độ quay Hz"></span><b id="vHz">10</b></div>
      <input type="range" id="sHz" min="0" max="1" step="1" value="0">
      <div class="out" id="oP"></div>
    </div>

    <div class="mini">
      <div class="t" data-zh="③ 反射率：黑色車與白色車" data-vi="③ Độ phản xạ: xe đen và xe trắng"><small data-zh="同一顆光達，量白色物體和黑色物體差很多" data-vi="Cùng một lidar, vật trắng và vật đen khác hẳn"></small></div>
      <div id="oR" class="out"></div>
    </div>

    <div class="foot" data-zh="規格取自各廠公開文件，來源標在每張表下面。算出來的點數與煞停距離是課堂算式，不是廠商保證值。"
         data-vi="Thông số từ tài liệu công khai; nguồn ghi dưới mỗi bảng. Giá trị tính ra là công thức lớp học."></div>
  </div>
</div>

let model = "os1", scene = "hanoi", cols = 1024, hzNow = 10, TR = true;

const brake = (v) => { const ms = v / 3.6; return ms * 0.3 + ms * ms / 12; };

// ═══════════ 畫面 ═══════════

function check() {
  const m = MODELS[model];
  QUIZ.forEach((q) => {
    const sel = $("q_" + q.k).value, fb = $("f_" + q.k);
    if (!sel) { fb.className = "fb"; fb.textContent = ""; return; }
    const right = sel === m.ans[q.k];
    fb.className = "fb " + (right ? "ok" : "no");
    fb.innerHTML = (right ? "✓ " : "✗ ") + L(WHY[q.k][model][0], WHY[q.k][model][1]);
  });
}
function calc() {
  const m = MODELS[model], c = m.calc, s = SCENES[scene], need = brake(s.v) + 5;
  let html = `<div class="res">${L("情境：", "Tình huống: ")}<b>${L(s.zh, s.vi)}</b>　${L(s.zhNote, s.viNote)}
    <span class="big">${L("煞停要 ", "Cần ")}${brake(s.v).toFixed(0)} m${L("　→　感測器至少要看到 ", " → cảm biến phải thấy tối thiểu ")}${need.toFixed(0)} m</span>
    <span style="font-size:11px;color:var(--mute)">${L("時速 × 0.3 ＋ 時速² ÷ 12，再加 5 公尺餘裕（第四週第 1 節）", "v×0,3 + v²÷12, cộng 5 m dự phòng (tuần 4)")}</span></div>`;

  const lines = [];
  const T = s.tgt || PED;
  let ok = true;
  if (c.type === "lidar") {
    const dv = c.dv || c.vfov / (c.ch - 1);
    const dh = c.dh || c.hfov / (c.modes ? cols : c.cols);
    const hz = c.modes ? hzNow : c.hz;
    const pts = (d) => {
      const nv = Math.min(c.ch, 2 * Math.atan(T.h / 2 / d) / R / dv);
      const nh = 2 * Math.atan(T.w / 2 / d) / R / dh;
      return Math.max(0, Math.floor(nv)) * Math.max(0, Math.floor(nh));
    };
    const reach = c.range10 >= need;
    if (!reach) ok = false;
    lines.push([L(`測距 ${c.range10} m`, `Tầm ${c.range10} m`),
                reach ? L("夠，比 " + need.toFixed(0) + " m 遠", "Đủ") : L("不夠，差 " + (need - c.range10).toFixed(0) + " m", "Thiếu"), reach]);
    lines.push([L(`角解析度 ${dh.toFixed(2)}° × ${dv.toFixed(2)}°`, `Phân giải ${dh.toFixed(2)}° × ${dv.toFixed(2)}°`),
                L(`${s.d} m 的${s.tgt.zh}身上有 ${pts(s.d)} 個點`, `${s.tgt.vi} ở ${s.d} m có ${pts(s.d)} điểm`), pts(s.d) >= 10]);
    if (pts(s.d) < 10) ok = false;
    lines.push([L(`更新率 ${hz} Hz`, `${hz} Hz`),
                L(`每 ${(1000 / hz).toFixed(0)} 毫秒一張；這段時間車子前進 ${(s.v / 3.6 / hz).toFixed(1)} m`,
                  `Mỗi ${(1000 / hz).toFixed(0)} ms một khung; xe đi ${(s.v / 3.6 / hz).toFixed(1)} m`), true]);
  } else {
    const fov = 2 * Math.atan(c.px * c.pitch / 1000 / 2 / c.f) / R;
    const th = fov / c.px * R;
    const err = s.d * s.d * th / c.h;
    lines.push([L(`配 ${c.f} mm 鏡頭 → 視野 ${fov.toFixed(0)}°`, `Ống kính ${c.f} mm → ${fov.toFixed(0)}°`),
                L("感測器規格表沒有視野，是鏡頭決定的", "Bảng cảm biến không có góc nhìn"), true]);
    lines.push([L(`每像素 ${(fov / c.px).toFixed(4)}°`, `Mỗi điểm ảnh ${(fov / c.px).toFixed(4)}°`),
                L(`${s.d} m 處估距誤差 ±${err.toFixed(2)} m`, `Sai số ở ${s.d} m: ±${err.toFixed(2)} m`), err < 1.5]);
    if (err >= 1.5) ok = false;
    lines.push([L("更新率 60 fps", "60 fps"),
                L(`每 17 毫秒一張；這段時間車子前進 ${(s.v / 3.6 / 60).toFixed(2)} m`,
                  `Mỗi 17 ms; xe đi ${(s.v / 3.6 / 60).toFixed(2)} m`), true]);
    lines.push([L("測距", "Đo khoảng cách"), L("規格表上沒有，距離是算出來的，而且要假設路面是平的", "Không có trong bảng"), true]);
  }
  if (c.modes) {
    html += `<div class="res" style="margin-top:6px;font-size:11.5px">
      ${L("這一顆的兩個數字在規格表上是<b>可以設定的</b>，換一個模式結果就不一樣：",
           "Hai thông số này hãng ghi là <b>có thể cấu hình</b>:")}
      <div class="grid g2" style="margin-top:5px">
        <select id="mCols">${c.modes.cols.map((x) => `<option value="${x}"${x === cols ? " selected" : ""}>${x} ${L("點／圈", "điểm/vòng")}</option>`).join("")}</select>
        <select id="mHz">${c.modes.hz.map((x) => `<option value="${x}"${x === hzNow ? " selected" : ""}>${x} Hz</option>`).join("")}</select>
      </div></div>`;
  }
  html += lines.map(([a, b, good]) => `<div class="row" style="border:1px solid var(--line);border-radius:6px;margin-top:5px;background:#fff">
      <div class="k" style="flex:0 0 46%">${a}</div>
      <div class="v" style="color:${good ? "var(--ok)" : "var(--red)"}">${b}</div></div>`).join("");
  html += `<div class="verdict ${ok ? "pass" : "fail"}">${ok
    ? L("這一顆在這個情境撐得住。接下來要問的是價錢、功耗和裝得上去嗎。", "Model này đủ dùng. Câu hỏi tiếp theo là giá, điện và chỗ lắp.")
    : L("這一顆在這個情境不夠用。上面紅色那一行就是卡住的地方。", "Không đủ. Dòng màu đỏ ở trên là chỗ bị chặn.")}</div>`;
  $("calc").innerHTML = html;
  if (c.modes) {
    $("mCols").onchange = (e) => { cols = +e.target.value; calc(); };
    $("mHz").onchange = (e) => { hzNow = +e.target.value; calc(); };
  }
}

function miniF() {
  const f = +$("sF").value, w = 2048 * 3.0 / 1000;
  const fov = 2 * Math.atan(w / 2 / f) / R;
  $("vF").textContent = f.toFixed(1);
  $("oF").innerHTML = L(
    `視野 <b>${fov.toFixed(1)}°</b>　每像素 <b>${(fov / 2048).toFixed(4)}°</b><br>焦距加倍 → 視野減半，看得準但看得窄。`,
    `Góc nhìn <b>${fov.toFixed(1)}°</b>　mỗi điểm ảnh <b>${(fov / 2048).toFixed(4)}°</b><br>Tiêu cự gấp đôi → góc nhìn giảm nửa.`);
}
function miniP() {
  const ch = CHS[+$("sCh").value], col = COLS[+$("sCol").value], hz = HZS[+$("sHz").value];
  $("vCh").textContent = ch; $("vCol").textContent = col; $("vHz").textContent = hz;
  const pts = ch * col * hz, dh = 360 / col;
  $("oP").innerHTML = L(
    `每秒 <b>${pts.toLocaleString()}</b> 點<br>360° ÷ ${col} ＝ <b>${dh.toFixed(3)}°</b>　40 公尺處兩點相距 <b>${(40 * dh * R).toFixed(2)} m</b>`,
    `<b>${pts.toLocaleString()}</b> điểm/giây<br>360° ÷ ${col} ＝ <b>${dh.toFixed(3)}°</b>　ở 40 m cách <b>${(40 * dh * R).toFixed(2)} m</b>`);
}
function miniR() {
  $("oR").innerHTML = L(
    `OS1：白色（80%）<b>170 m</b>，黑色（10%）只剩 <b>90 m</b>。<br>看到「測距 170 m」要追問：<b>對什麼顏色量的？</b>`,
    `OS1: vật trắng (80%) <b>170 m</b>, vật đen (10%) chỉ <b>90 m</b>.<br>Thấy «170 m» phải hỏi: đo với màu gì?`);
}

function render() { modelBtns(); dsTable(); quiz(); sceneBtns(); calc(); }
function applyLang() {
  document.querySelectorAll("[data-zh]").forEach((el) => { el.textContent = el.dataset[LANG]; });
  document.title = L("規格判讀台", "Bàn đọc thông số");
  $("btnTr").classList.toggle("on", TR); $("btnEn").classList.toggle("on", !TR);
  $("btnZh").classList.toggle("on", LANG === "zh");
  $("btnVi").classList.toggle("on", LANG === "vi");
  render(); miniF(); miniP(); miniR();
}
$("btnZh").onclick = () => { LANG = "zh"; applyLang(); };
$("btnVi").onclick = () => { LANG = "vi"; applyLang(); };
$("btnTr").onclick = () => { TR = true; $("btnTr").classList.add("on"); $("btnEn").classList.remove("on"); dsTable(); };
$("btnEn").onclick = () => { TR = false; $("btnEn").classList.add("on"); $("btnTr").classList.remove("on"); dsTable(); };
$("btnCheck").onclick = check;
$("btnClear").onclick = () => quiz();
["sF"].forEach((id) => $(id).addEventListener("input", miniF));
["sCh", "sCol", "sHz"].forEach((id) => $(id).addEventListener("input", miniP));

// 手機：三個分頁
const MOBILE = window.matchMedia("(max-width:900px)");
function tab(name) {
  document.querySelectorAll("#mtabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === name));
  const map = { ds: "pDs", read: "pRead", mini: "pMini" };
  Object.entries(map).forEach(([k, id]) => { $(id).style.display = (!MOBILE.matches || k === name) ? "" : "none"; });
}
document.querySelectorAll("#mtabs button").forEach((b) => b.onclick = () => tab(b.dataset.tab));
MOBILE.addEventListener("change", () => tab(MOBILE.matches ? "ds" : "ds"));

applyLang();
tab("ds");
</script>
</body>
</html>
