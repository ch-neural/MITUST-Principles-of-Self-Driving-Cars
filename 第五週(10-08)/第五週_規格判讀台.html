<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>規格判讀台</title>
<style>
  :root{--navy:#0B1F3A;--navy2:#13314F;--teal:#00A896;--teal-d:#007F72;--amber:#FFB020;
        --line:#D8E0E8;--card:#F4F7FA;--mute:#5F7183;--ink:#1A2733;--red:#D9463E;--ok:#2E7D5B}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:#EEF2F6;color:var(--ink);
       font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",Arial,sans-serif;font-size:14px;line-height:1.5}
  #app{display:grid;grid-template-columns:330px 1fr 340px;gap:12px;padding:12px;min-height:100vh;align-items:start}
  .panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}
  h1{font-size:16px;margin:0 0 2px;color:var(--navy)}
  h1 .vi{display:block;font-size:11px;color:var(--mute);font-weight:400}
  h2{font-size:12.5px;margin:14px 0 6px;color:var(--teal-d);letter-spacing:.02em}
  h2:first-child{margin-top:0}
  .note{font-size:11.5px;color:var(--mute);margin:2px 0 8px;line-height:1.45}
  .grid{display:grid;gap:6px}
  .g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:1fr 1fr 1fr}
  button{font-family:inherit;font-size:12px;padding:7px 8px;border:1px solid var(--line);
         background:#fff;color:var(--ink);border-radius:7px;cursor:pointer;line-height:1.25}
  button:hover{border-color:var(--teal)}
  button.on{background:var(--navy);border-color:var(--navy);color:#fff}
  button .vi{display:block;font-size:9.5px;opacity:.75}
  /* 規格表：刻意做成 datasheet 的樣子，英文在前、中越文在後 */
  .ds{border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .ds .hd{background:var(--navy);color:#fff;padding:7px 10px;font-size:12.5px;font-weight:700}
  .ds .hd small{display:block;font-weight:400;opacity:.8;font-size:10px}
  .row{display:flex;gap:8px;padding:5px 10px;border-top:1px solid var(--line);font-size:12px;align-items:flex-start}
  .row:nth-child(odd){background:var(--card)}
  .row .k{flex:0 0 40%;color:var(--navy);font-weight:600}
  .row .k small{display:block;font-weight:400;color:var(--mute);font-size:10px}
  .row .v{flex:1;color:var(--ink)}
  .row.key{background:#FFF8E6}
.pic{padding:10px 12px 2px;text-align:center}
  .pic img{max-width:min(230px,70%);max-height:140px;border-radius:6px;border:1px solid var(--line)}
  .pic span{display:block;margin-top:4px;font-size:11px;color:var(--mute)}
  /* 一律直排。橫排要靠 flex 收縮，面板一窄第二張就會被擠出右緣只露一條；
     直排則是兩張各自佔滿面板寬度，手機和電腦都一樣。 */
  .out .calc{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;margin:3px 0}
  .out .calc>i{flex:0 0 auto;min-width:96px;font-style:normal;font-size:11px;color:var(--mute)}
  .out .calc>code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;color:var(--navy)}
  .out .hint{display:block;margin-top:3px;color:var(--mute)}
  .out .warn{display:block;margin-top:3px;color:#c0392b;font-weight:700}
  .sim{display:flex;flex-direction:column;align-items:center;gap:8px;margin:8px 0 2px}
  .sim>div{text-align:center;max-width:100%}
  .sim canvas{display:block;max-width:100%;height:auto;border:1px solid var(--line);
    border-radius:5px;background:#eef2f6}
  .sim span{display:block;margin-top:3px;font-size:10px;color:var(--mute)}
    .src{font-size:10px;color:var(--mute);padding:6px 10px;border-top:1px solid var(--line);line-height:1.4}
  /* 判讀表 */
  .q{margin:0 0 8px}
  .q label{display:block;font-size:12px;color:var(--navy);font-weight:600;margin-bottom:3px}
  .q label small{display:block;font-weight:400;color:var(--mute);font-size:10px}
  select{width:100%;font-family:inherit;font-size:12.5px;padding:6px;border:1px solid var(--line);border-radius:6px;background:#fff}
  .fb{font-size:11.5px;margin-top:3px;min-height:15px}
  .fb.ok{color:var(--ok)} .fb.no{color:var(--red)}
  .res{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:12.5px}
  .res b{color:var(--navy)}
  .res .big{font-size:20px;font-weight:700;color:var(--navy);display:block;margin:2px 0}
  .verdict{border-radius:7px;padding:8px 10px;margin-top:8px;font-size:12.5px;line-height:1.5}
  .verdict.pass{background:#E8F6F0;border:1px solid var(--ok);color:#1C5E45}
  .verdict.fail{background:#FDECEC;border:1px solid var(--red);color:#96271F}
  .mini{border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-bottom:8px;background:#fff}
  .mini .t{font-size:12px;font-weight:700;color:var(--navy);margin-bottom:5px}
  .mini .t small{font-weight:400;color:var(--mute);font-size:10px;display:block}
  input[type=range]{width:100%;accent-color:var(--teal)}
  .rowv{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mute);margin:6px 0 1px}
  .rowv b{color:var(--navy);font-size:13px}
  .out{font-size:12px;color:var(--ink);background:var(--card);border-radius:6px;padding:6px 8px;margin-top:6px;line-height:1.5}
  .foot{font-size:10.5px;color:var(--mute);margin-top:10px;border-top:1px solid var(--line);padding-top:6px;line-height:1.45}
  .lang{display:flex;gap:0;flex:0 0 auto}
  .lang{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;
        box-shadow:0 1px 3px rgba(11,31,58,.08)}
  .lang button{padding:5px 11px;font-size:11.5px;background:#fff;border:none;border-radius:0}
  .lang button.on{background:var(--navy);color:#fff}   /* 這一條一定要排在上面那條後面，
     否則 .lang button 的白底會蓋掉 button.on 的深底，白字壓白底＝整顆看起來是空的 */
  #mtabs{display:none}
  /* 情境是「這一題」的設定，整題不變，所以提到最上面固定住：
     捲到哪裡都看得到自己在哪個情境，也隨時改得到。 */
  #stick{position:sticky;top:0;z-index:6;background:#fff;border-bottom:1px solid var(--line)}
  #topbar{display:flex;align-items:center;gap:10px;padding:7px 12px;flex-wrap:wrap}
  .tb-lab{font-size:12px;font-weight:700;color:var(--navy);flex:0 0 auto}
  #sceBtns{display:flex;gap:6px;flex:0 0 auto}
  #sceBtns button{padding:5px 12px;font-size:12.5px;min-height:0;line-height:1.25}
  #sceBtns .vi{display:block;font-size:10px;opacity:.72}
  #tbNeed{font-size:12px;color:var(--navy);flex:1 1 180px;min-width:0}
  #tbNeed b{font-size:14px}
  /* 判定卡上方的型號快捷鈕：固定情境之後在原地輪四顆 */
  .mdl2{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 7px}
  .mdl2 button{flex:1 1 0;min-width:84px;padding:6px 4px;font-size:11.5px;min-height:0;line-height:1.3}
  /* 每個小工具算的是哪一種感測器；選的型號對不上就變成警告 */
  .scope{font-size:11px;line-height:1.45;color:var(--mute);margin:1px 0 7px}
  .scope.bad{background:#FFF6E3;border:1px solid var(--amber);color:#7A4E00;
             border-radius:6px;padding:5px 7px;margin-top:3px}
  /* 去作業那一頁 */
  .hwlink{display:block;margin-top:8px;padding:9px 10px;border-radius:7px;text-align:center;
          background:var(--teal);color:#fff;font-size:12.5px;font-weight:700;text-decoration:none}
  .hwlink:hover{background:var(--teal-d)}
  @media (max-width:900px){
    #app{display:block;padding:8px}
    .panel{margin-bottom:8px}
    #mtabs{display:flex;background:#fff;border:1px solid var(--line);
           border-radius:8px;overflow:hidden;margin-bottom:8px}
    #mtabs button{flex:1 1 0;border:none;border-radius:0;padding:10px 4px;font-size:13px}
    #mtabs button.on{background:var(--navy);color:#fff}
    #topbar{padding:6px 8px;gap:7px}
    #sceBtns{flex:1 1 100%;order:2}
    #sceBtns button{flex:1 1 0;min-width:0}
    #tbNeed{order:3;flex:1 1 100%}
    .tb-lab{order:1}
    .lang{order:1;margin-left:auto}
    button{font-size:12.5px;padding:9px 8px;min-height:38px}
  }
</style>
</head>
<body>
<div id="stick">
<div id="topbar">
  <span class="tb-lab" data-zh="情境" data-vi="Tình huống"></span>
  <div id="sceBtns"></div>
  <div id="tbNeed"></div>
  <div class="lang"><button id="btnZh" class="on">中文</button><button id="btnVi">Tiếng Việt</button></div>
</div>

<div id="mtabs">
  <button data-tab="ds" class="on" data-zh="規格表" data-vi="Thông số"></button>
  <button data-tab="read" data-zh="判讀與試算" data-vi="Đọc &amp; tính"></button>
  <button data-tab="mini" data-zh="三個小工具" data-vi="Ba công cụ"></button>
</div>
</div>

<div id="app">
  <!-- 左：型號與規格表 -->
  <div class="panel" id="pDs">
    <h1 data-zh="規格判讀台" data-vi="Bàn đọc thông số"></h1>
    <div class="note" data-zh="黃色底的那幾行，是等一下要你自己找出來的。"
         data-vi="Những dòng nền vàng là thứ bạn phải tự tìm ra."></div>
    <h2 data-zh="選一個型號" data-vi="Chọn model"></h2>
    <div class="grid g2" id="mdlBtns"></div>
    <div class="grid g2" style="margin-top:10px">
      <button id="btnTr" class="on" data-zh="原文＋中文對照" data-vi="Kèm tiếng Việt"></button>
      <button id="btnEn" data-zh="只看英文原文" data-vi="Chỉ tiếng Anh"></button>
    </div>
    <div id="ds" style="margin-top:8px"></div>
  </div>

  <!-- 中：判讀表與情境試算 -->
  <div class="panel" id="pRead">
    <h2 data-zh="一、從規格表上找出四個數字" data-vi="1. Tìm bốn con số trong bảng"></h2>
    <div class="note" data-zh="答案都在左邊那張表上——也可能表上根本沒有。"
         data-vi="Đáp án nằm trong bảng bên trái — hoặc bảng không hề có."></div>
    <div id="quiz"></div>
    <div class="grid g2" style="margin-top:6px">
      <button id="btnCheck" data-zh="檢查我的答案" data-vi="Kiểm tra"></button>
      <button id="btnClear" data-zh="重來" data-vi="Làm lại"></button>
    </div>

    <h2 data-zh="二、這顆放進上面那個情境，夠不夠用" data-vi="2. Model này có đủ cho tình huống ở trên không"></h2>
    <div class="note" data-zh="情境在最上面那一條換。這裡換型號，四顆輪一遍。"
         data-vi="Đổi tình huống ở thanh trên cùng. Ở đây đổi model, làm lần lượt bốn cái."></div>
    <div class="mdl2" id="mdlBtns2"></div>
    <div id="calc"></div>
  </div>

  <!-- 右：三個小工具 -->
  <div class="panel" id="pMini">
    <h2 data-zh="三個小工具" data-vi="Ba công cụ nhỏ"></h2>

    <div class="mini">
      <div class="t" data-zh="① 焦距 → 視野" data-vi="① Tiêu cự → góc nhìn"><small data-zh="感光元件寬 6.14 mm（AR0233AT：2048 × 3.0 µm）" data-vi="Cảm biến rộng 6,14 mm (AR0233AT)"></small></div>
      <div class="scope" id="sc1"></div>
      <div class="rowv"><span data-zh="鏡頭焦距 mm" data-vi="Tiêu cự mm"></span><b id="vF">8</b></div>
      <input type="range" id="sF" min="2" max="24" step="0.2" value="8">
      <div class="sim">
        <div><canvas id="cScene" width="268" height="201"></canvas>
          <span data-zh="這顆鏡頭看到的範圍" data-vi="Phạm vi ống kính này thấy"></span></div>
        <div><canvas id="cBike" width="160" height="160"></canvas>
          <span data-zh="40 m 外那台機車（黃框＝那台車，畫面＝感光元件上 80 個像素）" data-vi="Xe máy ở 40 m (khung vàng = chiếc xe đó; khung hình = 80 điểm ảnh trên cảm biến)"></span></div>
      </div>
      <div class="out" id="oF"></div>
    </div>

    <div class="mini">
      <div class="t" data-zh="② 每秒點數 ↔ 角解析度" data-vi="② Số điểm/giây ↔ phân giải góc"><small data-zh="規格表常只寫點數，角度要自己除出來" data-vi="Bảng thường chỉ ghi số điểm; góc phải tự chia"></small></div>
      <div class="scope" id="sc2"></div>
      <div class="rowv"><span data-zh="線束數" data-vi="Số kênh"></span><b id="vCh">64</b></div>
      <!-- CHS = [16, 32, 64, 128, 256]：64 是 index 2。原本寫 3（＝128 線），
           一打開就算出 18 點，可是第 1 節第 6 張和第 2 節第 14 張的口白都說
           「現在上面寫著 9 個點」——9 是 OS1-64 的數字，所以預設要停在 64。 -->
      <input type="range" id="sCh" min="0" max="4" step="1" value="2">
      <div class="rowv"><span data-zh="每圈水平點數" data-vi="Điểm ngang mỗi vòng"></span><b id="vCol">1024</b></div>
      <input type="range" id="sCol" min="0" max="2" step="1" value="1">
      <div class="rowv"><span data-zh="轉速 Hz" data-vi="Tốc độ quay Hz"></span><b id="vHz">10</b></div>
      <input type="range" id="sHz" min="0" max="1" step="1" value="0">
      <div class="sim">
        <div><canvas id="cDots" width="268" height="201"></canvas>
          <span data-zh="40 m 外那台機車，落到幾個點" data-vi="Xe máy ở 40 m: bao nhiêu điểm"></span></div>
      </div>
      <div class="out" id="oP"></div>
    </div>

    <div class="mini">
      <div class="t" data-zh="③ 反射率：黑色車與白色車" data-vi="③ Độ phản xạ: xe đen và xe trắng"><small data-zh="同一顆光達，量白色物體和黑色物體差很多" data-vi="Cùng một lidar, vật trắng và vật đen khác hẳn"></small></div>
      <div class="scope" id="sc3"></div>
      <div class="rowv"><span data-zh="目標距離 m" data-vi="Khoảng cách m"></span><b id="vD">120</b></div>
      <input type="range" id="sD" min="20" max="200" step="5" value="120">
      <div class="sim"><div><canvas id="cRef" width="268" height="118"></canvas>
        <span data-zh="同一顆 OS1，兩種顏色的車" data-vi="Cùng một OS1, hai màu xe"></span></div></div>
      <div id="oR" class="out"></div>
    </div>

    <div class="foot" data-zh="規格取自各廠公開文件，來源標在每張表下面。算出來的點數與煞停距離是課堂算式，不是廠商保證值。"
         data-vi="Thông số từ tài liệu công khai; nguồn ghi dưới mỗi bảng. Giá trị tính ra là công thức lớp học."></div>
  </div>

</div>

           `v × 0,3 + v² ÷ 12, cộng 5 m dự phòng (tuần 4). <b>v tính bằng m/s</b> = km/h ÷ 3,6 = ${(SCENES[scene].v / 3.6).toFixed(1)} m/s`)}</span>
    <span style="font-size:11px;color:var(--mute);display:block;margin-top:2px">${L(
      `本課的三條門檻：測距要同時<b>搆到煞停距離</b>和<b>搆到目標</b>（目標在 ${s.d} m）、目標身上 ≥ <b>${MIN_PTS}</b> 個點、相機估距誤差 ≤ <b>±${MAX_ERR}</b> m`,
      `Ba ngưỡng của môn này: tầm đo phải <b>đủ cả quãng phanh lẫn tới vật</b> (vật ở ${s.d} m), ≥ <b>${MIN_PTS}</b> điểm trên vật, sai số ước lượng ≤ <b>±${MAX_ERR}</b> m`)}</span></div>`;

  const lines = [];
  const T = s.tgt || PED;
  let ok = true;
  if (c.type === "lidar") {
    const dv = c.dv || c.vfov / (c.ch - 1);
    const dh = c.dh || c.hfov / (c.modes ? cols : c.cols);
    const hz = c.modes ? hzNow : c.hz;
    const pts = (d) => {
      const nv = Math.min(c.ch, 2 * Math.atan(T.h / 2 / d) / R / dv);
      const nh = 2 * Math.atan(T.w / 2 / d) / R / dh;
      return Math.max(0, Math.floor(nv)) * Math.max(0, Math.floor(nh));
    };
    // 測距有兩個要求：搆得到煞停距離，也搆得到這個情境要你認出來的那個目標。
    // 只比煞停的話，90 公尺的 OS1 在「150 公尺外看到車」這一題會被判成「夠」——
    // 可是那台車根本在它的測距之外。兩個取大的才是真正的門檻。
    const rm = Math.max(need, s.d);
    const reach = c.range10 >= rm;
    if (!reach) ok = false;
    lines.push([L(`測距 ${c.range10} m`, `Tầm ${c.range10} m`),
                reach ? L(`夠，門檻 ${rm.toFixed(0)} m`, `Đủ, ngưỡng ${rm.toFixed(0)} m`)
                      : L(`不夠，門檻 ${rm.toFixed(0)} m，差 ${(rm - c.range10).toFixed(0)} m`,
                          `Thiếu ${(rm - c.range10).toFixed(0)} m so với ngưỡng ${rm.toFixed(0)} m`), reach]);
    lines.push([L(`角解析度 ${dh.toFixed(2)}° × ${dv.toFixed(2)}°`, `Phân giải ${dh.toFixed(2)}° × ${dv.toFixed(2)}°`),
                L(`${s.d} m 的${s.tgt.zh}身上有 ${pts(s.d)} 個點，門檻 ${MIN_PTS} 個`,
                  `${s.tgt.vi} ở ${s.d} m có ${pts(s.d)} điểm, ngưỡng ${MIN_PTS}`), pts(s.d) >= MIN_PTS]);
    if (pts(s.d) < MIN_PTS) ok = false;
    lines.push([L(`更新率 ${hz} Hz`, `${hz} Hz`),
                L(`每 ${(1000 / hz).toFixed(0)} 毫秒一張；這段時間車子前進 ${(s.v / 3.6 / hz).toFixed(1)} m`,
                  `Mỗi ${(1000 / hz).toFixed(0)} ms một khung; xe đi ${(s.v / 3.6 / hz).toFixed(1)} m`), null]);
  } else {
    const fov = 2 * Math.atan(c.px * c.pitch / 1000 / 2 / c.f) / R;
    const th = fov / c.px * R;
    const err = s.d * s.d * th / c.h;
    lines.push([L(`配 ${c.f} mm 鏡頭 → 視野 ${fov.toFixed(0)}°`, `Ống kính ${c.f} mm → ${fov.toFixed(0)}°`),
                L("感測器規格表沒有視野，是鏡頭決定的", "Bảng cảm biến không có góc nhìn"), null]);
    lines.push([L(`每像素 ${(fov / c.px).toFixed(4)}°`, `Mỗi điểm ảnh ${(fov / c.px).toFixed(4)}°`),
                L(`${s.d} m 處估距誤差 ±${err.toFixed(2)} m，門檻 ±${MAX_ERR} m`,
                  `Sai số ở ${s.d} m: ±${err.toFixed(2)} m, ngưỡng ±${MAX_ERR} m`), err < MAX_ERR]);
    if (err >= MAX_ERR) ok = false;
    lines.push([L("更新率 60 fps", "60 fps"),
                L(`每 17 毫秒一張；這段時間車子前進 ${(s.v / 3.6 / 60).toFixed(2)} m`,
                  `Mỗi 17 ms; xe đi ${(s.v / 3.6 / 60).toFixed(2)} m`), null]);
    lines.push([L("測距", "Đo khoảng cách"), L("規格表上沒有，距離是算出來的，而且要假設路面是平的", "Không có trong bảng"), null]);
  }
  if (c.modes) {
    html += `<div class="res" style="margin-top:6px;font-size:11.5px">
      ${L("這一顆的兩個數字在規格表上是<b>可以設定的</b>，換一個模式結果就不一樣：",
           "Hai thông số này hãng ghi là <b>có thể cấu hình</b>:")}
      <div class="grid g2" style="margin-top:5px">
        <select id="mCols">${c.modes.cols.map((x) => `<option value="${x}"${x === cols ? " selected" : ""}>${x} ${L("點／圈", "điểm/vòng")}</option>`).join("")}</select>
        <select id="mHz">${hzOpts(c).map((x) => `<option value="${x}"${x === hzNow ? " selected" : ""}>${x} Hz</option>`).join("")}</select>
      </div></div>
      ${hzOpts(c).length < c.modes.hz.length ? `<div class="hint" style="font-size:11px;color:var(--amber);margin-top:4px">${L(
        `${cols} 點／圈<b>只有 ${hzOpts(c).join(" / ")} Hz</b>——規格書的 Lidar Operating Modes 就是這樣寫的，要最密的點就得轉慢一點。`,
        `${cols} điểm/vòng <b>chỉ có ${hzOpts(c).join(" / ")} Hz</b> — bảng Lidar Operating Modes ghi vậy: muốn dày điểm thì phải quay chậm lại.`)}</div>` : ""}</div>`;
  }
  html += lines.map(([a, b, good]) => `<div class="row" style="border:1px solid var(--line);border-radius:6px;margin-top:5px;background:#fff">
      <div class="k" style="flex:0 0 46%">${a}</div>
      <div class="v" style="color:${good === null ? "var(--mute)" : good ? "var(--ok)" : "var(--red)"}">${b}</div></div>`).join("");
  html += `<div class="hint" style="font-size:11px;color:var(--mute);margin-top:6px">${L(
    "灰色那幾行<b>不是門檻</b>，是算給你看的代價；只有綠色和紅色的行在決定夠不夠。",
    "Các dòng màu xám <b>không phải ngưỡng</b>, chỉ cho bạn thấy cái giá phải trả; chỉ dòng xanh và đỏ mới quyết định.")}</div>`;
  html += `<div class="verdict ${ok ? "pass" : "fail"}">${ok
    ? L("這一顆在這個情境撐得住。接下來要問的是價錢、功耗和裝得上去嗎。", "Model này đủ dùng. Câu hỏi tiếp theo là giá, điện và chỗ lắp.")
    : L("這一顆在這個情境不夠用。上面紅色那一行就是卡住的地方。", "Không đủ. Dòng màu đỏ ở trên là chỗ bị chặn.")}</div>`;
  // 作業搬到獨立的一頁了（week5/hw/）：在那一頁點「型號 × 情境」的任一格，
  // 判讀就在那一格底下展開，看完直接選夠／不夠。這裡只留一條路過去，
  // 不要再有「在這邊按、去那邊看」的兩套流程——學生就是被那個繞昏的。
  html += `<a class="hwlink" href="${HW_URL}" target="_blank" rel="noopener">${L(
    "作業在另一頁　→", "Bài nộp ở trang khác　→")}</a>`;
  $("calc").innerHTML = html;
  if (c.modes) {
    $("mCols").onchange = (e) => {
      cols = +e.target.value;
      // 從 1024 @ 20 Hz 切到 2048 的時候，20 Hz 已經不存在了——
      // 不收回來的話畫面上會留著一個規格書上沒有的模式。
      const ok = hzOpts(c);
      if (!ok.includes(hzNow)) hzNow = ok[0];
      calc();
    };
    $("mHz").onchange = (e) => { hzNow = +e.target.value; calc(); };
  }
}
function sceneBtns() {

    `<button data-sce="${k}" class="${k === scene ? "on" : ""}">${L(s.zh, s.vi)}
      <span class="vi">${s.v} km/h</span></button>`).join("");
  $("sceBtns").querySelectorAll("[data-sce]").forEach((b) =>
    b.onclick = () => { scene = b.dataset.sce; sceneBtns(); calc(); });
  const s2 = SCENES[scene];

    `Phanh <b>${brake(s2.v).toFixed(0)} m</b> → phải thấy <b>${(brake(s2.v) + 5).toFixed(0)} m</b>　${s2.viNote}`);
}

function drawScene(fov) {
  const c = $("cScene"), g = c.getContext("2d");
  g.imageSmoothingEnabled = true;
  if (!LENS_IMG.complete || !LENS_IMG.naturalWidth) return;
  const frac = Math.min(1, fov / LENS_FOV);
  const sw = LENS_IMG.naturalWidth * frac, sh = LENS_IMG.naturalHeight * frac;
  const sx = (LENS_IMG.naturalWidth - sw) / 2, sy = (LENS_IMG.naturalHeight - sh) / 2;
  g.clearRect(0, 0, c.width, c.height);
  g.drawImage(LENS_IMG, sx, sy, sw, sh, 0, 0, c.width, c.height);
}

function drawBike(fov) {
  const c = $("cBike"), g = c.getContext("2d");
  if (!LENS_IMG.complete || !LENS_IMG.naturalWidth) return 0;
  // 畫布固定代表感光元件上 VIEW_PX 個像素（像 1:1 檢視）。
  // 這樣機車會照實際比例縮放：愈廣角，同一台機車佔的像素愈少，看起來就愈小。
  const px = BIKE_ANG / (fov / 2048);               // 機車佔幾個感光元件像素
  const span = BIKE_W * (VIEW_PX / px);             // 這個視窗在原圖上有多寬
  const cx = LENS_IMG.naturalWidth / 2, cy = LENS_IMG.naturalHeight / 2 + BIKE_DY;
  // 原圖本身只有這麼多像素，超過就夾住——再放大是假細節
  const n = Math.max(3, Math.min(VIEW_PX, Math.round(span)));
  LENS_CAPPED = VIEW_PX > Math.round(span);
  const off = document.createElement("canvas");
  off.width = n; off.height = n;
  const og = off.getContext("2d");
  og.imageSmoothingEnabled = true;
  og.drawImage(LENS_IMG, cx - span / 2, cy - span / 2, span, span, 0, 0, n, n);
  // 原圖撐得住的範圍內用方塊放大，看得出一格一格（那是真的感光元件像素）；
  // 已經到頂的時候改用平滑，否則長焦會比短焦還方塊，學生會誤以為長焦比較差
  g.imageSmoothingEnabled = LENS_CAPPED;
  g.clearRect(0, 0, c.width, c.height);
  g.drawImage(off, 0, 0, n, n, 0, 0, c.width, c.height);
  // 框出那台機車，角落標它佔幾個像素。不框的話，廣角那端只看到一小團，
  // 學生不知道該看畫面裡的哪一個東西，也就看不出「同一台車愈來愈小」。
  const bw = c.width * BIKE_W / span, bh = c.height * BIKE_H / span;
  g.strokeStyle = "#ffd166"; g.lineWidth = 2;
  g.strokeRect(Math.round((c.width - bw) / 2) + 0.5, Math.round((c.height - bh) / 2) + 0.5,
               Math.round(bw), Math.round(bh));
  const lab = `${Math.round(px)} px`;
  g.font = "bold 13px Arial";
  g.fillStyle = "rgba(11,31,58,.8)";
  g.fillRect(4, 4, g.measureText(lab).width + 12, 21);
  g.fillStyle = "#ffd166"; g.fillText(lab, 10, 19);
  return px;
}

function miniF() {
  const f = +$("sF").value, w = 2048 * 3.0 / 1000;
  const fov = 2 * Math.atan(w / 2 / f) / R;
  $("vF").textContent = f.toFixed(1);
  drawScene(fov);
  const px = drawBike(fov);
  const cap = LENS_CAPPED
    ? L(`<span class="hint">下面那張已經到頂：原圖裡那台機車本身只有約 ${BIKE_W} 像素寬，比這更長的焦距模擬不出更多細節（上面的取景和下面的數字仍然正確）。</span>`,
        `<span class="hint">Hình dưới đã tới hạn: xe trong ảnh gốc chỉ rộng khoảng ${BIKE_W} điểm ảnh.</span>`)
    : "";
  $("oF").innerHTML = cap + L(
    `視野 <b>${fov.toFixed(1)}°</b>　每像素 <b>${(fov / 2048).toFixed(4)}°</b><br>40 公尺外那台機車只剩 <b>${px.toFixed(0)} 像素</b>寬。焦距加倍 → 視野減半，看得準但看得窄。`,
    `Góc nhìn <b>${fov.toFixed(1)}°</b>　mỗi điểm ảnh <b>${(fov / 2048).toFixed(4)}°</b><br>Xe máy ở 40 m chỉ còn <b>${px.toFixed(0)} điểm ảnh</b>. Tiêu cự gấp đôi → góc nhìn giảm nửa.`);
}

function miniScope() {
  Object.entries(MINI_FOR).forEach(([k, f]) => {
    const el = $("sc" + k);
    if (!el) return;
    const fit = f.ok.includes(model);
    el.className = "scope" + (fit ? "" : " bad");
    el.innerHTML = fit ? L(f.zh, f.vi)
      : L(`⚠ 你現在選的是 <b>${MODELS[model].name}</b>。${f.badZh}`,
          `⚠ Bạn đang chọn <b>${MODELS[model].name}</b>. ${f.badVi}`);
  });
}

function miniP() {
  const ch = CHS[+$("sCh").value], col = COLS[+$("sCol").value], hz = HZS[+$("sHz").value];
  $("vCh").textContent = ch; $("vCol").textContent = col; $("vHz").textContent = hz;
  const pts = ch * col * hz, dh = 360 / col;
  const D = drawDots(ch, col);
  // 轉速不會改變上面那張圖：同一圈裡的點距只由線束數和每圈點數決定。
  // 學生拉轉速看到圖沒反應會以為壞掉，所以直接寫出來。
  const bad2048 = (col === 2048 && hz === 20);
  // 三個數字各自把算式寫出來——只給結果，學生看不出是怎麼算的
  const gap = 40 * Math.tan(dh * R);
  const row = (lab, expr) => `<div class="calc"><i>${lab}</i><code>${expr}</code></div>`;
  const calc = (zh) => row(zh ? "每秒點數" : "Điểm/giây",
                           `${ch} ${zh ? "線" : "kênh"} × ${col} ${zh ? "點/圈" : "điểm/vòng"}`
                           + ` × ${hz} ${zh ? "圈/秒" : "vòng/giây"} ＝ <b>${pts.toLocaleString()}</b>`)
    + row(zh ? "水平角解析度" : "Góc ngang",
          `360° ÷ ${col} ＝ <b>${dh.toFixed(3)}°</b>`)
    + row(zh ? "垂直角解析度" : "Góc dọc",
          `42.4° ÷ (${ch} − 1) ＝ <b>${D.dv.toFixed(3)}°</b>`)
    + row(zh ? "40 m 處點距" : "Cách nhau ở 40 m",
          `40 m × tan(${dh.toFixed(3)}°) ＝ <b>${gap.toFixed(2)} m</b>`)
    + row(zh ? "機車橫向幾個" : "Theo chiều ngang",
          `${BIKE_ANG_W.toFixed(2)}° ÷ ${dh.toFixed(3)}° ＝ ${D.rh.toFixed(2)} → <b>${D.nh}</b>`)
    + row(zh ? "機車縱向幾排" : "Theo chiều dọc",
          `${BIKE_ANG_H.toFixed(2)}° ÷ ${D.dv.toFixed(3)}° ＝ ${D.rv.toFixed(2)} → <b>${D.nv}</b>`)
    + row(zh ? "機車上的點數" : "Số điểm trên xe",
          `${D.nh} × ${D.nv} ＝ <b>${D.n}</b>`);
  $("oP").innerHTML = L(
    calc(true)
    + `<span class="hint">那台機車 0.8 × 1.6 公尺、放在 40 公尺外，張角是寬 ${BIKE_ANG_W.toFixed(2)}°、高 ${BIKE_ANG_H.toFixed(2)}°（2 × atan(半邊 ÷ 40)）；除以角解析度，小數點後面**無條件捨去**——打不到就是打不到，沒有半個點這種東西。</span>`
    + `<span class="hint">轉速只改「每秒幾點」和一秒給你幾張這樣的圖（現在 ${hz} 張）；<b>上面那張圖不會變</b>——同一圈裡的點距是線束數和每圈點數決定的，和轉速無關。</span>`
    + (bad2048 ? `<span class="warn">⚠ OS1 的規格表上，2048 點／圈只有 10 Hz 這個模式，配不了 20 Hz。</span>` : ""),
    calc(false)
    + `<span class="hint">Xe 0.8 × 1.6 m ở 40 m có góc rộng ${BIKE_ANG_W.toFixed(2)}°, cao ${BIKE_ANG_H.toFixed(2)}° (2 × atan(nửa cạnh ÷ 40)); chia cho góc phân giải rồi <b>làm tròn xuống</b> — không có nửa điểm.</span>`
    + `<span class="hint">Tốc độ quay chỉ đổi số điểm/giây và số ảnh mỗi giây (${hz}); <b>hình trên không đổi</b> — khoảng cách điểm trong một vòng do số kênh và số điểm mỗi vòng quyết định.</span>`
    + (bad2048 ? `<span class="warn">⚠ Trên datasheet OS1, 2048 điểm/vòng chỉ có chế độ 10 Hz.</span>` : ""));
}
// ② 40 公尺的機車上落幾個點：算法和下面判定區那一段一模一樣，數字才不會各說各話
const BIKE = { w: 0.8, h: 1.6 }, DOT_D = 40, OS1_VFOV = 42.4;
function drawDots(ch, cols) {
  const c = $("cDots"), g = c.getContext("2d");
  g.clearRect(0, 0, c.width, c.height);
  const dv = OS1_VFOV / (ch - 1), dh = 360 / cols;
  const rv = 2 * Math.atan(BIKE.h / 2 / DOT_D) / R / dv;      // 還沒捨去的商
  const rh = 2 * Math.atan(BIKE.w / 2 / DOT_D) / R / dh;
  const nv = Math.max(0, Math.floor(Math.min(ch, rv)));
  const nh = Math.max(0, Math.floor(rh));
  // 背景放那張河內底圖裡的機車，壓暗一點，讓亮點看得清楚
  if (LENS_IMG.complete && LENS_IMG.naturalWidth) {
    const span = BIKE_W * 2.2;
    const sx = (LENS_IMG.naturalWidth - span) / 2;
    const sy = (LENS_IMG.naturalHeight - span * 0.75) / 2 + BIKE_DY;
    g.drawImage(LENS_IMG, sx, sy, span, span * 0.75, 0, 0, c.width, c.height);
    g.fillStyle = "rgba(10,20,34,.55)"; g.fillRect(0, 0, c.width, c.height);
  }
  // 機車的框：畫面中央，寬度抓畫布的 36%（對應 0.8 m）
  const bw = c.width * 0.36, bh = bw * (BIKE.h / BIKE.w);
  const bx = (c.width - bw) / 2, by = (c.height - bh) / 2;
  g.strokeStyle = "rgba(255,255,255,.55)"; g.lineWidth = 1;
  g.strokeRect(bx, by, bw, bh);
  g.fillStyle = "#ffd166";
  for (let r = 0; r < nv; r++) {
    for (let k = 0; k < nh; k++) {
      const x = bx + bw * (k + 0.5) / nh, y = by + bh * (r + 0.5) / nv;
      g.beginPath(); g.arc(x, y, 2.6, 0, 6.283); g.fill();
    }
  }
  g.fillStyle = "#fff"; g.font = "bold 13px Arial";
  g.fillText(`${nv * nh}`, 8, 20);
  g.font = "10px Arial"; g.fillText(L("個點", "điểm"), 8 + (nv * nh > 9 ? 18 : 10), 20);
  return { n: nv * nh, nv, nh, rv, rh, dv, dh };
}

// 40 公尺外那台機車張開多少角度：2 × atan(半邊 ÷ 距離)。寬高分開算。
const BIKE_ANG_H = 2 * Math.atan(BIKE.h / 2 / DOT_D) / R;
const BIKE_ANG_W = 2 * Math.atan(BIKE.w / 2 / DOT_D) / R;

// ③ 距離條：白色車到 170 m、黑色車到 90 m，拉滑桿看這個距離誰還看得到
const REF = { white: 170, black: 90, max: 200 };
function drawRef(d) {
  const c = $("cRef"), g = c.getContext("2d");
  g.clearRect(0, 0, c.width, c.height);
  const L0 = 40, R0 = c.width - 12, span = R0 - L0;
  const atX = (m) => L0 + span * Math.min(m, REF.max) / REF.max;

  // 距離軸：0 到 200 公尺，標出兩個測距終點
  g.strokeStyle = "#c8d2db"; g.lineWidth = 1;
  g.beginPath(); g.moveTo(L0, 18); g.lineTo(R0, 18); g.stroke();
  g.fillStyle = "#5f7183"; g.font = "9px Arial";
  [0, 50, 100, 150, 200].forEach((m) => {
    g.beginPath(); g.moveTo(atX(m), 14); g.lineTo(atX(m), 18); g.stroke();
    g.fillText(String(m), atX(m) - (m ? 7 : 2), 11);
  });

  // 一台車：in 為真就正常畫，假的話畫成虛線空殼（路上明明有，光達看不到）
  const car = (x, y, body, roof, inRange) => {
    const w = 22, h = 11;
    g.save();
    if (!inRange) { g.setLineDash([3, 2]); g.strokeStyle = "#b6c0ca"; g.lineWidth = 1; }
    else { g.fillStyle = body; }
    const rr = (x0, y0, w0, h0, r) => {
      g.beginPath();
      g.moveTo(x0 + r, y0); g.arcTo(x0 + w0, y0, x0 + w0, y0 + h0, r);
      g.arcTo(x0 + w0, y0 + h0, x0, y0 + h0, r); g.arcTo(x0, y0 + h0, x0, y0, r);
      g.arcTo(x0, y0, x0 + w0, y0, r); g.closePath();
    };
    rr(x - w / 2, y - h / 2, w, h, 3);
    if (inRange) { g.fill(); g.strokeStyle = "#5f7183"; g.lineWidth = 0.8; g.stroke();
      g.fillStyle = roof; rr(x - w / 2 + 5, y - h / 2 + 2, w - 10, h - 4, 2); g.fill(); }
    else { g.stroke(); g.fillStyle = "#c0392b"; g.font = "bold 11px Arial";
      g.fillText("\u2715", x - 4, y + 4); }
    g.restore();
  };

  [["80%", REF.white, "#f2f5f8", "#cfd9e2", 46], ["10%", REF.black, "#26303a", "#121a22", 84]]
    .forEach(([tag, reach, body, roof, y]) => {
      g.fillStyle = "#eef2f6"; g.fillRect(L0, y - 10, span, 20);     // 車道
      g.fillStyle = "#dceaf3"; g.fillRect(L0, y - 10, atX(reach) - L0, 20);  // 看得到的那一段
      g.strokeStyle = "#9db2c4"; g.setLineDash([2, 3]); g.lineWidth = 1;
      g.beginPath(); g.moveTo(atX(reach), y - 10); g.lineTo(atX(reach), y + 10); g.stroke();
      g.setLineDash([]);
      g.fillStyle = "#5f7183"; g.font = "9px Arial"; g.fillText(tag, 6, y + 3);
      g.fillStyle = "#0b1f3a"; g.font = "bold 9px Arial";
      g.fillText(`${reach} m`, Math.min(atX(reach) + 2, c.width - 32), y - 13);
      car(atX(d), y, body, roof, d <= reach);
    });

  // 目前的目標距離
  g.strokeStyle = "#c0392b"; g.setLineDash([3, 3]); g.lineWidth = 1;
  g.beginPath(); g.moveTo(atX(d), 20); g.lineTo(atX(d), 100); g.stroke(); g.setLineDash([]);
  g.fillStyle = "#c0392b"; g.font = "bold 10px Arial";
  g.fillText(`${d} m`, Math.max(2, Math.min(atX(d) - 12, c.width - 30)), 112);
}

function miniR() {
  const d = +$("sD").value;
  $("vD").textContent = d;
  drawRef(d);
  const w = d <= REF.white, b = d <= REF.black;
  const mark = (ok) => ok ? "✓" : "✗";
  $("oR").innerHTML = L(
    `OS1：白色（80%）<b>170 m</b>，黑色（10%）只剩 <b>90 m</b>。<br>` +
    `${d} m 的目標：白色車 <b>${mark(w)}</b>　黑色車 <b>${mark(b)}</b>` +
    (w && !b ? `　← <b>同一個距離，換個顏色就看不到了</b>` : "") +
    `<br>看到「測距 170 m」要追問：<b>對什麼顏色量的？</b>`,
    `OS1: vật trắng (80%) <b>170 m</b>, vật đen (10%) chỉ <b>90 m</b>.<br>` +
    `Mục tiêu ở ${d} m: xe trắng <b>${mark(w)}</b>　xe đen <b>${mark(b)}</b>` +
    (w && !b ? `　← <b>cùng khoảng cách, đổi màu là không thấy</b>` : "") +
    `<br>Thấy «170 m» phải hỏi: đo với màu gì?`);
}

function render() { modelBtns(); dsTable(); quiz(); sceneBtns(); calc(); miniScope(); }
function applyLang() {
  document.querySelectorAll("[data-zh]").forEach((el) => { el.textContent = el.dataset[LANG]; });
  document.title = L("規格判讀台", "Bàn đọc thông số");
  $("btnTr").classList.toggle("on", TR); $("btnEn").classList.toggle("on", !TR);
  $("btnZh").classList.toggle("on", LANG === "zh");
  $("btnVi").classList.toggle("on", LANG === "vi");
  render(); miniF(); miniP(); miniR();
}
$("btnZh").onclick = () => { LANG = "zh"; applyLang(); };
$("btnVi").onclick = () => { LANG = "vi"; applyLang(); };
$("btnTr").onclick = () => { TR = true; $("btnTr").classList.add("on"); $("btnEn").classList.remove("on"); dsTable(); };
$("btnEn").onclick = () => { TR = false; $("btnEn").classList.add("on"); $("btnTr").classList.remove("on"); dsTable(); };
$("btnCheck").onclick = check;
$("btnClear").onclick = () => {   // 「重來」只清這一個型號，別的型號答過的留著
  QUIZ.forEach((q) => delete QANS[model + "_" + q.k]);
  delete QCHK[model]; qSave(); quiz();
};
["sF"].forEach((id) => $(id).addEventListener("input", miniF));
["sCh", "sCol", "sHz"].forEach((id) => $(id).addEventListener("input", miniP));
$("sD").addEventListener("input", miniR);
// 手機：三個分頁
const MOBILE = window.matchMedia("(max-width:900px)");
const TAB_Y = {};
let tabNow = "ds";
function tab(name) {
  if (MOBILE.matches) TAB_Y[tabNow] = window.scrollY;   // 離開前記下來
  tabNow = name;
  document.querySelectorAll("#mtabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === name));
  const map = { ds: "pDs", read: "pRead", mini: "pMini" };
  Object.entries(map).forEach(([k, id]) => { $(id).style.display = (!MOBILE.matches || k === name) ? "" : "none"; });
  if (MOBILE.matches) window.scrollTo(0, TAB_Y[name] || 0);   // 回來停在原來的位置
}
document.querySelectorAll("#mtabs button").forEach((b) => b.onclick = () => tab(b.dataset.tab));
MOBILE.addEventListener("change", () => tab(MOBILE.matches ? "ds" : "ds"));

applyLang();
tab("ds");
</script>
</body>
