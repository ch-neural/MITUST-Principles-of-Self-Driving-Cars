công nghiệp, tốt hơn cấp điện thoại 200 lần."],["隧道裡用 ZED-F9P 的 RTK 就可以了，它的精度是 1 公分。","Trong hầm dùng RTK của ZED-F9P là được, độ chính xác 1 cm."],["IMU 不好用。","IMU không tốt."]], HW_TF = [["① 雷達測距 250 公尺，所以 150 公尺外的車，它一定知道在哪一個車道。","① Radar đo 250 m, nên xe ở 150 m nó chắc chắn biết ở làn nào."],["② 超音波量不到 5 公尺以外的東西，所以它沒有用。","② Siêu âm không đo được quá 5 m, nên nó vô dụng."],["③ 規格表寫精度 2.5 m，表示每一次定位的誤差都不會超過 2.5 m。","③ Bảng ghi độ chính xác 2,5 m, nghĩa là mỗi lần định vị sai số không vượt 2,5 m."],["④ IMU 不靠外界，所以隧道裡靠它就夠了。","④ IMU không cần bên ngoài, nên trong hầm chỉ cần nó là đủ."]], HW_WHY = [[["測距夠不代表分得出車道：1.6° 在 150 公尺攤成 4.2 公尺，比一個車道（3.5 m）還寬。","Tầm đo đủ không có nghĩa là biết làn: 1,6° ở 150 m rộng 4,2 m, hơn một làn (3,5 m)."],["因為雷達在下雨的時候看不到。","Vì radar không thấy khi mưa."],["因為 150 公尺超過它的近場 70 公尺。","Vì 150 m vượt vùng gần 70 m."],["測距寫 250 公尺就是 250 公尺內什麼都量得準，包括在哪一道。","Ghi 250 m là trong 250 m cái gì cũng đo đúng, kể cả làn."]],[["停車場時速 5、2 公尺內，它最便宜又夠用；每一種感測器各有自己的情境，沒有一種三個情境都贏。","Bãi đỗ xe 5 km/h, trong 2 m, nó rẻ nhất mà đủ; mỗi cảm biến có tình huống riêng, không cái nào thắng cả ba."],["因為它可以換成更貴的型號，量到 50 公尺。","Vì có thể đổi sang loại đắt hơn đo 50 m."],["因為它比光達準。","Vì nó chính xác hơn lidar."],["看不到 5 公尺以外的感測器，裝在車上根本沒有意義。","Cảm biến không thấy quá 5 m thì gắn lên xe vô nghĩa."]],[["CEP 是 50%：一半的定位點在 2.5 公尺內，另一半在外面。跟上週「>90% detection probability」一樣，是機率，不是保證。","CEP là 50%: một nửa số điểm trong 2,5 m, nửa kia ngoài. Giống «>90% detection probability» tuần trước: xác suất, không phải bảo đảm."],["因為精度要看天氣，下雨會變差。","Vì độ chính xác tuỳ thời tiết, mưa thì kém."],["因為那是在實驗室量的，路上量不到。","Vì đo trong phòng thí nghiệm, ra đường thì không."],["規格表上的數字就是廠商保證的上限，寫 2.5 m 就不會超過 2.5 m。","Số trong bảng là giới hạn hãng bảo đảm, ghi 2,5 m thì không vượt 2,5 m."]],[["它會漂：橫向誤差隨時間平方長，8 °/h 的在時速 80 下 34 秒就偏 0.5 公尺；隧道要靠別的東西補。","Nó trôi: sai số ngang tăng theo bình phương thời gian; loại 8 °/h ở 80 km/h sau 34 s đã lệch 0,5 m; trong hầm phải nhờ thứ khác."],["因為隧道裡沒有光，IMU 看不到。","Vì trong hầm không có ánh sáng, IMU không thấy."],["因為 IMU 的更新率太慢。","Vì tốc độ cập nhật của IMU quá chậm."],["IMU 完全不靠外界，所以外界怎麼變它都不會錯。","IMU hoàn toàn không cần bên ngoài, nên bên ngoài thế nào nó cũng không sai."]]];

<script>
/* 判定：一顆感測器放進一個情境，夠不夠用。判讀台和作業頁都直接嵌這一個檔，
 * 所以兩邊永遠是同一套算式（src/verify_hw.js 還是會逐格比對一次）。
 *
 * 寫成純瀏覽器 JS，不用任何外面的東西；build_*.js 把這個檔的原文塞進 <script>。
 * Node 要用的時候 require 進來（最後一行）。
 *
 *   judge(m, s, C, L, opt) → { ok, kind, head, lines, pts }
 *     m    型號（MODELS[k]），用 m.calc
 *     s    情境（SCENES[k]）
 *     C    門檻（CONST）
 *     L    (zh, vi) => 目前語言的那一句
 *     opt  { cols, hz }：OS1 的可設定模式
 *   lines 的每一項是 [標籤, 說明, good]，good 是 true／false／null（灰色：只是代價，不是門檻）／"warn"
 *   kind  "see"（看得到東西嗎）／"pos"（知道自己在哪嗎）／"hold"（撐得過沒衛星的這段嗎）
 */
const R = Math.PI / 180;
const brake = (v) => { const ms = v / 3.6; return ms * 0.3 + ms * ms / 12; };
const fmt = (x, n) => (Math.round(x * Math.pow(10, n)) / Math.pow(10, n)).toFixed(n);

function judge(m, s, C, L, opt) {
  const c = m.calc, T = s.tgt, v = s.v / 3.6;
  const need = brake(s.v) + s.margin, rm = Math.max(need, s.d);
  const lines = [];
  let ok = true, pts = 0, kind = "see", head = {};
  const seeHead = () => ({ brake: brake(s.v), need, rm, margin: s.margin });

  if (c.type === "lidar") {
    head = seeHead();
    const cols = opt && opt.cols ? opt.cols : (c.modes ? 1024 : c.cols);
    const hz = c.modes ? (opt && opt.hz ? opt.hz : 10) : c.hz;
    const dv = c.dv || c.vfov / (c.ch - 1);
    const dh = c.dh || c.hfov / (c.modes ? cols : c.cols);
    pts = (() => {
      const nv = Math.min(c.ch, 2 * Math.atan(T.h / 2 / s.d) / R / dv);
      const nh = 2 * Math.atan(T.w / 2 / s.d) / R / dh;
      return Math.max(0, Math.floor(nv)) * Math.max(0, Math.floor(nh));
    })();
    const reach = c.range10 >= rm;
    if (!reach) ok = false;
    lines.push([L("測距 " + c.range10 + " m", "Tầm " + c.range10 + " m"),
      reach ? L("夠，門檻 " + rm.toFixed(0) + " m", "Đủ, ngưỡng " + rm.toFixed(0) + " m")
            : L("不夠，門檻 " + rm.toFixed(0) + " m，差 " + (rm - c.range10).toFixed(0) + " m",
                "Thiếu " + (rm - c.range10).toFixed(0) + " m so với ngưỡng " + rm.toFixed(0) + " m"), reach]);
    lines.push([L("角解析度 " + dh.toFixed(2) + "° × " + dv.toFixed(2) + "°", "Phân giải " + dh.toFixed(2) + "° × " + dv.toFixed(2) + "°"),
      L(s.d + " m 的" + T.zh + "身上有 " + pts + " 個點，門檻 " + C.MIN_PTS + " 個",
        T.vi + " ở " + s.d + " m có " + pts + " điểm, ngưỡng " + C.MIN_PTS), pts >= C.MIN_PTS]);
    if (pts < C.MIN_PTS) ok = false;
    lines.push([L("更新率 " + hz + " Hz", hz + " Hz"),
      L("每 " + (1000 / hz).toFixed(0) + " 毫秒一張；這段時間車子前進 " + (v / hz).toFixed(1) + " m",
        "Mỗi " + (1000 / hz).toFixed(0) + " ms một khung; xe đi " + (v / hz).toFixed(1) + " m"), null]);

  } else if (c.type === "cam") {
    head = seeHead();
    const fov = 2 * Math.atan(c.px * c.pitch / 1000 / 2 / c.f) / R;
    const th = fov / c.px * R;
    const err = s.d * s.d * th / c.h;
    lines.push([L("配 " + c.f + " mm 鏡頭 → 視野 " + fov.toFixed(0) + "°", "Ống kính " + c.f + " mm → " + fov.toFixed(0) + "°"),
      L("感測器規格表沒有視野，是鏡頭決定的", "Bảng cảm biến không có góc nhìn"), null]);
    lines.push([L("每像素 " + (fov / c.px).toFixed(4) + "°", "Mỗi điểm ảnh " + (fov / c.px).toFixed(4) + "°"),
      L(s.d + " m 處估距誤差 ±" + err.toFixed(2) + " m，門檻 ±" + C.MAX_ERR + " m",
        "Sai số ở " + s.d + " m: ±" + err.toFixed(2) + " m, ngưỡng ±" + C.MAX_ERR + " m"), err < C.MAX_ERR]);
    if (err >= C.MAX_ERR) ok = false;
    lines.push([L("更新率 60 fps", "60 fps"),
      L("每 17 毫秒一張；這段時間車子前進 " + (v / 60).toFixed(2) + " m", "Mỗi 17 ms; xe đi " + (v / 60).toFixed(2) + " m"), null]);
    lines.push([L("測距", "Đo khoảng cách"),
      L("規格表上沒有，距離是算出來的，而且要假設路面是平的", "Không có trong bảng"), null]);

  } else if (c.type === "radar") {
    head = seeHead();
    const reach = c.rangeFar >= rm;
    if (!reach) ok = false;
    lines.push([L("測距 " + c.rangeFar + " m（遠場）", "Tầm " + c.rangeFar + " m (vùng xa)"),
      reach ? L("夠，門檻 " + rm.toFixed(0) + " m", "Đủ, ngưỡng " + rm.toFixed(0) + " m")
            : L("不夠，門檻 " + rm.toFixed(0) + " m", "Thiếu so với ngưỡng " + rm.toFixed(0) + " m"), reach]);
    if (c.fovNear != null) {
      const near = s.d <= c.rangeNear;
      lines.push([L("視野", "Góc nhìn"),
        near ? L(s.d + " m 在近場：±" + c.fovNear + "°，近場測距 " + c.rangeNear + " m", s.d + " m thuộc vùng gần: ±" + c.fovNear + "°, tầm " + c.rangeNear + " m")
             : L(s.d + " m 已經在遠場：只有 ±" + c.fovFar + "°，側面切進來的看不到", s.d + " m thuộc vùng xa: chỉ ±" + c.fovFar + "°, không thấy xe cắt ngang từ bên"),
        near ? null : "warn"]);
    } else {
      lines.push([L("視野 ±" + c.fovFar + "°", "Góc nhìn ±" + c.fovFar + "°"),
        L("一組視野管到底，沒有分遠近場", "Một góc nhìn cho mọi khoảng cách"), null]);
    }
    const sep = s.d * Math.tan(c.azRes * R);
    const lane = sep <= C.LANE_W;
    if (!lane) ok = false;
    lines.push([L("角解析度 " + c.azRes + "°" + (c.azResNote ? "（" + c.azResNote[0] + "）" : ""),
                  "Phân giải " + c.azRes + "°" + (c.azResNote ? " (" + c.azResNote[1] + ")" : "")),
      L(s.d + " m 處一束攤成 " + sep.toFixed(1) + " m，" + (lane ? "比一個車道窄，分得出在哪一道" : "比一個車道還寬，分不出在哪一道") + "（門檻 " + C.LANE_W + " m）",
        "Ở " + s.d + " m chùm rộng " + sep.toFixed(1) + " m, " + (lane ? "hẹp hơn một làn, biết ở làn nào" : "rộng hơn một làn, không biết ở làn nào") + " (ngưỡng " + C.LANE_W + " m)"), lane]);
    const twoW = 1.0;
    lines.push([L("兩台並排的" + T.zh, "Hai " + T.vi + " đi song song"),
      sep < twoW ? L("相隔 1 m 分得開，是兩個目標", "Cách nhau 1 m vẫn tách được: hai mục tiêu")
                 : L("相隔 1 m 會黏成一個目標（一束 " + sep.toFixed(1) + " m 比縫還寬）", "Cách nhau 1 m sẽ dính thành một mục tiêu (chùm " + sep.toFixed(1) + " m rộng hơn khe)"), null]);
    lines.push([L("高度", "Độ cao"),
      c.elev ? L("量得出高度（準確度 ±" + c.elevAcc + "°）：分得出橋下的車和橋", "Đo được độ cao (±" + c.elevAcc + "°): tách được xe dưới cầu và cầu")
             : L("沒有高度：橋和橋下的車、路上的輪胎分不出來，容易把靜止的東西丟掉", "Không có độ cao: cầu và xe dưới cầu, lốp trên đường không tách được"), null]);
    lines.push([L("速度解析度 " + c.velRes + " km/h", "Phân giải tốc độ " + c.velRes + " km/h"),
      L("速度是直接量到的，不用等下一張畫面", "Tốc độ đo trực tiếp, không cần đợi khung sau"), null]);
    const hz = 1000 / c.cycle;
    lines.push([L("更新：每 " + c.cycle + " 毫秒一輪（" + hz.toFixed(0) + " Hz）", "Mỗi " + c.cycle + " ms một chu kỳ (" + hz.toFixed(0) + " Hz)"),
      L("這段時間車子前進 " + (v * c.cycle / 1000).toFixed(1) + " m", "Xe đi " + (v * c.cycle / 1000).toFixed(1) + " m"), null]);

  } else if (c.type === "sonar") {
    head = seeHead();
    const reach = c.rangeMax >= rm;
    if (!reach) ok = false;
    lines.push([L("測距 " + c.rangeMax + " m（最近 " + c.rangeMin + " m）", "Tầm " + c.rangeMax + " m (gần nhất " + c.rangeMin + " m)"),
      reach ? L("夠，門檻 " + rm.toFixed(0) + " m", "Đủ, ngưỡng " + rm.toFixed(0) + " m")
            : L("不夠，門檻 " + rm.toFixed(0) + " m，差 " + (rm - c.rangeMax).toFixed(1) + " m", "Thiếu " + (rm - c.rangeMax).toFixed(1) + " m so với ngưỡng " + rm.toFixed(0) + " m"), reach]);
    if (c.angle != null) {
      const wid = 2 * s.d * Math.tan(c.angle / 2 * R);
      lines.push([L("波束角 " + c.angle + "°", "Góc chùm " + c.angle + "°"),
        L(s.d + " m 處只蓋到 " + wid.toFixed(1) + " m 寬，車頭要裝好幾顆", "Ở " + s.d + " m chỉ phủ " + wid.toFixed(1) + " m, đầu xe phải gắn nhiều cái"), null]);
    } else {
      lines.push([L("波束角", "Góc chùm"), L("規格表上沒有這一行", "Bảng không có dòng này"), null]);
    }
    const rt = 2 * c.rangeMax / C.SOUND * 1000;
    const cyc = c.cycle || rt;
    lines.push([L("更新：聲速 " + C.SOUND + " m/s", "Tốc độ âm " + C.SOUND + " m/s"),
      L(c.rangeMax + " m 來回 " + rt.toFixed(0) + " 毫秒" + (c.cycle ? "；建議每 " + c.cycle + " 毫秒量一次" : "；表上沒寫週期") + "；這段時間車子前進 " + (v * cyc / 1000).toFixed(2) + " m",
        c.rangeMax + " m đi về " + rt.toFixed(0) + " ms" + (c.cycle ? "; nên đo mỗi " + c.cycle + " ms" : "") + "; xe đi " + (v * cyc / 1000).toFixed(2) + " m"), null]);
    if (s.v > 20) lines.push([L("車速", "Tốc độ"),
      L("時速 " + s.v + "：煞停 " + brake(s.v).toFixed(0) + " m 早就超過它看得到的距離——超音波是停車用的", "Ở " + s.v + " km/h, quãng phanh " + brake(s.v).toFixed(0) + " m đã vượt tầm nhìn của nó — siêu âm là để đỗ xe"), "warn"]);

  } else if (c.type === "gnss") {
    kind = "pos";
    let eff = null, how = "";
    if (s.sky === "none") { ok = false; }
    else if (s.sky === "open" && c.cepRTK != null) { eff = c.cepRTK + c.ppm * C.BASE_KM / 1000; how = "rtk"; }
    else { eff = c.cep; how = c.cepRTK != null ? "lost" : "plain"; }
    head = { sky: s.sky, eff, how };
    lines.push([L("天空", "Bầu trời"),
      L(s.skyZh, s.skyVi), s.sky === "none" ? false : s.sky === "canyon" ? "warn" : null]);
    if (s.sky === "none") {
      lines.push([L("精度", "Độ chính xác"), L("收不到衛星，沒有位置可言", "Không có vệ tinh, không có vị trí"), false]);
    } else {
      const good = eff <= C.POS_ERR;
      if (!good) ok = false;
      const txt = how === "rtk"
        ? L("RTK：0.01 m + 1 ppm，基準站 " + C.BASE_KM + " km → " + eff.toFixed(2) + " m，門檻 " + C.POS_ERR + " m", "RTK: 0,01 m + 1 ppm, trạm gốc " + C.BASE_KM + " km → " + eff.toFixed(2) + " m, ngưỡng " + C.POS_ERR + " m")
        : how === "lost"
        ? L("多路徑讓 RTK 失鎖，退回單機解 " + c.cep + " m CEP，門檻 " + C.POS_ERR + " m", "Đa đường làm mất RTK, còn " + c.cep + " m CEP, ngưỡng " + C.POS_ERR + " m")
        : L(c.cep + " m CEP（一半的點落在 " + c.cep + " m 內），門檻 " + C.POS_ERR + " m", c.cep + " m CEP (một nửa số điểm trong " + c.cep + " m), ngưỡng " + C.POS_ERR + " m");
      lines.push([L("精度", "Độ chính xác"), txt, good]);
    }
    lines.push([L("更新率 " + c.rate + " Hz", c.rate + " Hz"),
      L("每 " + (1000 / c.rate).toFixed(0) + " 毫秒一個位置；這段時間車子前進 " + (v / c.rate).toFixed(1) + " m",
        "Mỗi " + (1000 / c.rate).toFixed(0) + " ms một vị trí; xe đi " + (v / c.rate).toFixed(1) + " m"), null]);
    lines.push([L("冷開機 " + c.ttff + " 秒", "Khởi động lạnh " + c.ttff + " s"),
      L("開機後要等這麼久才有第一個位置", "Bật máy phải đợi chừng này mới có vị trí đầu tiên"), null]);

  } else if (c.type === "imu") {
    kind = "hold";
    const biasDh = c.bias != null ? c.bias : C.IMU_DPS * 3600;
    const b = biasDh / 3600 * R;
    const tHold = Math.sqrt(2 * C.POS_ERR / (v * b));
    head = { biasDh, tHold, outage: s.outage };
    lines.push([L("陀螺儀偏差", "Độ trôi con quay"),
      c.bias != null
        ? L(c.bias + " °/h（規格表 In-Run Bias Stability 那一行）", c.bias + " °/h (dòng In-Run Bias Stability)")
        : L("規格表沒有這一行；本課用溫度係數 " + c.zroTemp + " °/s/°C × " + C.IMU_DT + " °C = " + C.IMU_DPS + " °/s（" + biasDh + " °/h）估",
            "Bảng không có dòng này; lớp ước lượng " + c.zroTemp + " °/s/°C × " + C.IMU_DT + " °C = " + C.IMU_DPS + " °/s (" + biasDh + " °/h)"),
      c.bias != null ? null : "warn"]);
    const hold = tHold >= s.outage;
    if (!hold) ok = false;
    lines.push([L("撐多久", "Giữ được bao lâu"),
      L("橫向誤差 ≈ 車速 × 偏差 × t² ÷ 2 → " + tHold.toFixed(0) + " 秒內偏不到 " + C.POS_ERR + " m；這裡要撐 " + s.outage + " 秒（" + s.outZh + "）",
        "Sai số ngang ≈ v × trôi × t² ÷ 2 → " + tHold.toFixed(0) + " s mới lệch " + C.POS_ERR + " m; ở đây cần " + s.outage + " s (" + s.outVi + ")"), hold]);
    lines.push([L("更新率 " + c.rate + " Hz", c.rate + " Hz"),
      L("一秒給幾百到上千次，隧道裡照常工作——它不靠外界", "Hàng trăm đến hàng nghìn lần mỗi giây, trong hầm vẫn chạy — không cần bên ngoài"), null]);
  }
  return { ok, kind, head, lines, pts };
}


</script>
<script>
// 第六週作業頁的畫面程式。資料與 judge() 由 build_hw.js 先塞進頁面。
const $ = (id) => document.getElementById(id);
let ZH = true;
const L = (zh, vi) => (ZH ? zh : vi);

// ── 存檔：存在這台裝置上，切分頁或關掉再開都還在 ──
const HW_KEY = "w6hw";
const blank = () => ({ name: "", sid: "", g: {}, concl: "", tf: [["", ""], ["", ""], ["", ""], ["", ""]] });
let HW = blank();
try { const r = localStorage.getItem(HW_KEY); if (r) HW = Object.assign(blank(), JSON.parse(r)); } catch (e) {}
const save = () => { try { localStorage.setItem(HW_KEY, JSON.stringify(HW)); } catch (e) {} };

const cls = (g) => (g === null ? "n" : g === "warn" ? "warn" : g ? "good" : "bad");
const mark = (g) => (g === null ? "" : g === "warn" ? "　⚠" : g ? "　✓" : "　✗");

// 判讀區的 HTML：和判讀台用同一個 judge()，抬頭依「這一顆在回答哪一種問題」換
function calcHtml(mk, sk) {
  const m = MODELS[mk], s = SCENES[sk];
  const r = judge(m, s, CONST, L, { cols: DEF_COLS, hz: DEF_HZ });
  let h = '<div class="res"><b>' + m.name + " × " + L(s.zh, s.vi) + "</b>　";
  if (r.kind === "see") {
    h += L(s.zhNote, s.viNote) + '<span class="big">' +
      L("煞停要 " + r.head.brake.toFixed(1) + " m，加餘裕 " + r.head.margin + " m → " + r.head.need.toFixed(1) + " m；目標在 " + s.d + " m　→　測距門檻 " + r.head.rm.toFixed(0) + " m",
        "Dừng " + r.head.brake.toFixed(1) + " m, cộng dự phòng " + r.head.margin + " m → " + r.head.need.toFixed(1) + " m; vật ở " + s.d + " m → ngưỡng " + r.head.rm.toFixed(0) + " m") + "</span>";
  } else if (r.kind === "pos") {
    h += L(s.skyZh, s.skyVi) + '<span class="big">' +
      L("問的是「知不知道自己在哪個車道」：橫向誤差要 ≤ " + CONST.POS_ERR + " m", "Hỏi «biết mình ở làn nào không»: sai số ngang ≤ " + CONST.POS_ERR + " m") + "</span>";
  } else {
    h += L(s.outZh, s.outVi) + '<span class="big">' +
      L("問的是「衛星斷掉 " + s.outage + " 秒，它撐不撐得住」：橫向誤差要 ≤ " + CONST.POS_ERR + " m", "Hỏi «mất vệ tinh " + s.outage + " s, nó giữ được không»: sai số ngang ≤ " + CONST.POS_ERR + " m") + "</span>";
  }
  h += "</div>";
  h += r.lines.map(([k, v, g]) => '<div class="line"><div class="k">' + k + '</div><div class="v ' + cls(g) + '">' + v + mark(g) + "</div></div>").join("");
  const V = r.kind === "see"
    ? [L("這一顆在這個情境撐得住。接下來要問的是價錢、功耗和裝得上去嗎。", "Model này đủ dùng. Câu hỏi tiếp theo là giá, điện và chỗ lắp."),
       L("這一顆在這個情境不夠用。上面打 ✗ 那一行就是卡住的地方。", "Không đủ. Dòng có dấu ✗ ở trên là chỗ bị chặn.")]
    : r.kind === "pos"
    ? [L("這一顆在這個情境知道自己在哪個車道。", "Model này biết mình ở làn nào."),
       L("這一顆在這個情境不知道自己在哪個車道。打 ✗ 那一行就是原因。", "Không biết mình ở làn nào. Dòng ✗ là lý do.")]
    : [L("衛星斷掉的這段時間，它撐得住。", "Trong lúc mất vệ tinh, nó giữ được."),
       L("撐不到這段時間結束。要靠別的東西來補——輪速、相機看車道線、高精地圖（第五章）。", "Không giữ được tới cuối. Phải nhờ thứ khác — tốc độ bánh xe, camera nhìn vạch làn, bản đồ HD (chương 5).")];
  h += '<div class="verdict ' + (r.ok ? "pass" : "fail") + '">' + (r.ok ? V[0] : V[1]) + "</div>";
  return h;
}

// ── 四張表：點一格就地展開 ──
let openCell = "";
function tables() {
  const cellTxt = (v) => v === "ok" ? L("夠", "Đủ") : v === "ng" ? L("不夠", "Không đủ") : "—";
  $("tables").innerHTML = HW_Q.map((q) => {
    let h = '<div class="panel"><div class="hwq">' + L(q.zh, q.vi) + '</div><div class="hwn">' + L(q.nZh, q.nVi) + "</div>";
    h += '<table class="hwtab"><tr><th class="mdl"></th>' + q.scenes.map((sk) =>
      "<th>" + L(SCENES[sk].zh, SCENES[sk].vi) + "<br>" + SCENES[sk].v + " km/h</th>").join("") + "</tr>";
    for (const mk of q.models) {
      h += '<tr><td class="mdl">' + MODELS[mk].name + "</td>" + q.scenes.map((sk) => {
        const key = mk + "_" + sk, v = HW.g[key] || "";
        return '<td><button class="cell ' + v + (openCell === key ? " open" : "") + '" data-cell="' + key + '">' + cellTxt(v) + "</button></td>";
      }).join("") + "</tr>";
      if (openCell && openCell.startsWith(mk + "_") && q.scenes.includes(openCell.slice(mk.length + 1))) {
        const sk = openCell.slice(mk.length + 1), v = HW.g[openCell] || "";
        h += '<tr class="exp"><td colspan="' + (q.scenes.length + 1) + '"><div class="expbox">' + calcHtml(mk, sk) +
          '<div class="pick"><button data-pick="ok" class="' + (v === "ok" ? "sel" : "") + '">' + L("夠", "Đủ") +
          '</button><button data-pick="ng" class="' + (v === "ng" ? "sel" : "") + '">' + L("不夠", "Không đủ") + "</button></div></div></td></tr>";
      }
    }
    return h + "</table></div>";
  }).join("");
  document.querySelectorAll("[data-cell]").forEach((b) => b.onclick = () => {
    openCell = openCell === b.dataset.cell ? "" : b.dataset.cell;
    tables();
    if (openCell) { const e = document.querySelector(".exp"); if (e) e.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
  });
  document.querySelectorAll("[data-pick]").forEach((b) => b.onclick = () => {
    HW.g[openCell] = HW.g[openCell] === b.dataset.pick ? "" : b.dataset.pick;
    save(); tables(); prog();
  });
}

const CELLS = [];
HW_Q.forEach((q) => q.models.forEach((mk) => q.scenes.forEach((sk) => CELLS.push(mk + "_" + sk))));
const TOTAL = CELLS.length + 1 + 8;

function fill() {
  $("hwName").placeholder = L("姓名", "Họ tên"); $("hwName").value = HW.name;
  $("hwSid").placeholder = L("班級／學號", "Lớp / MSSV"); $("hwSid").value = HW.sid;
  $("specLink").textContent = L("← 規格判讀台（第六週版）在另一頁", "← Bàn đọc thông số (tuần 6) ở trang khác");
  $("q5t").textContent = L("第五題　替「隧道」寫一句結論", "Câu 5 — Viết một câu kết luận cho «đường hầm»");
  $("q5n").innerHTML = L("講的是第四題最右邊那一欄：雪山隧道 12.9 公里，衛星斷 580 秒。四句選一句，要選那句把<b>卡在哪一行、該怎麼補</b>都講對的。",
                         "Nói về cột ngoài cùng bên phải của câu 4: hầm Tuyết Sơn 12,9 km, mất vệ tinh 580 s. Chọn câu nói đúng cả <b>tắc ở dòng nào và bù bằng gì</b>.");
  $("q6t").textContent = L("第六題　四句話，對或錯，再選一個理由", "Câu 6 — Bốn câu: đúng hay sai, kèm lý do");
  $("btnSheet").textContent = L("產生作答單（交這一頁）", "Tạo phiếu trả lời (nộp trang này)");
  if (!wipeTimer) wipeReset();
  $("btnBack").textContent = L("← 回去改", "← Quay lại sửa");
  const opt = (v, cur, txt) => '<option value="' + v + '"' + (String(cur) === String(v) ? " selected" : "") + ">" + txt + "</option>";
  $("hwConcl").innerHTML = opt("", HW.concl, L("── 請選 ──", "── Chọn ──")) + HW_CONCL.map((o, i) => opt(i, HW.concl, L(o[0], o[1]))).join("");
  $("q6").innerHTML = HW_TF.map((q, i) =>
    '<div class="tfrow"><div class="hwn" style="margin-bottom:0">' + L(q[0], q[1]) + "</div>" +
    '<select data-tf="' + i + '">' + opt("", HW.tf[i][0], "—") + opt("T", HW.tf[i][0], L("對", "Đúng")) + opt("F", HW.tf[i][0], L("錯", "Sai")) + "</select>" +
    '<select data-tfr="' + i + '">' + opt("", HW.tf[i][1], L("── 選一個理由 ──", "── Chọn lý do ──")) +
      HW_WHY[i].map((o, j) => opt(j, HW.tf[i][1], L(o[0], o[1]))).join("") + "</select></div>").join("");
  const bindIn = (id, k) => $(id).oninput = (e) => { HW[k] = e.target.value; save(); prog(); };
  bindIn("hwName", "name"); bindIn("hwSid", "sid");
  $("hwConcl").onchange = (e) => { HW.concl = e.target.value; save(); prog(); };
  document.querySelectorAll("[data-tf]").forEach((el) => el.onchange = (e) => { HW.tf[+e.target.dataset.tf][0] = e.target.value; save(); prog(); });
  document.querySelectorAll("[data-tfr]").forEach((el) => el.onchange = (e) => { HW.tf[+e.target.dataset.tfr][1] = e.target.value; save(); prog(); });
}

function prog() {
  let n = 0;
  CELLS.forEach((k) => { if (HW.g[k]) n++; });
  if (HW.concl !== "") n++;
  HW.tf.forEach(([a, b]) => { if (a !== "") n++; if (b !== "") n++; });
  $("progBox").innerHTML = L("已經填了 ", "Đã điền ") + "<b>" + n + "</b> / " + TOTAL + (n === TOTAL ? L("　全部填完了 ✓", "　Xong hết ✓") : "");
}

function sheet() {
  const miss = (t) => (t && String(t).trim() ? String(t) : '<span class="miss">' + L("（沒寫）", "(chưa điền)") + "</span>");
  const cell = (v) => v === "ok" ? L("夠", "Đủ") : v === "ng" ? L("不夠", "Không") : "—";
  const d = new Date(), two = (n) => String(n).padStart(2, "0");
  let h = "<h3>" + L("第六週作業　雷達、超音波、衛星與慣性", "Bài tuần 6 — Radar, siêu âm, vệ tinh, quán tính") + "</h3>" +
    '<div class="who">' + miss(HW.name) + "　" + (HW.sid || "") + "</div>" +
    '<div class="when">' + d.getFullYear() + "-" + two(d.getMonth() + 1) + "-" + two(d.getDate()) + " " + two(d.getHours()) + ":" + two(d.getMinutes()) + "</div>";
  HW_Q.forEach((q) => {
    h += '<div class="sec">' + L(q.zh, q.vi) + '</div><table class="hwtab"><tr><th class="mdl"></th>' +
      q.scenes.map((sk) => "<th>" + L(SCENES[sk].zh, SCENES[sk].vi) + "</th>").join("") + "</tr>" +
      q.models.map((mk) => '<tr><td class="mdl">' + MODELS[mk].name + "</td>" + q.scenes.map((sk) => "<td>" + cell(HW.g[mk + "_" + sk]) + "</td>").join("") + "</tr>").join("") + "</table>";
  });
  h += '<div class="sec">' + L("隧道的結論", "Kết luận cho hầm") + '</div><div class="ans">' + (HW.concl === "" ? miss("") : L(HW_CONCL[+HW.concl][0], HW_CONCL[+HW.concl][1])) + "</div>";
  h += '<div class="sec">' + L("四句話", "Bốn câu") + '</div><div class="ans">' + HW_TF.map((q, i) => L(q[0], q[1]).slice(0, 2) + " " +
    (HW.tf[i][0] === "T" ? L("對", "Đúng") : HW.tf[i][0] === "F" ? L("錯", "Sai") : "—") + "　" +
    (HW.tf[i][1] === "" ? miss("") : L(HW_WHY[i][+HW.tf[i][1]][0], HW_WHY[i][+HW.tf[i][1]][1]))).join("<br>") + "</div>";
  $("sheet").innerHTML = h;
  document.body.classList.add("sheet");
  $("btnBack").style.display = "";
  window.scrollTo(0, 0);
}

function draw() { fill(); tables(); prog(); }

let wipeTimer = null;
function wipeReset() { const b = $("btnWipe"); if (!b) return; b.textContent = L("全部清空", "Xoá hết"); b.classList.remove("danger"); }
$("btnWipe").onclick = () => {
  const b = $("btnWipe");
  if (!wipeTimer) {
    b.textContent = L("再按一次：整份作業都會清掉", "Bấm lần nữa: xoá toàn bộ bài");
    b.classList.add("danger");
    wipeTimer = setTimeout(() => { wipeTimer = null; wipeReset(); }, 3000);
    return;
  }
  clearTimeout(wipeTimer); wipeTimer = null;
  HW = blank(); save(); openCell = ""; draw(); window.scrollTo(0, 0);
};
$("btnSheet").onclick = sheet;
$("btnBack").onclick = () => { document.body.classList.remove("sheet"); $("btnBack").style.display = "none"; window.scrollTo(0, 0); };
$("btnZh").onclick = () => { ZH = true; $("btnZh").classList.add("on"); $("btnVi").classList.remove("on"); document.documentElement.lang = "zh-Hant"; draw(); if (document.body.classList.contains("sheet")) sheet(); };
$("btnVi").onclick = () => { ZH = false; $("btnVi").classList.add("on"); $("btnZh").classList.remove("on"); document.documentElement.lang = "vi"; draw(); if (document.body.classList.contains("sheet")) sheet(); };

draw();

</script>
</body></html>
