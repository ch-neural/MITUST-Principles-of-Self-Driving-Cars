<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>規格判讀台（第六週）</title>
<style>
  :root{--navy:#0B1F3A;--navy2:#13314F;--teal:#00A896;--teal-d:#007F72;--amber:#FFB020;
        --line:#D8E0E8;--card:#F4F7FA;--mute:#5F7183;--ink:#1A2733;--red:#D9463E;--ok:#2E7D5B;--amber2:#7A4E00}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:#EEF2F6;color:var(--ink);
       font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",Arial,sans-serif;font-size:14px;line-height:1.5}
  #app{display:grid;grid-template-columns:330px 1fr 340px;gap:12px;padding:12px;min-height:100vh;align-items:start}
  .panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}
  h1{font-size:16px;margin:0 0 2px;color:var(--navy)}
  h1 .vi{display:block;font-size:11px;color:var(--mute);font-weight:400}
  h2{font-size:12.5px;margin:14px 0 6px;color:var(--teal-d);letter-spacing:.02em}
  h2:first-child{margin-top:0}
  .note{font-size:11.5px;color:var(--mute);margin:2px 0 8px;line-height:1.45}
  .grid{display:grid;gap:6px}
  .g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:1fr 1fr 1fr}
  button{font-family:inherit;font-size:12px;padding:7px 8px;border:1px solid var(--line);
         background:#fff;color:var(--ink);border-radius:7px;cursor:pointer;line-height:1.25}
  button:hover{border-color:var(--teal)}
  button.on{background:var(--navy);border-color:var(--navy);color:#fff}
  button .vi{display:block;font-size:9.5px;opacity:.75}
  /* 型號分五組，每組一個小標 */
  .grp{font-size:11px;font-weight:700;color:var(--mute);margin:9px 0 4px;letter-spacing:.03em}
  .grp:first-child{margin-top:0}
  .grp.new{color:var(--teal-d)}
  /* 規格表：刻意做成 datasheet 的樣子，英文在前、中越文在後 */
  .ds{border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .ds .hd{background:var(--navy);color:#fff;padding:7px 10px;font-size:12.5px;font-weight:700}
  .ds .hd small{display:block;font-weight:400;opacity:.8;font-size:10px}
  .row{display:flex;gap:8px;padding:5px 10px;border-top:1px solid var(--line);font-size:12px;align-items:flex-start}
  .row:nth-child(odd){background:var(--card)}
  .row .k{flex:0 0 40%;color:var(--navy);font-weight:600}
  .row .k small{display:block;font-weight:400;color:var(--mute);font-size:10px}
  .row .v{flex:1;color:var(--ink)}
  .row.key{background:#FFF8E6}
  .pic{padding:10px 12px 2px;text-align:center}
  .pic img{max-width:min(230px,70%);max-height:140px;border-radius:6px;border:1px solid var(--line);background:#fff}
  .pic span{display:block;margin-top:4px;font-size:11px;color:var(--mute)}
  .src{font-size:10px;color:var(--mute);padding:6px 10px;border-top:1px solid var(--line);line-height:1.4}
  /* 判讀表 */
  .q{margin:0 0 8px}
  .q label{display:block;font-size:12px;color:var(--navy);font-weight:600;margin-bottom:3px}
  .q label small{display:block;font-weight:400;color:var(--mute);font-size:10px}
  select{width:100%;font-family:inherit;font-size:12.5px;padding:6px;border:1px solid var(--line);border-radius:6px;background:#fff}
  .fb{font-size:11.5px;margin-top:3px;min-height:15px}
  .fb.ok{color:var(--ok)} .fb.no{color:var(--red)}
  .res{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:12.5px}
  .res b{color:var(--navy)}
  .res .big{font-size:17px;font-weight:700;color:var(--navy);display:block;margin:2px 0;line-height:1.35}
  .res .sm{font-size:11px;color:var(--mute);display:block;margin-top:2px}
  .line{display:flex;gap:8px;padding:5px 9px;border:1px solid var(--line);border-radius:6px;margin-top:5px;background:#fff;font-size:12px;align-items:flex-start}
  .line .k{flex:0 0 42%;color:var(--navy2);font-weight:700}
  .line .v{flex:1 1 auto}
  .line .v.bad{color:var(--red)} .line .v.good{color:var(--ok)} .line .v.n{color:var(--mute)} .line .v.warn{color:var(--amber2)}
  .verdict{border-radius:7px;padding:8px 10px;margin-top:8px;font-size:12.5px;line-height:1.5}
  .verdict.pass{background:#E8F6F0;border:1px solid var(--ok);color:#1C5E45}
  .verdict.fail{background:#FDECEC;border:1px solid var(--red);color:#96271F}
  .hint{display:block;font-size:11px;color:var(--mute);margin-top:6px;line-height:1.45}
  .mini{border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-bottom:8px;background:#fff}
  .mini .t{font-size:12px;font-weight:700;color:var(--navy);margin-bottom:5px}
  .mini .t small{font-weight:400;color:var(--mute);font-size:10px;display:block}
  input[type=range]{width:100%;accent-color:var(--teal)}
  .rowv{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mute);margin:6px 0 1px}
  .rowv b{color:var(--navy);font-size:13px}
  .out{font-size:12px;color:var(--ink);background:var(--card);border-radius:6px;padding:6px 8px;margin-top:6px;line-height:1.5}
  .out .calc{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;margin:3px 0}
  .out .calc>i{flex:0 0 auto;min-width:96px;font-style:normal;font-size:11px;color:var(--mute)}
  .out .calc>code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--navy)}
  .sim{display:flex;flex-direction:column;align-items:center;gap:8px;margin:8px 0 2px}
  .sim>div{text-align:center;max-width:100%}
  .sim canvas{display:block;max-width:100%;height:auto;border:1px solid var(--line);border-radius:5px;background:#eef2f6}
  .sim span{display:block;margin-top:3px;font-size:10px;color:var(--mute)}
  .scope{font-size:11px;line-height:1.45;color:var(--mute);margin:1px 0 7px}
  .scope.bad{background:#FFF6E3;border:1px solid var(--amber);color:var(--amber2);border-radius:6px;padding:5px 7px;margin-top:3px}
  .foot{font-size:10.5px;color:var(--mute);margin-top:10px;border-top:1px solid var(--line);padding-top:6px;line-height:1.45}
  .lang{display:flex;gap:0;flex:0 0 auto;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;box-shadow:0 1px 3px rgba(11,31,58,.08)}
  .lang button{padding:5px 11px;font-size:11.5px;background:#fff;border:none;border-radius:0}
  .lang button.on{background:var(--navy);color:#fff}
  #mtabs{display:none}
  #stick{position:sticky;top:0;z-index:6;background:#fff;border-bottom:1px solid var(--line)}
  #topbar{display:flex;align-items:center;gap:10px;padding:7px 12px;flex-wrap:wrap}
  .tb-lab{font-size:12px;font-weight:700;color:var(--navy);flex:0 0 auto}
  #sceBtns{display:flex;gap:6px;flex:0 0 auto;flex-wrap:wrap}
  #sceBtns button{padding:5px 10px;font-size:12px;min-height:0;line-height:1.25}
  #sceBtns .vi{display:block;font-size:10px;opacity:.72}
  #tbNeed{font-size:11.5px;color:var(--navy);flex:1 1 220px;min-width:0;line-height:1.35}
  #tbNeed b{font-size:13px}
  .mdl2{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 7px}
  .mdl2 button{flex:1 1 0;min-width:96px;padding:5px 4px;font-size:11px;min-height:0;line-height:1.3}
  .hwlink{display:block;margin-top:8px;padding:9px 10px;border-radius:7px;text-align:center;background:var(--teal);color:#fff;font-size:12.5px;font-weight:700;text-decoration:none}
  .hwlink:hover{background:var(--teal-d)}
  .w5link{display:block;font-size:11px;color:var(--teal-d);margin-top:6px}
  @media (max-width:900px){
    #app{display:block;padding:8px}
    .panel{margin-bottom:8px}
    #mtabs{display:flex;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:8px}
    #mtabs button{flex:1 1 0;border:none;border-radius:0;padding:10px 4px;font-size:13px}
    #mtabs button.on{background:var(--navy);color:#fff}
    #topbar{padding:6px 8px;gap:7px}
    #sceBtns{flex:1 1 100%;order:2}
    #sceBtns button{flex:1 1 0;min-width:0;padding:5px 2px;font-size:11px}
    #tbNeed{order:3;flex:1 1 100%}
    .tb-lab{order:1}
    .lang{order:1;margin-left:auto}
    button{font-size:12.5px;padding:9px 8px;min-height:38px}
    .mdl2 button{min-height:34px}
  }
</style>
</head>
<body>
<div id="stick">
<div id="topbar">
  <span class="tb-lab" data-zh="情境" data-vi="Tình huống"></span>
  <div id="sceBtns"></div>
  <div id="tbNeed"></div>
  <div class="lang"><button id="btnZh" class="on">中文</button><button id="btnVi">Tiếng Việt</button></div>
</div>
<div id="mtabs">
  <button data-tab="ds" class="on" data-zh="規格表" data-vi="Thông số"></button>
  <button data-tab="read" data-zh="判讀與試算" data-vi="Đọc &amp; tính"></button>
  <button data-tab="mini" data-zh="三個小工具" data-vi="Ba công cụ"></button>
</div>
</div>

<div id="app">
  <div class="panel" id="pDs">
    <h1 data-zh="規格判讀台（第六週）" data-vi="Bàn đọc thông số (tuần 6)"></h1>
    <div class="note" data-zh="十二個型號：上週四顆還在，新加雷達、超音波、衛星定位、慣性各兩顆。黃色底的那幾行，是等一下要你自己找出來的。"
         data-vi="12 model: bốn cái tuần trước vẫn còn, thêm radar, siêu âm, GNSS, IMU mỗi loại hai. Dòng nền vàng là thứ bạn phải tự tìm."></div>
    <h2 data-zh="選一個型號" data-vi="Chọn model"></h2>
    <div id="mdlBtns"></div>
    <div class="grid g2" style="margin-top:10px">
      <button id="btnTr" class="on" data-zh="原文＋中文對照" data-vi="Kèm tiếng Việt"></button>
      <button id="btnEn" data-zh="只看英文原文" data-vi="Chỉ tiếng Anh"></button>
    </div>
    <div id="ds" style="margin-top:8px"></div>
  </div>

  <div class="panel" id="pRead">
    <h2 data-zh="一、從規格表上找出四個數字" data-vi="1. Tìm bốn con số trong bảng"></h2>
    <div class="note" data-zh="每一顆問的四題不一樣——雷達問速度，衛星問精度，慣性問偏差。答案都在左邊那張表上，也可能表上根本沒有。"
         data-vi="Mỗi model bốn câu khác nhau — radar hỏi tốc độ, GNSS hỏi độ chính xác, IMU hỏi độ trôi. Đáp án ở bảng bên trái — hoặc bảng không hề có."></div>
    <div id="quiz"></div>
    <div class="grid g2" style="margin-top:6px">
      <button id="btnCheck" data-zh="檢查我的答案" data-vi="Kiểm tra"></button>
      <button id="btnClear" data-zh="重來" data-vi="Làm lại"></button>
    </div>

    <h2 data-zh="二、這顆放進上面那個情境，夠不夠用" data-vi="2. Model này có đủ cho tình huống ở trên không"></h2>
    <div class="note" data-zh="看得到東西的感測器問「看不看得到」；衛星和慣性問「知不知道自己在哪」。情境在最上面那一條換，這裡換型號。"
         data-vi="Cảm biến nhìn vật thì hỏi «thấy không»; GNSS và IMU hỏi «biết mình ở đâu không». Đổi tình huống ở thanh trên cùng; ở đây đổi model."></div>
    <div class="mdl2" id="mdlBtns2"></div>
    <div id="calc"></div>
  </div>

  <div class="panel" id="pMini">
    <h2 data-zh="三個小工具" data-vi="Ba công cụ nhỏ"></h2>
    <div class="note" data-zh="上週那三個（焦距、每秒點數、反射率）還在上週的判讀台 week5/spec。" data-vi="Ba công cụ tuần trước vẫn ở week5/spec."></div>

    <div class="mini">
      <div class="t" data-zh="① 角解析度 → 一束攤多寬" data-vi="① Phân giải góc → chùm rộng bao nhiêu"><small data-zh="雷達的「1.6°」到遠處是幾公尺" data-vi="«1,6°» của radar ra xa là mấy mét"></small></div>
      <div class="scope" id="sc1"></div>
      <div class="rowv"><span data-zh="角解析度 °" data-vi="Phân giải góc °"></span><b id="vA">1.6</b></div>
      <input type="range" id="sA" min="0.1" max="4" step="0.1" value="1.6">
      <div class="rowv"><span data-zh="目標距離 m" data-vi="Khoảng cách m"></span><b id="vD1">40</b></div>
      <input type="range" id="sD1" min="10" max="250" step="5" value="40">
      <div class="sim"><div><canvas id="cSep" width="268" height="201"></canvas>
        <span data-zh="兩台相隔 1 m 的機車（俯視，橫向放大）" data-vi="Hai xe máy cách nhau 1 m (nhìn từ trên, phóng to chiều ngang)"></span></div></div>
      <div class="out" id="oA"></div>
    </div>

    <div class="mini">
      <div class="t" data-zh="② 定位精度 vs 車道" data-vi="② Độ chính xác vị trí vs làn đường"><small data-zh="「2.5 m CEP」放到 3.5 m 的車道上長什麼樣" data-vi="«2,5 m CEP» trên làn 3,5 m trông thế nào"></small></div>
      <div class="scope" id="sc2"></div>
      <div class="rowv"><span data-zh="水平精度 CEP（m）" data-vi="Sai số ngang CEP (m)"></span><b id="vC">2.5</b></div>
      <input type="range" id="sC" min="0" max="11" step="1" value="8">
      <div class="sim"><div><canvas id="cCep" width="268" height="201"></canvas>
        <span data-zh="三個車道各 3.5 m；點是連續 40 次定位" data-vi="Ba làn mỗi làn 3,5 m; chấm là 40 lần định vị liên tiếp"></span></div></div>
      <div class="out" id="oC"></div>
    </div>

    <div class="mini">
      <div class="t" data-zh="③ 沒有衛星，IMU 撐多久" data-vi="③ Không có vệ tinh, IMU giữ được bao lâu"><small data-zh="橫向誤差 ≈ 車速 × 偏差 × t² ÷ 2" data-vi="Sai số ngang ≈ v × trôi × t² ÷ 2"></small></div>
      <div class="scope" id="sc3"></div>
      <div class="rowv"><span data-zh="陀螺儀偏差 °/h" data-vi="Độ trôi con quay °/h"></span><b id="vB">8</b></div>
      <input type="range" id="sB" min="0" max="5" step="1" value="1">
      <div class="rowv"><span data-zh="車速 km/h" data-vi="Tốc độ km/h"></span><b id="vV">80</b></div>
      <input type="range" id="sV" min="5" max="120" step="5" value="80">
      <div class="sim"><div><canvas id="cDrift" width="268" height="201"></canvas>
        <span data-zh="橫向誤差隨時間（0–60 秒）；紅線是 0.5 m" data-vi="Sai số ngang theo thời gian (0–60 s); vạch đỏ 0,5 m"></span></div></div>
      <div class="out" id="oB"></div>
    </div>

    <div class="foot" data-zh="規格取自各廠公開文件，來源標在每張表下面。算出來的點數、煞停距離、撐多久都是課堂算式，不是廠商保證值。"
         data-vi="Thông số từ tài liệu công khai; nguồn ghi dưới mỗi bảng. Giá trị tính ra là công thức lớp học, không phải bảo đảm của hãng."></div>
  </div>
</div>

–77 GHz（波長約 4 mm）","Băng tần 76–77 GHz (bước sóng ~4 mm)",0],["Power consumption","6.6 W / 550 mA typ.","功耗 6.6 W","Công suất 6,6 W",0],["Dimensions / weight","138 × 91 × 31 mm / app. 320 g","尺寸與重量","Kích thước / khối lượng",0],["Interface","1 x CAN high-speed 500 kbit/s","介面 CAN","Giao tiếp CAN",0]],"src":"Continental Engineering Services, ARS 408-21 Long Range Radar Sensor 77 GHz data sheet（Print ID 091018_FS_ARS_408_21_EN_HS；AutonomouStuff 轉載的公開 PDF），讀取日 2026-10-08。角解析度那一行原件印「31.6°」，AutonomouStuff 產品頁印 1.6°，本課採 1.6°。","srcVi":"Continental Engineering Services, ARS 408-21 data sheet (Print ID 091018_FS_ARS_408_21_EN_HS; PDF công khai do AutonomouStuff đăng lại), đọc 08-10-2026. Dòng phân giải góc bản in ghi «31,6°», trang sản phẩm ghi 1,6°; lớp dùng 1,6°.","quiz":[{"zh":"遠場看得到幾公尺？","vi":"Vùng xa thấy được bao nhiêu mét?","zhs":"表上同一行有三個數字，問遠場那個","vis":"Dòng đó có ba số; hỏi số vùng xa","opts":[{"v":"250","zh":"250 公尺","vi":"250 m"},{"v":"70","zh":"70 公尺","vi":"70 m"},{"v":"20","zh":"20 公尺","vi":"20 m"},{"v":"no","zh":"規格表上沒有這一行","vi":"Bảng không có dòng này"}],"ans":"250","why":["遠場 250 m。70 m 和 20 m 是近場的，而且還跟角度綁在一起。","Vùng xa 250 m. 70 m và 20 m là vùng gần, lại còn gắn với góc."]},{"zh":"遠場的水平視野是多少？","vi":"Góc nhìn ngang vùng xa là bao nhiêu?","zhs":"找 Azimuth angle augmentation 那一行","vis":"Tìm dòng Azimuth angle augmentation","opts":[{"v":"9","zh":"±9°","vi":"±9°"},{"v":"60","zh":"±60°","vi":"±60°"},{"v":"14","zh":"14°","vi":"14°"},{"v":"no","zh":"規格表上沒有這一行","vi":"Bảng không có dòng này"}],"ans":"9","why":["遠場只有 ±9°——很窄。±60° 是近場；14° 是垂直的。","Vùng xa chỉ ±9° — rất hẹp. ±60° là vùng gần; 14° là dọc."]},{"zh":"遠場的水平角解析度是多少？","vi":"Phân giải góc ngang vùng xa?","zhs":"Resolution azimuth angle 那一行；原件印錯了，用常識對一下","vis":"Dòng Resolution azimuth angle; bản in sai, hãy đối chiếu bằng lẽ thường","opts":[{"v":"1.6","zh":"1.6°","vi":"1,6°"},{"v":"31.6","zh":"31.6°（照原件）","vi":"31,6° (như bản in)"},{"v":"2.2","zh":"2.2°","vi":"2,2°"},{"v":"0.1","zh":"±0.1°","vi":"±0,1°"}],"ans":"1.6","why":["1.6°。原件印 31.6°，可是波束寬才 2.2°，解析度不可能比波束寬還寬十幾倍；其他版本的規格書印 1.6°。2.2° 是波束寬，±0.1° 是準確度，不是解析度。","1,6°. Bản in ghi 31,6° nhưng chùm chỉ rộng 2,2°, phân giải không thể rộng gấp mười lần chùm; bản khác in 1,6°. 2,2° là độ rộng chùm, ±0,1° là độ chính xác."]},{"zh":"速度解析度是多少？","vi":"Phân giải tốc độ?","zhs":"光達沒有這一行；雷達是直接量速度的","vis":"Lidar không có dòng này; radar đo tốc độ trực tiếp","opts":[{"v":"0.37","zh":"0.37 km/h","vi":"0,37 km/h"},{"v":"0.1","zh":"±0.1 km/h","vi":"±0,1 km/h"},{"v":"72","zh":"72 ms","vi":"72 ms"},{"v":"no","zh":"規格表上沒有這一行","vi":"Bảng không có dòng này"}],"ans":"0.37","why":["0.37 km/h（遠場）。±0.1 km/h 是準確度那一行；72 ms 是更新週期。","0,37 km/h (vùng xa). ±0,1 km/h là độ chính xác; 72 ms là chu kỳ."]}],"calc":{"type":"radar","rangeFar":250,"rangeNear":70,"fovFar":9,"fovNear":60,"azRes":1.6,"elev":false,"velRes":0.37,"cycle":72}},"ars548":{"pic":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAC+ASwDASIAAhEBAxEB/8QAHAAAAQUBAQEAAAAAAAAAAAAAAgABAwYHBQQI/8QAShAAAQMDAwIDBAYGBgUNAAAAAQIDBAAFEQYSIQcxE0FRImFxgRQVMnSRsxYjNkJSoSQmM3KxsjQ3YpKiCENTY2RzgqPB0dLh8P/EABwBAAIDAQEBAQAAAAAAAAAAAAABAgMEBQYHCP/EADMRAAICAQIEAgkDBQEBAAAAAAABAhEDBCEFEjFBUWETFCIzcYGRocEGsdEjMuHw8UIV/9oADAMBAAIRAxEAPwDrFFAU16SmgKa+XJn1xSPMU1GpNelSajUmrEyxSPOpNApFehSajUmrEWKR5yKEipimoyKmixMjIzQkUZFMoVJMmgKaipqlYxqVKlUlIYqEooqVWxkJqyBSKiW3XrIzUak1qx5TPkxnhWivO4ivetFeZaK6mDMc/NiPAtFQKTXucRXlcTiu7ps5x9RhPORQ1IoVGa9BpstnEz46InE15lpxXsUMivO4mupB2cucTzkU1GoUPnVqM0kDTikaVSKWPTihpxSEFRChFOKQIMUQNADT0hhitn6L/sxL+/L/AC26xcGtn6Ln+rEv78v8tusWu90MhUmgKanKajUK/PiZ9YTIFJqNSanUKt3TjTH1xdPrCQjMSGoEAjhxzuB8B3PyrZpMM8+RYodWV6nVQ0+KWWfRFMlwpEJwNSo7rDhSFBLiCkkHscHyryqFa91asn0q1sXVtOXIitjhH/Rq/wDZWPxNZIoVs1ulelzPE3a7EeGa5azAsqVPo15kKhUZQVEBIJJ4AAyTUyhirP00tP1pq2KpSctQwZK/iOE/8RH4VDBjeXJHGu7NufULBilll0SsqT0V9lO51h5tPbK2ykfzFRoYcf 是多少？","vi":"Dải đo lớn nhất của con quay?","zhs":"Full-Scale Range 有四檔，問最大的","vis":"Full-Scale Range có 4 mức; hỏi mức lớn nhất","opts":[{"v":"2000","zh":"±2000 °/s","vi":"±2000 °/s"},{"v":"250","zh":"±250 °/s","vi":"±250 °/s"},{"v":"16","zh":"±16 g","vi":"±16 g"},{"v":"no","zh":"規格表上沒有這一行","vi":"Bảng không có dòng này"}],"ans":"2000","why":["±2000 °/s。±250 是最小檔；±16 g 是加速度計的。","±2000 °/s. ±250 là mức nhỏ nhất; ±16 g là của gia tốc kế."]},{"zh":"靜止不動的時候，它可能讀到多少？","vi":"Đứng yên nó có thể đọc ra bao nhiêu?","zhs":"Initial ZRO Tolerance（零偏）","vis":"Initial ZRO Tolerance (lệch không)","opts":[{"v":"5","zh":"±5 °/s","vi":"±5 °/s"},{"v":"0.05","zh":"±0.05 °/s","vi":"±0,05 °/s"},{"v":"0.015","zh":"0.015 °/s","vi":"0,015 °/s"},{"v":"0","zh":"0，靜止就是 0","vi":"0, đứng yên là 0"}],"ans":"5","why":["±5 °/s——靜止也可能一秒轉 5 度。一分鐘就是 300 度，所以一定要先校正。0.05 是每 °C 的變化；0.015 是雜訊。","±5 °/s — đứng yên vẫn có thể «quay» 5°/s. Một phút là 300°, nên phải hiệu chuẩn trước. 0,05 là mỗi °C; 0,015 là nhiễu."]},{"zh":"長時間的偏差穩定度（in-run bias stability）是多少？","vi":"Ổn định lệch không dài hạn là bao nhiêu?","zhs":"工業級 IMU 一定有這一行","vis":"IMU công nghiệp luôn có dòng này","opts":[{"v":"8","zh":"8 °/h","vi":"8 °/h"},{"v":"0.34","zh":"0.34 °/√h","vi":"0,34 °/√h"},{"v":"5","zh":"±5 °/s","vi":"±5 °/s"},{"v":"no","zh":"規格表上沒有這一行","vi":"Bảng không có dòng này"}],"ans":"no","why":["這份規格書沒有這一行。手機不在乎一分鐘後偏多少，車子在乎——這就是等級的差別。8 和 0.34 是 ADIS16470 的。","Tờ này không có dòng đó. Điện thoại không cần biết sau một phút lệch bao nhiêu, xe thì cần — đó là khác biệt về cấp."]},{"zh":"溫度每變 1 °C，零偏變多少？","vi":"Mỗi 1 °C lệch không đổi bao nhiêu?","zhs":"ZRO Variation Over Temperature","vis":"ZRO Variation Over Temperature","opts":[{"v":"0.05","zh":"0.05 °/s","vi":"0,05 °/s"},{"v":"5","zh":"5 °/s","vi":"5 °/s"},{"v":"1.5","zh":"1.5%","vi":"1,5%"},{"v":"no","zh":"規格表上沒有這一行","vi":"Bảng không có dòng này"}],"ans":"0.05","why":["0.05 °/s 每 °C。車子從地下室開到太陽下差 10 °C，就是 0.5 °/s——本課估漂移就用這個。","0,05 °/s mỗi °C. Xe từ hầm ra nắng chênh 10 °C là 0,5 const SCENES = {"campus":{"zh":"校園接駁","vi":"Xe đưa đón trong trường","v":20,"d":40,"margin":5,"tgt":{"w":0.5,"h":1.7,"zh":"行人","vi":"người đi bộ"},"zhNote":"時速 20，要在 40 公尺外認出行人","viNote":"20 km/h, nhận ra người ở 40 m","sky":"open","outage":1,"skyZh":"校園開闊，天空看得到","skyVi":"Sân trường thoáng, thấy trời","outZh":"偶爾被樹或屋簷擋 1 秒","outVi":"Thỉnh thoảng bị cây che 1 s"},"hanoi":{"zh":"河內尖峰","vi":"Giờ cao điểm Hà Nội","v":40,"d":40,"margin":5,"tgt":{"w":0.8,"h":1.6,"zh":"機車","vi":"xe máy"},"zhNote":"時速 40，要在 40 公尺外認出機車","viNote":"40 km/h, nhận ra xe máy ở 40 m","sky":"canyon","outage":10,"skyZh":"高樓窄巷：訊號會從牆上反射（多路徑）","skyVi":"Phố hẹp nhà cao: tín hiệu dội tường (đa đường)","outZh":"本課假設一段窄巷有 10 秒算不出可靠的位置","outVi":"Lớp giả định 10 s không có vị trí tin được"},"hiway":{"zh":"國道","vi":"Đường cao tốc","v":100,"d":150,"margin":5,"tgt":{"w":1.8,"h":1.5,"zh":"汽車","vi":"ô tô"},"zhNote":"時速 100，要在 150 公尺外看到車","viNote":"100 km/h, thấy xe ở 150 m","sky":"open","outage":1,"skyZh":"國道開闊，天空看得到","skyVi":"Cao tốc thoáng, thấy trời","outZh":"過一座跨越橋大約斷 1 秒","outVi":"Qua một cây cầu vượt mất khoảng 1 s"},"park":{"zh":"停車場","vi":"Bãi đỗ xe","v":5,"d":2,"margin":0.5,"tgt":{"w":0.3,"h":1.1,"zh":"小孩","vi":"trẻ em"},"zhNote":"時速 5，倒車時要在 2 公尺外看到小孩；室內","viNote":"5 km/h, lùi xe phải thấy trẻ em ở 2 m; trong nhà","sky":"none","outage":60,"skyZh":"室內停車場，完全收不到衛星","skyVi":"Bãi xe trong nhà, không có vệ tinh","outZh":"整段倒車入庫約 60 秒都沒有衛星","outVi":"Cả đoạn lùi vào chỗ ~60 s không có vệ tinh"},"tunnel":{"zh":"隧道","vi":"Đường hầm","v":80,"d":100,"margin":5,"tgt":{"w":1.8,"h":1.5,"zh":"汽車","vi":"ô tô"},"zhNote":"時速 80，要在 100 公尺外看到車；雪山隧道 12.9 km","viNote":"80 km/h, thấy xe ở 100 m; hầm Tuyết Sơn 12,9 km","sky":"none","outage":580,"skyZh":"隧道裡完全收不到衛星","skyVi":"Trong hầm không có vệ tinh","outZh":"12.9 km ÷ 80 km/h ≈ 580 秒沒有衛星","outVi":"12,9 km ÷ 80 km/h ≈ 580 s không có vệ tinh"}};
const CONST = {"MIN_PTS":10,"MAX_ERR":1.5,"LANE_W":3.5,"POS_ERR":0.5,"BASE_KM":20,"IMU_DPS":0.5,"IMU_DT":10,"SOUND":340};
const DEF_COLS = 1024, DEF_HZ = 10;

<script>
/* 判定：一顆感測器放進一個情境，夠不夠用。判讀台和作業頁都直接嵌這一個檔，
 * 所以兩邊永遠是同一套算式（src/verify_hw.js 還是會逐格比對一次）。
 *
 * 寫成純瀏覽器 JS，不用任何外面的東西；build_*.js 把這個檔的原文塞進 <script>。
 * Node 要用的時候 require 進來（最後一行）。
 *
 *   judge(m, s, C, L, opt) → { ok, kind, head, lines, pts }
 *     m    型號（MODELS[k]），用 m.calc
 *     s    情境（SCENES[k]）
 *     C    門檻（CONST）
 *     L    (zh, vi) => 目前語言的那一句
 *     opt  { cols, hz }：OS1 的可設定模式
 *   lines 的每一項是 [標籤, 說明, good]，good 是 true／false／null（灰色：只是代價，不是門檻）／"warn"
 *   kind  "see"（看得到東西嗎）／"pos"（知道自己在哪嗎）／"hold"（撐得過沒衛星的這段嗎）
 */
const R = Math.PI / 180;
const brake = (v) => { const ms = v / 3.6; return ms * 0.3 + ms * ms / 12; };
const fmt = (x, n) => (Math.round(x * Math.pow(10, n)) / Math.pow(10, n)).toFixed(n);

function judge(m, s, C, L, opt) {
  const c = m.calc, T = s.tgt, v = s.v / 3.6;
  const need = brake(s.v) + s.margin, rm = Math.max(need, s.d);
  const lines = [];
  let ok = true, pts = 0, kind = "see", head = {};
  const seeHead = () => ({ brake: brake(s.v), need, rm, margin: s.margin });

  if (c.type === "lidar") {
    head = seeHead();
    const cols = opt && opt.cols ? opt.cols : (c.modes ? 1024 : c.cols);
    const hz = c.modes ? (opt && opt.hz ? opt.hz : 10) : c.hz;
    const dv = c.dv || c.vfov / (c.ch - 1);
    const dh = c.dh || c.hfov / (c.modes ? cols : c.cols);
    pts = (() => {
      const nv = Math.min(c.ch, 2 * Math.atan(T.h / 2 / s.d) / R / dv);
      const nh = 2 * Math.atan(T.w / 2 / s.d) / R / dh;
      return Math.max(0, Math.floor(nv)) * Math.max(0, Math.floor(nh));
    })();
    const reach = c.range10 >= rm;
    if (!reach) ok = false;
    lines.push([L("測距 " + c.range10 + " m", "Tầm " + c.range10 + " m"),
      reach ? L("夠，門檻 " + rm.toFixed(0) + " m", "Đủ, ngưỡng " + rm.toFixed(0) + " m")
            : L("不夠，門檻 " + rm.toFixed(0) + " m，差 " + (rm - c.range10).toFixed(0) + " m",
                "Thiếu " + (rm - c.range10).toFixed(0) + " m so với ngưỡng " + rm.toFixed(0) + " m"), reach]);
    lines.push([L("角解析度 " + dh.toFixed(2) + "° × " + dv.toFixed(2) + "°", "Phân giải " + dh.toFixed(2) + "° × " + dv.toFixed(2) + "°"),
      L(s.d + " m 的" + T.zh + "身上有 " + pts + " 個點，門檻 " + C.MIN_PTS + " 個",
        T.vi + " ở " + s.d + " m có " + pts + " điểm, ngưỡng " + C.MIN_PTS), pts >= C.MIN_PTS]);
    if (pts < C.MIN_PTS) ok = false;
    lines.push([L("更新率 " + hz + " Hz", hz + " Hz"),
      L("每 " + (1000 / hz).toFixed(0) + " 毫秒一張；這段時間車子前進 " + (v / hz).toFixed(1) + " m",
        "Mỗi " + (1000 / hz).toFixed(0) + " ms một khung; xe đi " + (v / hz).toFixed(1) + " m"), null]);

  } else if (c.type === "cam") {
    head = seeHead();
    const fov = 2 * Math.atan(c.px * c.pitch / 1000 / 2 / c.f) / R;
    const th = fov / c.px * R;
    const err = s.d * s.d * th / c.h;
    lines.push([L("配 " + c.f + " mm 鏡頭 → 視野 " + fov.toFixed(0) + "°", "Ống kính " + c.f + " mm → " + fov.toFixed(0) + "°"),
      L("感測器規格表沒有視野，是鏡頭決定的", "Bảng cảm biến không có góc nhìn"), null]);
    lines.push([L("每像素 " + (fov / c.px).toFixed(4) + "°", "Mỗi điểm ảnh " + (fov / c.px).toFixed(4) + "°"),
      L(s.d + " m 處估距誤差 ±" + err.toFixed(2) + " m，門檻 ±" + C.MAX_ERR + " m",
        "Sai số ở " + s.d + " m: ±" + err.toFixed(2) + " m, ngưỡng ±" + C.MAX_ERR + " m"), err < C.MAX_ERR]);
    if (err >= C.MAX_ERR) ok = false;
    lines.push([L("更新率 60 fps", "60 fps"),
      L("每 17 毫秒一張；這段時間車子前進 " + (v / 60).toFixed(2) + " m", "Mỗi 17 ms; xe đi " + (v / 60).toFixed(2) + " m"), null]);
    lines.push([L("測距", "Đo khoảng cách"),
      L("規格表上沒有，距離是算出來的，而且要假設路面是平的", "Không có trong bảng"), null]);

  } else if (c.type === "radar") {
    head = seeHead();
    const reach = c.rangeFar >= rm;
    if (!reach) ok = false;
    lines.push([L("測距 " + c.rangeFar + " m（遠場）", "Tầm " + c.rangeFar + " m (vùng xa)"),
      reach ? L("夠，門檻 " + rm.toFixed(0) + " m", "Đủ, ngưỡng " + rm.toFixed(0) + " m")
            : L("不夠，門檻 " + rm.toFixed(0) + " m", "Thiếu so với ngưỡng " + rm.toFixed(0) + " m"), reach]);
    if (c.fovNear != null) {
      const near = s.d <= c.rangeNear;
      lines.push([L("視野", "Góc nhìn"),
        near ? L(s.d + " m 在近場：±" + c.fovNear + "°，近場測距 " + c.rangeNear + " m", s.d + " m thuộc vùng gần: ±" + c.fovNear + "°, tầm " + c.rangeNear + " m")
             : L(s.d + " m 已經在遠場：只有 ±" + c.fovFar + "°，側面切進來的看不到", s.d + " m thuộc vùng xa: chỉ ±" + c.fovFar + "°, không thấy xe cắt ngang từ bên"),
        near ? null : "warn"]);
    } else {
      lines.push([L("視野 ±" + c.fovFar + "°", "Góc nhìn ±" + c.fovFar + "°"),
        L("一組視野管到底，沒有分遠近場", "Một góc nhìn cho mọi khoảng cách"), null]);
    }
    const sep = s.d * Math.tan(c.azRes * R);
    const lane = sep <= C.LANE_W;
    if (!lane) ok = false;
    lines.push([L("角解析度 " + c.azRes + "°" + (c.azResNote ? "（" + c.azResNote[0] + "）" : ""),
                  "Phân giải " + c.azRes + "°" + (c.azResNote ? " (" + c.azResNote[1] + ")" : "")),
      L(s.d + " m 處一束攤成 " + sep.toFixed(1) + " m，" + (lane ? "比一個車道窄，分得出在哪一道" : "比一個車道還寬，分不出在哪一道") + "（門檻 " + C.LANE_W + " m）",
        "Ở " + s.d + " m chùm rộng " + sep.toFixed(1) + " m, " + (lane ? "hẹp hơn một làn, biết ở làn nào" : "rộng hơn một làn, không biết ở làn nào") + " (ngưỡng " + C.LANE_W + " m)"), lane]);
    const twoW = 1.0;
    lines.push([L("兩台並排的" + T.zh, "Hai " + T.vi + " đi song song"),
      sep < twoW ? L("相隔 1 m 分得開，是兩個目標", "Cách nhau 1 m vẫn tách được: hai mục tiêu")
                 : L("相隔 1 m 會黏成一個目標（一束 " + sep.toFixed(1) + " m 比縫還寬）", "Cách nhau 1 m sẽ dính thành một mục tiêu (chùm " + sep.toFixed(1) + " m rộng hơn khe)"), null]);
    lines.push([L("高度", "Độ cao"),
      c.elev ? L("量得出高度（準確度 ±" + c.elevAcc + "°）：分得出橋下的車和橋", "Đo được độ cao (±" + c.elevAcc + "°): tách được xe dưới cầu và cầu")
             : L("沒有高度：橋和橋下的車、路上的輪胎分不出來，容易把靜止的東西丟掉", "Không có độ cao: cầu và xe dưới cầu, lốp trên đường không tách được"), null]);
    lines.push([L("速度解析度 " + c.velRes + " km/h", "Phân giải tốc độ " + c.velRes + " km/h"),
      L("速度是直接量到的，不用等下一張畫面", "Tốc độ đo trực tiếp, không cần đợi khung sau"), null]);
    const hz = 1000 / c.cycle;
    lines.push([L("更新：每 " + c.cycle + " 毫秒一輪（" + hz.toFixed(0) + " Hz）", "Mỗi " + c.cycle + " ms một chu kỳ (" + hz.toFixed(0) + " Hz)"),
      L("這段時間車子前進 " + (v * c.cycle / 1000).toFixed(1) + " m", "Xe đi " + (v * c.cycle / 1000).toFixed(1) + " m"), null]);

  } else if (c.type === "sonar") {
    head = seeHead();
    const reach = c.rangeMax >= rm;
    if (!reach) ok = false;
    lines.push([L("測距 " + c.rangeMax + " m（最近 " + c.rangeMin + " m）", "Tầm " + c.rangeMax + " m (gần nhất " + c.rangeMin + " m)"),
      reach ? L("夠，門檻 " + rm.toFixed(0) + " m", "Đủ, ngưỡng " + rm.toFixed(0) + " m")
            : L("不夠，門檻 " + rm.toFixed(0) + " m，差 " + (rm - c.rangeMax).toFixed(1) + " m", "Thiếu " + (rm - c.rangeMax).toFixed(1) + " m so với ngưỡng " + rm.toFixed(0) + " m"), reach]);
    if (c.angle != null) {
      const wid = 2 * s.d * Math.tan(c.angle / 2 * R);
      lines.push([L("波束角 " + c.angle + "°", "Góc chùm " + c.angle + "°"),
        L(s.d + " m 處只蓋到 " + wid.toFixed(1) + " m 寬，車頭要裝好幾顆", "Ở " + s.d + " m chỉ phủ " + wid.toFixed(1) + " m, đầu xe phải gắn nhiều cái"), null]);
    } else {
      lines.push([L("波束角", "Góc chùm"), L("規格表上沒有這一行", "Bảng không có dòng này"), null]);
    }
    const rt = 2 * c.rangeMax / C.SOUND * 1000;
    const cyc = c.cycle || rt;
    lines.push([L("更新：聲速 " + C.SOUND + " m/s", "Tốc độ âm " + C.SOUND + " m/s"),
      L(c.rangeMax + " m 來回 " + rt.toFixed(0) + " 毫秒" + (c.cycle ? "；建議每 " + c.cycle + " 毫秒量一次" : "；表上沒寫週期") + "；這段時間車子前進 " + (v * cyc / 1000).toFixed(2) + " m",
        c.rangeMax + " m đi về " + rt.toFixed(0) + " ms" + (c.cycle ? "; nên đo mỗi " + c.cycle + " ms" : "") + "; xe đi " + (v * cyc / 1000).toFixed(2) + " m"), null]);
    if (s.v > 20) lines.push([L("車速", "Tốc độ"),
      L("時速 " + s.v + "：煞停 " + brake(s.v).toFixed(0) + " m 早就超過它看得到的距離——超音波是停車用的", "Ở " + s.v + " km/h, quãng phanh " + brake(s.v).toFixed(0) + " m đã vượt tầm nhìn của nó — siêu âm là để đỗ xe"), "warn"]);

  } else if (c.type === "gnss") {
    kind = "pos";
    let eff = null, how = "";
    if (s.sky === "none") { ok = false; }
    else if (s.sky === "open" && c.cepRTK != null) { eff = c.cepRTK + c.ppm * C.BASE_KM / 1000; how = "rtk"; }
    else { eff = c.cep; how = c.cepRTK != null ? "lost" : "plain"; }
    head = { sky: s.sky, eff, how };
    lines.push([L("天空", "Bầu trời"),
      L(s.skyZh, s.skyVi), s.sky === "none" ? false : s.sky === "canyon" ? "warn" : null]);
    if (s.sky === "none") {
      lines.push([L("精度", "Độ chính xác"), L("收不到衛星，沒有位置可言", "Không có vệ tinh, không có vị trí"), false]);
    } else {
      const good = eff <= C.POS_ERR;
      if (!good) ok = false;
      const txt = how === "rtk"
        ? L("RTK：0.01 m + 1 ppm，基準站 " + C.BASE_KM + " km → " + eff.toFixed(2) + " m，門檻 " + C.POS_ERR + " m", "RTK: 0,01 m + 1 ppm, trạm gốc " + C.BASE_KM + " km → " + eff.toFixed(2) + " m, ngưỡng " + C.POS_ERR + " m")
        : how === "lost"
        ? L("多路徑讓 RTK 失鎖，退回單機解 " + c.cep + " m CEP，門檻 " + C.POS_ERR + " m", "Đa đường làm mất RTK, còn " + c.cep + " m CEP, ngưỡng " + C.POS_ERR + " m")
        : L(c.cep + " m CEP（一半的點落在 " + c.cep + " m 內），門檻 " + C.POS_ERR + " m", c.cep + " m CEP (một nửa số điểm trong " + c.cep + " m), ngưỡng " + C.POS_ERR + " m");
      lines.push([L("精度", "Độ chính xác"), txt, good]);
    }
    lines.push([L("更新率 " + c.rate + " Hz", c.rate + " Hz"),
      L("每 " + (1000 / c.rate).toFixed(0) + " 毫秒一個位置；這段時間車子前進 " + (v / c.rate).toFixed(1) + " m",
        "Mỗi " + (1000 / c.rate).toFixed(0) + " ms một vị trí; xe đi " + (v / c.rate).toFixed(1) + " m"), null]);
    lines.push([L("冷開機 " + c.ttff + " 秒", "Khởi động lạnh " + c.ttff + " s"),
      L("開機後要等這麼久才有第一個位置", "Bật máy phải đợi chừng này mới có vị trí đầu tiên"), null]);

  } else if (c.type === "imu") {
    kind = "hold";
    const biasDh = c.bias != null ? c.bias : C.IMU_DPS * 3600;
    const b = biasDh / 3600 * R;
    const tHold = Math.sqrt(2 * C.POS_ERR / (v * b));
    head = { biasDh, tHold, outage: s.outage };
    lines.push([L("陀螺儀偏差", "Độ trôi con quay"),
      c.bias != null
        ? L(c.bias + " °/h（規格表 In-Run Bias Stability 那一行）", c.bias + " °/h (dòng In-Run Bias Stability)")
        : L("規格表沒有這一行；本課用溫度係數 " + c.zroTemp + " °/s/°C × " + C.IMU_DT + " °C = " + C.IMU_DPS + " °/s（" + biasDh + " °/h）估",
            "Bảng không có dòng này; lớp ước lượng " + c.zroTemp + " °/s/°C × " + C.IMU_DT + " °C = " + C.IMU_DPS + " °/s (" + biasDh + " °/h)"),
      c.bias != null ? null : "warn"]);
    const hold = tHold >= s.outage;
    if (!hold) ok = false;
    lines.push([L("撐多久", "Giữ được bao lâu"),
      L("橫向誤差 ≈ 車速 × 偏差 × t² ÷ 2 → " + tHold.toFixed(0) + " 秒內偏不到 " + C.POS_ERR + " m；這裡要撐 " + s.outage + " 秒（" + s.outZh + "）",
        "Sai số ngang ≈ v × trôi × t² ÷ 2 → " + tHold.toFixed(0) + " s mới lệch " + C.POS_ERR + " m; ở đây cần " + s.outage + " s (" + s.outVi + ")"), hold]);
    lines.push([L("更新率 " + c.rate + " Hz", c.rate + " Hz"),
      L("一秒給幾百到上千次，隧道裡照常工作——它不靠外界", "Hàng trăm đến hàng nghìn lần mỗi giây, trong hầm vẫn chạy — không cần bên ngoài"), null]);
  }
  return { ok, kind, head, lines, pts };
}


</script>
<script>
// 規格判讀台（第六週）的畫面程式。資料（MODELS、SCENES、CONST、GROUPS）和 judge() 由
// build_spec.js 先塞進頁面，這個檔只管畫。
const $ = (id) => document.getElementById(id);
let LANG = "zh";
const L = (zh, vi) => (LANG === "zh" ? zh : vi);
const HW_URL = "https://ch-neural.github.io/MITUST-Principles-of-Self-Driving-Cars/week6/hw/";
let model = "ars408", scene = "hanoi", cols = DEF_COLS, hzNow = DEF_HZ, TR = true;

const hzOpts = (c) => (c.modes && c.modes.hzFor && c.modes.hzFor[cols]) || (c.modes ? c.modes.hz : []);
const KIND_SEE = { lidar: 1, cam: 1, radar: 1, sonar: 1 };

// ── 左欄：型號按鈕（分五組）與規格表 ──
function modelBtns() {
  $("mdlBtns").innerHTML = GROUPS.map((g) =>
    `<div class="grp${g.key === "w5" ? "" : " new"}">${L(g.zh, g.vi)}</div><div class="grid g2">` +
    g.keys.map((k) => `<button data-mdl="${k}" class="${k === model ? "on" : ""}">${MODELS[k].name}
      <span class="vi">${L(MODELS[k].zh, MODELS[k].vi)}</span></button>`).join("") + "</div>").join("");
  // 判定卡上方：同一組的型號（換情境之後在原地輪一遍）
  const g = GROUPS.find((x) => x.keys.includes(model));
  $("mdlBtns2").innerHTML = g.keys.map((k) =>
    `<button data-mdl="${k}" class="${k === model ? "on" : ""}">${MODELS[k].name}</button>`).join("");
  [$("mdlBtns"), $("mdlBtns2")].forEach((box) =>
    box.querySelectorAll("[data-mdl]").forEach((b) => b.onclick = () => { model = b.dataset.mdl; render(); }));
}

function dsTable() {
  const m = MODELS[model];
  $("ds").innerHTML = `<div class="ds">
    <div class="hd">${m.name}<small>${L(m.zh, m.vi)}${m.real ? L("・廠商公開規格", "・thông số công khai") : L("・教學用，非實際產品", "・dùng để dạy, không phải sản phẩm thật")}</small></div>
    ${m.pic ? `<div class="pic"><img src="${m.pic}" alt="${m.name}"><span>${L(m.picCap, m.picCapVi)}</span></div>` : ""}
    ${m.rows.map(([k, v, zh, vi, key]) => `<div class="row${key ? " key" : ""}">
       <div class="k">${k}${TR ? `<small>${L(zh, vi)}</small>` : ""}</div><div class="v">${v}</div></div>`).join("")}
    <div class="src">${L("來源｜", "Nguồn｜")}${L(m.src, m.srcVi)}</div></div>`;
}

// ── 中欄：四題判讀（每個型號自己的四題；答案留在這台裝置上）──
const QKEY = "w6quiz";
let QANS = {}, QCHK = {};
try { const r = localStorage.getItem(QKEY); if (r) { const o = JSON.parse(r); QANS = o.a || {}; QCHK = o.c || {}; } } catch (e) {}
const qSave = () => { try { localStorage.setItem(QKEY, JSON.stringify({ a: QANS, c: QCHK })); } catch (e) {} };

function quiz() {
  const m = MODELS[model];
  $("quiz").innerHTML = m.quiz.map((q, i) => {
    const cur = QANS[model + "_" + i] || "";
    return `<div class="q">
    <label>${L(q.zh, q.vi)}<small>${L(q.zhs, q.vis)}</small></label>
    <select id="q_${i}"><option value=""${cur ? "" : " selected"}>${L("── 請選 ──", "── Chọn ──")}</option>
      ${q.opts.slice().sort((a, b) => String(a.v).localeCompare(String(b.v))).map((o) =>
        `<option value="${o.v}"${o.v === cur ? " selected" : ""}>${L(o.zh, o.vi)}</option>`).join("")}
    </select><div class="fb" id="f_${i}"></div></div>`; }).join("");
  m.quiz.forEach((q, i) => $("q_" + i).addEventListener("change", (e) => { QANS[model + "_" + i] = e.target.value; qSave(); }));
  if (QCHK[model]) check();
}
function check() {
  const m = MODELS[model];
  QCHK[model] = true; qSave();
  m.quiz.forEach((q, i) => {
    const sel = $("q_" + i).value, fb = $("f_" + i);
    if (!sel) { fb.className = "fb"; fb.textContent = ""; return; }
    const right = sel === q.ans;
    fb.className = "fb " + (right ? "ok" : "no");
    fb.innerHTML = (right ? "✓ " : "✗ ") + L(q.why[0], q.why[1]);
  });
}

// ── 判定 ──
function headHtml(m, s, r) {
  if (r.kind === "see") {
    const h = r.head;
    return `<div class="res">${L("情境：", "Tình huống: ")}<b>${L(s.zh, s.vi)}</b>　${L(s.zhNote, s.viNote)}
      <span class="big">${L(`煞停要 ${h.brake.toFixed(1)} m，加餘裕 ${h.margin} m → ${h.need.toFixed(1)} m；目標在 ${s.d} m　→　測距門檻 ${h.rm.toFixed(0)} m`,
        `Dừng ${h.brake.toFixed(1)} m, cộng dự phòng ${h.margin} m → ${h.need.toFixed(1)} m; vật ở ${s.d} m → ngưỡng tầm đo ${h.rm.toFixed(0)} m`)}</span>
      <span class="sm">${L(`v × 0.3 ＋ v² ÷ 12，再加餘裕（第四週）。v 用每秒公尺＝時速 ÷ 3.6，這裡是 ${(s.v / 3.6).toFixed(1)} m/s。` +
        (m.kind === "radar" ? `雷達的門檻：測距搆得到，而且一束攤到目標距離要比一個車道（${CONST.LANE_W} m）窄。` :
         m.kind === "sonar" ? `超音波只有一條門檻：測距搆得到。` : `目標上 ≥ ${CONST.MIN_PTS} 個點、相機估距 ≤ ±${CONST.MAX_ERR} m（第五週）。`),
        `v × 0,3 + v² ÷ 12, cộng dự phòng (tuần 4). v = km/h ÷ 3,6 = ${(s.v / 3.6).toFixed(1)} m/s. ` +
        (m.kind === "radar" ? `Radar: tầm đo đủ, và chùm ở khoảng cách mục tiêu phải hẹp hơn một làn (${CONST.LANE_W} m).` :
         m.kind === "sonar" ? `Siêu âm chỉ một ngưỡng: tầm đo đủ.` : `≥ ${CONST.MIN_PTS} điểm trên vật, sai số camera ≤ ±${CONST.MAX_ERR} m (tuần 5).`))}</span></div>`;
  }
  if (r.kind === "pos") {
    return `<div class="res">${L("情境：", "Tình huống: ")}<b>${L(s.zh, s.vi)}</b>　${L(s.skyZh, s.skyVi)}
      <span class="big">${L(`問的是「知不知道自己在哪個車道」：橫向誤差要 ≤ ${CONST.POS_ERR} m`, `Câu hỏi: «biết mình ở làn nào không» — sai số ngang ≤ ${CONST.POS_ERR} m`)}</span>
      <span class="sm">${L(`車道 3.5 m、車寬 1.8 m，左右各只剩 0.85 m。精度大於 ${CONST.POS_ERR} m，就可能把隔壁車道的位置當成自己的。RTK 的 ppm 用 ${CONST.BASE_KM} km 的基準站距離算。`,
        `Làn 3,5 m, xe 1,8 m, mỗi bên còn 0,85 m. Sai số lớn hơn ${CONST.POS_ERR} m thì có thể nhầm sang làn bên. ppm của RTK tính với trạm gốc ${CONST.BASE_KM} km.`)}</span></div>`;
  }
  const h = r.head;
  return `<div class="res">${L("情境：", "Tình huống: ")}<b>${L(s.zh, s.vi)}</b>　${L(s.outZh, s.outVi)}
    <span class="big">${L(`問的是「衛星斷掉 ${s.outage} 秒，它撐不撐得住」：橫向誤差要 ≤ ${CONST.POS_ERR} m`, `Câu hỏi: «mất vệ tinh ${s.outage} s, nó giữ được không» — sai số ngang ≤ ${CONST.POS_ERR} m`)}</span>
    <span class="sm">${L(`偏差 ${h.biasDh} °/h，時速 ${s.v}：撐 ${h.tHold.toFixed(0)} 秒。這是只用陀螺儀積分的粗估，真的系統還會加輪速和相機（第五章）。`,
      `Trôi ${h.biasDh} °/h, ${s.v} km/h: giữ được ${h.tHold.toFixed(0)} s. Ước lượng thô chỉ tích phân con quay; hệ thật còn thêm tốc độ bánh và camera (chương 5).`)}</span></div>`;
}

function calc() {
  const m = MODELS[model], c = m.calc, s = SCENES[scene];
  const r = judge(m, s, CONST, L, { cols, hz: hzNow });
  let html = headHtml(m, s, r);
  if (c.modes) {
    html += `<div class="res" style="margin-top:6px;font-size:11.5px">
      ${L("這一顆的兩個數字在規格表上是<b>可以設定的</b>，換一個模式結果就不一樣：", "Hai thông số này hãng ghi là <b>có thể cấu hình</b>:")}
      <div class="grid g2" style="margin-top:5px">
        <select id="mCols">${c.modes.cols.map((x) => `<option value="${x}"${x === cols ? " selected" : ""}>${x} ${L("點／圈", "điểm/vòng")}</option>`).join("")}</select>
        <select id="mHz">${hzOpts(c).map((x) => `<option value="${x}"${x === hzNow ? " selected" : ""}>${x} Hz</option>`).join("")}</select>
      </div>${hzOpts(c).length < c.modes.hz.length ? `<span class="hint" style="color:var(--amber2)">${L(`${cols} 點／圈只有 ${hzOpts(c).join(" / ")} Hz——規格書的 Lidar Operating Modes 就是這樣寫的。`, `${cols} điểm/vòng chỉ có ${hzOpts(c).join(" / ")} Hz — bảng Lidar Operating Modes ghi vậy.`)}</span>` : ""}</div>`;
  }
  const cls = (g) => (g === null ? "n" : g === "warn" ? "warn" : g ? "good" : "bad");
  const mark = (g) => (g === null ? "" : g === "warn" ? "　⚠" : g ? "　✓" : "　✗");
  html += r.lines.map(([a, b, g]) => `<div class="line"><div class="k">${a}</div><div class="v ${cls(g)}">${b}${mark(g)}</div></div>`).join("");
  html += `<span class="hint">${L("灰色的行<b>不是門檻</b>，是算給你看的代價；琥珀色是要小心的地方；只有綠色和紅色的行在決定夠不夠。",
    "Dòng xám <b>không phải ngưỡng</b>, chỉ cho thấy cái giá; màu hổ phách là chỗ cần cẩn thận; chỉ dòng xanh và đỏ mới quyết định.")}</span>`;
  const V = r.kind === "see"
    ? [L("這一顆在這個情境撐得住。接下來要問的是價錢、功耗和裝得上去嗎。", "Model này đủ dùng. Câu hỏi tiếp theo là giá, điện và chỗ lắp."),
       L("這一顆在這個情境不夠用。上面紅色那一行就是卡住的地方。", "Không đủ. Dòng màu đỏ ở trên là chỗ bị chặn.")]
    : r.kind === "pos"
    ? [L("這一顆在這個情境知道自己在哪個車道。", "Model này biết mình ở làn nào trong tình huống này."),
       L("這一顆在這個情境不知道自己在哪個車道。紅色那一行就是原因。", "Không biết mình ở làn nào. Dòng đỏ là lý do.")]
    : [L("衛星斷掉的這段時間，它撐得住。", "Trong lúc mất vệ tinh, nó giữ được."),
       L("撐不到這段時間結束。要靠別的東西來補——輪速、相機看車道線、高精地圖（第五章）。", "Không giữ được tới cuối. Phải nhờ thứ khác — tốc độ bánh xe, camera nhìn vạch làn, bản đồ HD (chương 5).")];
  html += `<div class="verdict ${r.ok ? "pass" : "fail"}">${r.ok ? V[0] : V[1]}</div>`;
  html += `<a class="hwlink" href="${HW_URL}" target="_blank" rel="noopener">${L("作業在另一頁　→", "Bài nộp ở trang khác　→")}</a>`;
  $("calc").innerHTML = html;
  if (c.modes) {
    $("mCols").onchange = (e) => { cols = +e.target.value; const ok = hzOpts(c); if (!ok.includes(hzNow)) hzNow = ok[0]; calc(); };
    $("mHz").onchange = (e) => { hzNow = +e.target.value; calc(); };
  }
}

function sceneBtns() {
  $("sceBtns").innerHTML = Object.entries(SCENES).map(([k, s]) =>
    `<button data-sce="${k}" class="${k === scene ? "on" : ""}">${L(s.zh, s.vi)}<span class="vi">${s.v} km/h</span></button>`).join("");
  $("sceBtns").querySelectorAll("[data-sce]").forEach((b) => b.onclick = () => { scene = b.dataset.sce; sceneBtns(); calc(); miniB(); });
  const s = SCENES[scene];
  $("tbNeed").innerHTML = L(
    `煞停 <b>${brake(s.v).toFixed(1)} m</b> → 至少要看到 <b>${(brake(s.v) + s.margin).toFixed(1)} m</b>　${s.zhNote}<br>${s.skyZh}；衛星斷 <b>${s.outage} 秒</b>`,
    `Phanh <b>${brake(s.v).toFixed(1)} m</b> → phải thấy <b>${(brake(s.v) + s.margin).toFixed(1)} m</b>　${s.viNote}<br>${s.skyVi}; mất vệ tinh <b>${s.outage} s</b>`);
}

// ── 三個小工具 ──
const MINI_FOR = {
  1: { ok: ["ars408", "ars548"], zh: "這一格算的是<b>雷達</b>的角解析度攤到遠處有多寬。", vi: "Khung này tính độ rộng chùm của <b>radar</b> ở xa.",
       badZh: "這一格不是在算它。光達的點數請看「判讀與試算」；它不是用一束來分東西的。", badVi: "Khung này không tính cho model đó." },
  2: { ok: ["neom8n", "zedf9p"], zh: "這一格算的是<b>衛星定位</b>的精度放到車道上。", vi: "Khung này tính độ chính xác <b>GNSS</b> trên làn đường.",
       badZh: "這一格不是在算它。它不量自己的位置。", badVi: "Khung này không tính cho model đó: nó không đo vị trí của mình." },
  3: { ok: ["icm20948", "adis16470"], zh: "這一格算的是<b>慣性 IMU</b> 的漂移。", vi: "Khung này tính độ trôi của <b>IMU</b>.",
       badZh: "這一格不是在算它。", badVi: "Khung này không tính cho model đó." },
};
function miniScope() {
  Object.entries(MINI_FOR).forEach(([k, f]) => {
    const el = $("sc" + k), fit = f.ok.includes(model);
    el.className = "scope" + (fit ? "" : " bad");
    el.innerHTML = fit ? L(f.zh, f.vi) : L(`⚠ 你現在選的是 <b>${MODELS[model].name}</b>。${f.badZh}`, `⚠ Bạn đang chọn <b>${MODELS[model].name}</b>. ${f.badVi}`);
  });
}

// ① 角解析度 → 一束攤多寬（俯視，橫向放大 5 倍，不然 1 m 的縫看不見）
function miniA() {
  const ang = +$("sA").value, d = +$("sD1").value;
  $("vA").textContent = ang.toFixed(1); $("vD1").textContent = d;
  const sep = d * Math.tan(ang * Math.PI / 180);
  const c = $("cSep"), g = c.getContext("2d");
  g.clearRect(0, 0, c.width, c.height);
  const SX = c.width / 10, sy = c.height - 14, sx = c.width / 2, ty = 26;   // 橫向 10 m 畫滿、縱向就是到目標
  // 車道：3.5 m 寬，畫中間那一道的兩條線
  g.strokeStyle = "#c8d2db"; g.setLineDash([4, 4]);
  [-1.75, 1.75].forEach((x) => { g.beginPath(); g.moveTo(sx + x * SX, ty - 10); g.lineTo(sx + x * SX, sy); g.stroke(); });
  g.setLineDash([]);
  g.fillStyle = "#5f7183"; g.font = "10px Arial"; g.fillText(L("車道 3.5 m", "làn 3,5 m"), sx - 1.75 * SX + 3, sy - 4);
  // 一束
  const half = sep / 2 * SX;
  g.fillStyle = "rgba(255,176,32,.28)"; g.strokeStyle = "#FFB020";
  g.beginPath(); g.moveTo(sx, sy); g.lineTo(sx - half, ty - 8); g.lineTo(sx + half, ty - 8); g.closePath(); g.fill(); g.stroke();
  // 兩台機車：中心相隔 1.8 m（車寬 0.8 m、縫 1 m）
  [-0.9, 0.9].forEach((x) => { g.fillStyle = "#9fb0be"; g.strokeStyle = "#5f7183";
    g.fillRect(sx + (x - 0.4) * SX, ty - 8, 0.8 * SX, 16); g.strokeRect(sx + (x - 0.4) * SX, ty - 8, 0.8 * SX, 16); });
  g.fillStyle = "#0b1f3a"; g.fillRect(sx - 7, sy - 4, 14, 8);
  g.fillStyle = "#c0392b"; g.font = "bold 11px Arial"; g.fillText(`${sep.toFixed(1)} m`, Math.min(sx + half + 4, c.width - 44), ty + 2);
  g.fillStyle = "#5f7183"; g.font = "10px Arial"; g.fillText(`${d} m`, 6, (sy + ty) / 2);
  const lane = sep <= CONST.LANE_W, two = sep < 1.0;
  $("oA").innerHTML = L(
    `<div class="calc"><i>一束的寬度</i><code>${d} m × tan(${ang.toFixed(1)}°) ＝ <b>${sep.toFixed(2)} m</b></code></div>` +
    `分得出哪一個車道（≤ ${CONST.LANE_W} m）：<b>${lane ? "分得出 ✓" : "分不出 ✗"}</b><br>` +
    `兩台相隔 1 m 的機車：<b>${two ? "分得開，兩個目標" : "黏成一個目標"}</b>` +
    `<span class="hint">ARS 408 遠場 1.6°、ARS 548 波束寬 1.2°、AT128P 光達 0.1°。拉距離看哪一顆先撐不住。</span>`,
    `<div class="calc"><i>Chùm rộng</i><code>${d} m × tan(${ang.toFixed(1)}°) = <b>${sep.toFixed(2)} m</b></code></div>` +
    `Biết ở làn nào (≤ ${CONST.LANE_W} m): <b>${lane ? "được ✓" : "không ✗"}</b><br>` +
    `Hai xe máy cách 1 m: <b>${two ? "tách được, hai mục tiêu" : "dính thành một mục tiêu"}</b>` +
    `<span class="hint">ARS 408 vùng xa 1,6°, ARS 548 chùm 1,2°, lidar AT128P 0,1°. Kéo khoảng cách xem cái nào thua trước.</span>`);
}

// ② 定位精度 vs 車道：畫 40 個定位點，一半落在圈內（這就是 CEP 的意思）
const CEPS = [0.01, 0.03, 0.1, 0.3, 0.5, 1.0, 1.5, 2.0, 2.5, 3.0, 4.0, 5.0];
function miniC() {
  const cep = CEPS[+$("sC").value];
  $("vC").textContent = cep;
  const c = $("cCep"), g = c.getContext("2d");
  g.clearRect(0, 0, c.width, c.height);
  const S = c.width / 12.5, cx = c.width / 2, cy = c.height / 2;   // 12.5 m 畫滿：三個車道加一點邊
  for (let k = -1; k <= 1; k++) {
    g.fillStyle = k ? "#e6ebf0" : "#f4f7fa";
    g.fillRect(cx + (k * 3.5 - 1.75) * S, 0, 3.5 * S, c.height);
    g.strokeStyle = "#fff"; g.lineWidth = 2; g.strokeRect(cx + (k * 3.5 - 1.75) * S, -2, 3.5 * S, c.height + 4);
  }
  g.fillStyle = "#9fb0be"; g.strokeStyle = "#5f7183"; g.lineWidth = 1;
  g.fillRect(cx - 0.9 * S, cy - 2.2 * S, 1.8 * S, 4.4 * S); g.strokeRect(cx - 0.9 * S, cy - 2.2 * S, 1.8 * S, 4.4 * S);
  // 定位點：瑞利分布，半徑取 40 個分位數（所以剛好一半在圈內，這就是 CEP 的意思）；
  // 方位用固定種子的亂數，拉滑桿時點不會亂跳
  let seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const sigma = cep / Math.sqrt(2 * Math.log(2));
  let inside = 0;
  for (let i = 0; i < 40; i++) {
    const r = sigma * Math.sqrt(-2 * Math.log(1 - (i + 0.5) / 40)), a = rnd() * 6.283;
    const x = cx + r * Math.cos(a) * S, y = cy + r * Math.sin(a) * S;
    if (r <= cep) inside++;
    g.fillStyle = r <= cep ? "#2e7d5b" : "#d9463e";
    g.beginPath(); g.arc(x, y, 2.4, 0, 6.283); g.fill();
  }
  g.strokeStyle = "#d9463e"; g.lineWidth = 2; g.beginPath(); g.arc(cx, cy, Math.max(2, cep * S), 0, 6.283); g.stroke();
  g.fillStyle = "#5f7183"; g.font = "10px Arial"; g.fillText(L("3.5 m", "3,5 m"), cx - 1.75 * S + 3, 12);
  const ok = cep <= CONST.POS_ERR;
  $("oC").innerHTML = L(
    `圈的半徑 <b>${cep} m</b>，40 個點裡 <b>${inside}</b> 個在圈內——CEP 就是「一半在圈內」。<br>` +
    `要知道自己在哪個車道（≤ ${CONST.POS_ERR} m）：<b>${ok ? "可以 ✓" : "不行 ✗"}</b>` +
    `<span class="hint">NEO-M8N 2.5 m、ZED-F9P 單機 1.5 m、ZED-F9P RTK 0.01 m（+ 每公里 1 mm）。</span>`,
    `Bán kính <b>${cep} m</b>, ${inside}/40 điểm nằm trong vòng — CEP nghĩa là «một nửa trong vòng».<br>` +
    `Biết mình ở làn nào (≤ ${CONST.POS_ERR} m): <b>${ok ? "được ✓" : "không ✗"}</b>` +
    `<span class="hint">NEO-M8N 2,5 m, ZED-F9P đơn 1,5 m, ZED-F9P RTK 0,01 m (+1 mm mỗi km).</span>`);
}

// ③ IMU 撐多久
const BIASES = [1, 8, 100, 1800, 18000, 180000];
function miniB() {
  const bias = BIASES[+$("sB").value], v = +$("sV").value;
  $("vB").textContent = bias.toLocaleString(); $("vV").textContent = v;
  const b = bias / 3600 * Math.PI / 180, ms = v / 3.6;
  const tHold = Math.sqrt(2 * CONST.POS_ERR / (ms * b));
  const c = $("cDrift"), g = c.getContext("2d");
  g.clearRect(0, 0, c.width, c.height);
  const ox = 34, oy = c.height - 18, gw = c.width - 44, gh = c.height - 30, T = 60, E = 2;
  g.strokeStyle = "#1a2733"; g.lineWidth = 1; g.beginPath(); g.moveTo(ox, oy); g.lineTo(ox + gw, oy); g.moveTo(ox, oy); g.lineTo(ox, oy - gh); g.stroke();
  g.fillStyle = "#5f7183"; g.font = "9px Arial";
  [0, 20, 40, 60].forEach((t) => g.fillText(`${t}s`, ox + gw * t / T - 6, oy + 11));
  [0.5, 1, 1.5, 2].forEach((e) => g.fillText(`${e}m`, 2, oy - gh * e / E + 3));
  const yt = oy - gh * CONST.POS_ERR / E;
  g.strokeStyle = "#d9463e"; g.beginPath(); g.moveTo(ox, yt); g.lineTo(ox + gw, yt); g.stroke();
  g.strokeStyle = "#00a896"; g.lineWidth = 2.5; g.beginPath();
  for (let i = 0; i <= 300; i++) {
    const t = T * i / 300, e = ms * b * t * t / 2;
    if (e > E) break;
    const x = ox + gw * t / T, y = oy - gh * e / E;
    i ? g.lineTo(x, y) : g.moveTo(x, y);
  }
  g.stroke();
  if (tHold < T) { g.strokeStyle = "#00a896"; g.lineWidth = 1; g.beginPath(); g.moveTo(ox + gw * tHold / T, yt); g.lineTo(ox + gw * tHold / T, oy); g.stroke(); }
  g.fillStyle = "#007f72"; g.font = "bold 11px Arial"; g.fillText(`${tHold < 1000 ? tHold.toFixed(0) : "> 999"} s`, Math.min(ox + gw * tHold / T + 4, c.width - 40), oy - 6);
  const rows = Object.values(SCENES).map((s) => `${L(s.zh, s.vi)} ${s.outage} s：${tHold >= s.outage ? "✓" : "✗"}`).join("　");
  $("oB").innerHTML = L(
    `<div class="calc"><i>撐多久</i><code>√(2 × ${CONST.POS_ERR} ÷ (${ms.toFixed(1)} m/s × ${bias} °/h)) ＝ <b>${tHold.toFixed(1)} 秒</b></code></div>` +
    `五個情境要撐的秒數：${rows}` +
    `<span class="hint">8 °/h 是 ADIS16470 規格表的數字；1800 °/h（0.5 °/s）是本課對手機級的估計；18000 °/h（5 °/s）是 ICM-20948 完全沒校正的初始零偏。</span>`,
    `<div class="calc"><i>Giữ được</i><code>√(2 × ${CONST.POS_ERR} ÷ (${ms.toFixed(1)} m/s × ${bias} °/h)) = <b>${tHold.toFixed(1)} s</b></code></div>` +
    `Năm tình huống cần: ${rows}` +
    `<span class="hint">8 °/h là số trong datasheet ADIS16470; 1800 °/h (0,5 °/s) là ước lượng của lớp cho cấp điện thoại; 18000 °/h (5 °/s) là lệch không ban đầu chưa hiệu chuẩn của ICM-20948.</span>`);
}

function render() { modelBtns(); dsTable(); quiz(); sceneBtns(); calc(); miniScope(); }
function applyLang() {
  document.querySelectorAll("[data-zh]").forEach((el) => { el.textContent = el.dataset[LANG]; });
  document.title = L("規格判讀台（第六週）", "Bàn đọc thông số (tuần 6)");
  document.documentElement.lang = LANG === "zh" ? "zh-Hant" : "vi";
  $("btnTr").classList.toggle("on", TR); $("btnEn").classList.toggle("on", !TR);
  $("btnZh").classList.toggle("on", LANG === "zh"); $("btnVi").classList.toggle("on", LANG === "vi");
  render(); miniA(); miniC(); miniB();
}
$("btnZh").onclick = () => { LANG = "zh"; applyLang(); };
$("btnVi").onclick = () => { LANG = "vi"; applyLang(); };
$("btnTr").onclick = () => { TR = true; $("btnTr").classList.add("on"); $("btnEn").classList.remove("on"); dsTable(); };
$("btnEn").onclick = () => { TR = false; $("btnEn").classList.add("on"); $("btnTr").classList.remove("on"); dsTable(); };
$("btnCheck").onclick = check;
$("btnClear").onclick = () => { MODELS[model].quiz.forEach((q, i) => delete QANS[model + "_" + i]); delete QCHK[model]; qSave(); quiz(); };
["sA", "sD1"].forEach((id) => $(id).addEventListener("input", miniA));
$("sC").addEventListener("input", miniC);
["sB", "sV"].forEach((id) => $(id).addEventListener("input", miniB));

// 手機：三個分頁，各自記住捲動位置
const MOBILE = window.matchMedia("(max-width:900px)");
const TAB_Y = {};
let tabNow = "ds";
function tab(name) {
  if (MOBILE.matches) TAB_Y[tabNow] = window.scrollY;
  tabNow = name;
  document.querySelectorAll("#mtabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === name));
  const map = { ds: "pDs", read: "pRead", mini: "pMini" };
  Object.entries(map).forEach(([k, id]) => { $(id).style.display = (!MOBILE.matches || k === name) ? "" : "none"; });
  if (MOBILE.matches) window.scrollTo(0, TAB_Y[name] || 0);
}
document.querySelectorAll("#mtabs button").forEach((b) => b.onclick = () => tab(b.dataset.tab));
MOBILE.addEventListener("change", () => tab("ds"));

applyLang();
tab("ds");

</script>
