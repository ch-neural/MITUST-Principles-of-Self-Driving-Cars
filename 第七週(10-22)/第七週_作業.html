<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>第七週作業　同一個瞬間，三種感測器</title>
<style>
:root{--navy:#0B1F3A;--navy2:#13314F;--teal:#00A896;--teal-d:#007F72;--amber:#FFB020;
      --line:#D8E0E8;--card:#F4F7FA;--mute:#5F7183;--ink:#1A2733;--red:#D9463E;--ok:#2E7D5B;--amber2:#8A5A00}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#EEF2F6;color:var(--ink);font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",Arial,sans-serif;font-size:14px;line-height:1.5}
#wrap{max-width:760px;margin:0 auto;padding:10px}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
h1{font-size:17px;margin:0;color:var(--navy)}
h1 small{display:block;font-size:11.5px;color:var(--mute);font-weight:400;margin-top:1px}
.hwq{margin:0 0 4px;font-weight:700;font-size:14px;color:var(--navy)}
.hwn{font-size:12px;color:var(--mute);margin-bottom:7px;line-height:1.5}
.q{margin-top:10px}
.q label{display:block;font-size:13px;font-weight:700;color:var(--navy2)}
.q label small{display:block;font-size:11px;font-weight:400;color:var(--mute)}
button{font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);cursor:pointer}
button:hover{border-color:var(--teal)}
button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
button.go{background:var(--teal);color:#fff;border-color:var(--teal-d);font-weight:700}
button.danger{background:var(--red);color:#fff;border-color:var(--red)}
input,select{font-family:inherit;font-size:13px;padding:7px 8px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);width:100%;min-height:36px;margin-top:4px}
.grid{display:grid;gap:7px}.g2{grid-template-columns:1fr 1fr}
.filltab{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px}
.filltab td{border-top:1px solid var(--line);padding:6px 4px;vertical-align:middle}
.filltab td:first-child{width:48%;font-weight:600;color:var(--navy2)}
.filltab select{margin-top:0}
.hintbtn{width:auto;min-height:0;margin-top:6px;padding:4px 10px;font-size:12px;background:#FFF6E3;border:1px solid var(--amber);color:var(--amber2);border-radius:14px}
.hintbtn.on{background:var(--amber);color:#fff}
.hintbox{display:none;margin-top:6px;padding:9px 11px;background:#FFF9EC;border-left:4px solid var(--amber);border-radius:6px;font-size:12.5px;line-height:1.6;color:var(--ink)}
.hintbox.on{display:block}
.hintbox b{color:var(--amber2)}
.filltab tr.hrow td{border-top:none;padding-top:0;font-weight:400}
.filltab tr.hrow .hintbtn{margin-top:0}
.prog{font-size:12px;color:var(--mute);text-align:right}
.prog b{color:var(--teal-d);font-size:14px}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.lang button{padding:5px 9px;font-size:11.5px}
.foot{position:sticky;bottom:0;background:#EEF2F6;padding:8px 0 10px}
.toollink{display:inline-block;margin-top:6px;font-size:12.5px;color:#fff;background:var(--teal);padding:7px 11px;border-radius:7px;text-decoration:none;font-weight:700}
#sheet{background:#fff;border:2px solid var(--navy);border-radius:10px;padding:14px 16px;display:none}
#sheet h3{margin:0 0 2px;font-size:16px;color:var(--navy)}
#sheet .who{font-size:14px;font-weight:700}
#sheet .when{font-size:11.5px;color:var(--mute);margin-bottom:9px}
#sheet .sec{font-size:12px;color:var(--teal-d);font-weight:700;margin:10px 0 3px}
#sheet .ans{font-size:12.5px;line-height:1.55}
#sheet .miss{color:var(--red)}
body.sheet #qs,body.sheet .foot #btnSheet,body.sheet .foot #btnWipe,body.sheet #wrap>.panel:first-child{display:none}
body.sheet #sheet{display:block}
@media print{body{background:#fff}.foot,#qs{display:none}}
</style>
</head><body>
<div id="wrap">
  <div class="panel">
    <div class="top">
      <h1 id="title"></h1>
      <div class="lang"><button id="btnZh" class="on">中文</button><button id="btnVi">Tiếng Việt</button></div>
    </div>

      <input id="hwName"><input id="hwSid">

    <div class="prog" id="progBox"></div>
    <a class="toollink" id="toolLink" href="../nusc/"></a>

  <div id="sheet"></div>
  <div class="foot grid g2">
    <button class="go" id="btnSheet"></button>
    <button id="btnWipe"></button>
    <button id="btnBack" style="display:none;grid-column:1/-1"></button>
  </div>
</div>
<script>
const HW7_TASKS = [{"key":"t1","scene":"day","zh":"任務一　白天（波士頓斑馬線，scene-0553）","vi":"Nhiệm vụ 1 — Ban ngày (vạch qua đường ở Boston, scene-0553)","note":{"zh":"場景選「白天」。先只開光達點和雷達點，再打開物體框。","vi":"Chọn cảnh «Ban ngày». Mở điểm lidar và radar trước, rồi mở hộp vật thể."},"qs":[{"id":"q1","zh":"前方相機畫面裡，光達點大約是雷達點的幾倍？","vi":"Trong khung camera trước, điểm lidar gấp khoảng mấy lần điểm radar?","hint":{"zh":"看右邊「數一數」的前兩格","vi":"Xem hai ô đầu ở mục «Đếm thử»"},"opts":[{"v":"4","zh":"約 4 倍","vi":"khoảng 4 lần"},{"v":"40","zh":"約 40 倍","vi":"khoảng 40 lần"},{"v":"400","zh":"約 400 倍","vi":"khoảng 400 lần"},{"v":"same","zh":"差不多","vi":"gần bằng nhau"}]},{"id":"q2","zh":"打開物體框：斑馬線上有 6 個行人，框裡有雷達點的有幾個？","vi":"Mở hộp: trên vạch qua đường có 6 người đi bộ, mấy người có điểm radar trong hộp?","hint":{"zh":"看下表那 6 個行人的「雷達點」；照片上框裡的雷達圈，看顏色判斷它在多遠","vi":"Xem cột «Radar» của 6 người trong bảng; vòng radar trong hộp trên ảnh, nhìn màu để biết nó xa bao nhiêu"},"opts":[{"v":"6","zh":"6 個","vi":"6 người"},{"v":"3","zh":"3 個","vi":"3 người"},{"v":"1","zh":"1 個","vi":"1 người"},{"v":"0","zh":"0 個","vi":"0 người"}]},{"id":"q3","zh":"雷達點在照片上都在很低的地方，沒有一個在樓上、樹上或招牌上。原因是：","vi":"Điểm radar trên ảnh đều ở thấp, không có điểm nào trên tầng lầu, ngọn cây hay biển hiệu. Lý do:","hint":{"zh":"上週 ARS 408 的規格表少了哪一行？","vi":"Bảng ARS 408 tuần trước thiếu dòng nào?"},"opts":[{"v":"ground","zh":"雷達只看得到地面","vi":"Radar chỉ thấy mặt đất"},{"v":"car","zh":"雷達只看得到車子","vi":"Radar chỉ thấy xe"},{"v":"height","zh":"ARS 408 量不出高度，所有點都放在同一個高度","vi":"ARS 408 không đo được độ cao, mọi điểm đặt cùng một độ cao"},{"v":"tilt","zh":"照片拍歪了","vi":"Ảnh bị chụp nghiêng"}]}]},{"key":"t2","scene":"moto","zh":"任務二　停車場的機車（新加坡，scene-0916）","vi":"Nhiệm vụ 2 — Xe máy trong bãi đỗ (Singapore, scene-0916)","note":{"zh":"場景選「停車場」，打開物體框。綠框有雷達點，橘框沒有。表格有 17 列，記得往下捲到底。","vi":"Chọn «Bãi đỗ xe», mở hộp vật thể. Hộp xanh lá có điểm radar, hộp cam thì không. Bảng có 17 dòng, nhớ cuộn xuống hết."},"qs":[{"id":"q4","zh":"前方相機畫面裡有 8 台機車，有雷達點的有幾台？","vi":"Trong khung có 8 xe máy, mấy chiếc có điểm radar?","hint":{"zh":"下表「機車」那幾列，雷達點不是 0 的（8 台都在前方相機裡）","vi":"Các dòng «Xe máy» có điểm radar khác 0 (cả 8 chiếc đều trong camera trước)"},"opts":[{"v":"8","zh":"8 台","vi":"8 chiếc"},{"v":"5","zh":"5 台","vi":"5 chiếc"},{"v":"2","zh":"2 台","vi":"2 chiếc"},{"v":"0","zh":"0 台","vi":"0 chiếc"}]},{"id":"q5","zh":"同一個畫面裡有 4 台汽車，有雷達點的有幾台？","vi":"Cùng khung có 4 ô tô, mấy chiếc có điểm radar?","hint":{"zh":"表格停在「只看前方相機畫面裡的」，往下捲到底，數「汽車」那幾列","vi":"Để bảng ở «Chỉ vật trong ảnh camera trước», cuộn xuống hết, đếm các dòng «Ô tô»"},"opts":[{"v":"0","zh":"0 台","vi":"0 chiếc"},{"v":"1","zh":"1 台","vi":"1 chiếc"},{"v":"4","zh":"4 台","vi":"4 chiếc"},{"v":"2","zh":"2 台","vi":"2 chiếc"}]}]},{"key":"t3","scene":"night","zh":"任務三　夜間（新加坡，scene-1100）","vi":"Nhiệm vụ 3 — Ban đêm (Singapore, scene-1100)","note":{"zh":"場景選「夜間」。先只看照片（把所有開關都關掉），再打開光達點。","vi":"Chọn «Ban đêm». Xem ảnh trước (tắt hết các công tắc), rồi mở điểm lidar."},"qs":[{"id":"q6","zh":"夜間畫面裡的光達點有幾個？和白天的 2,295 個比，有沒有變少？","vi":"Điểm lidar trong khung ban đêm bao nhiêu? So với 2.295 của ban ngày, có ít đi không?","hint":{"zh":"看「數一數」第一格，和任務一比","vi":"Xem ô đầu ở «Đếm thử», so với nhiệm vụ 1"},"opts":[{"v":"half","zh":"少一半","vi":"ít đi một nửa"},{"v":"tenth","zh":"只剩一成","vi":"chỉ còn một phần mười"},{"v":"zero","zh":"變成 0","vi":"bằng 0"},{"v":"same","zh":"沒有變少（反而多一些）","vi":"không ít đi (còn nhiều hơn)"}]},{"id":"q7","zh":"正在橫越路口的黑色轎車（約 16 公尺），身上有幾個光達點、幾個雷達點？","vi":"Chiếc xe đen đang băng qua ngã tư (khoảng 16 m) có bao nhiêu điểm lidar, bao nhiêu điểm radar?","hint":{"zh":"下表 15.6 m 那一台車","vi":"Dòng ô tô 15,6 m trong bảng"},"opts":[{"v":"0-7","zh":"光達 0、雷達 7","vi":"lidar 0, radar 7"},{"v":"73-0","zh":"光達 73、雷達 0","vi":"lidar 73, radar 0"},{"v":"73-7","zh":"光達 73、雷達 7","vi":"lidar 73, radar 7"},{"v":"7-73","zh":"光達 7、雷達 73","vi":"lidar 7, radar 73"}]}]},{"key":"t4","scene":"rain","zh":"任務四　夜間雨後（新加坡，scene-1094）","vi":"Nhiệm vụ 4 — Đêm sau mưa (Singapore, scene-1094)","note":{"zh":"場景選「夜間雨後」，打開物體框。找斑馬線上、離車子最近的那個行人。","vi":"Chọn «Đêm sau mưa», mở hộp. Tìm người đi bộ trên vạch qua đường, gần xe nhất."},"qs":[{"id":"q8","zh":"斑馬線上離車子約 10 公尺的行人，身上有幾個光達點、幾個雷達點？","vi":"Người đi bộ trên vạch qua đường cách xe khoảng 10 m có bao nhiêu điểm lidar, bao nhiêu điểm radar?","hint":{"zh":"下表 10.2 m 那一位","vi":"Dòng 10,2 m trong bảng"},"opts":[{"v":"49-0","zh":"光達 49、雷達 0","vi":"lidar 49, radar 0"},{"v":"0-49","zh":"光達 0、雷達 49","vi":"lidar 0, radar 49"},{"v":"49-5","zh":"光達 49、雷達 5","vi":"lidar 49, radar 5"},{"v":"5-0","zh":"光達 5、雷達 0","vi":"lidar 5, radar 0"}]},{"id":"q9","zh":"這個行人，最要靠哪一種感測器來補雷達？","vi":"Người này cần cảm biến nào bù cho radar nhất?","hint":{"zh":"誰在他身上有點、誰認得出他是人？","vi":"Cái nào có điểm trên người đó, cái nào nhận ra đó là người?"},"opts":[{"v":"us","zh":"超音波","vi":"Siêu âm"},{"v":"gnss","zh":"衛星定位","vi":"GNSS"},{"v":"cam-lidar","zh":"光達（量得到位置）和相機（認得出是人）","vi":"Lidar (đo được vị trí) và camera (nhận ra là người)"},{"v":"radar2","zh":"再多裝一顆雷達","vi":"Gắn thêm một radar"}]}]},{"key":"t5","scene":"rain","zh":"任務五　搭檔卡：三種感測器拼成一句話","vi":"Nhiệm vụ 5 — Thẻ cặp đôi: ghép ba cảm biến thành một câu","note":{"zh":"場景選「夜間雨後」或「夜間」，打開「合起來」。相機說那是什麼、光達說多遠、雷達說多快。","vi":"Chọn «Đêm sau mưa» hoặc «Ban đêm», bật «Ghép lại». Camera nói là gì, lidar nói bao xa, radar nói nhanh bao nhiêu."},"qs":[{"id":"q10","zh":"「夜間雨後」表格 12.0 m 那台車：三種感測器拼起來，是哪一句？","vi":"«Đêm sau mưa», ô tô 12,0 m trong bảng: ghép ba cảm biến lại là câu nào?","hint":{"zh":"看那一列的「雷達：多快」：那是那台車自己的速度，我們自己的車速已經扣掉了","vi":"Xem cột «Radar: km/h» của dòng đó: đó là tốc độ của chính xe kia, tốc độ xe mình đã được trừ đi"},"opts":[{"v":"near18","zh":"一台車，約 12 公尺，正以時速約 18 公里朝我們開過來","vi":"Một ô tô, khoảng 12 m, đang chạy về phía mình khoảng 18 km/h"},{"v":"ped","zh":"一個行人，約 12 公尺，正以時速約 18 公里往遠處走","vi":"Một người đi bộ, khoảng 12 m, đang đi ra xa khoảng 18 km/h"},{"v":"away18","zh":"一台車，約 12 公尺，正以時速約 18 公里往遠處開","vi":"Một ô tô, khoảng 12 m, đang chạy ra xa khoảng 18 km/h"},{"v":"stop","zh":"一台車，約 18 公尺，停著不動","vi":"Một ô tô, khoảng 18 m, đứng yên"}]},{"id":"q11","zh":"上一題那句話分三段：「一台車」「約 12 公尺」「時速 18 往遠處開」。分別最靠誰？","vi":"Câu trên có ba phần: «một ô tô», «khoảng 12 m», «chạy ra xa 18 km/h». Mỗi phần chủ yếu dựa vào ai?","hint":{"zh":"誰認得出是什麼？誰量距離最準？誰直接量速度？","vi":"Ai nhận ra là gì? Ai đo khoảng cách chuẩn nhất? Ai đo thẳng tốc độ?"},"opts":[{"v":"radar-cam-lidar","zh":"雷達／相機／光達","vi":"Radar / camera / lidar"},{"v":"all-radar","zh":"三段都是雷達","vi":"Cả ba đều là radar"},{"v":"lidar-radar-cam","zh":"光達／雷達／相機","vi":"Lidar / radar / camera"},{"v":"cam-lidar-radar","zh":"相機／光達／雷達","vi":"Camera / lidar / radar"}]},{"id":"q12","zh":"「夜間」那台黑色轎車（15.6 m），照片上它正在開過路口，可是「雷達：多快」寫 ≈0。為什麼？","vi":"«Ban đêm», chiếc xe đen (15,6 m) đang chạy qua ngã tư, nhưng «Radar: km/h» ghi ≈0. Vì sao?","hint":{"zh":"雷達用都卜勒量速度，量的是哪一段？","vi":"Radar đo tốc độ bằng Doppler, đo được phần nào?"},"opts":[{"v":"dark","zh":"晚上雷達看不見","vi":"Ban đêm radar không thấy"},{"v":"side","zh":"它是橫著開，雷達只量得到朝自己靠近或遠離的那一段","vi":"Nó chạy ngang, radar chỉ đo được phần lại gần hoặc ra xa xe mình"},{"v":"stopped","zh":"那台車其實停著","vi":"Xe đó thật ra đang đứng yên"},{"v":"broken","zh":"雷達壞了","vi":"Radar bị hỏng"}]},{"id":"q13","zh":"「夜間雨後」斑馬線上 10.2 m 的行人，「雷達：多快」是「—」。這一塊要怎麼補？","vi":"«Đêm sau mưa», người đi bộ 10,2 m trên vạch, «Radar: km/h» là «—». Phần này bù thế nào?","hint":{"zh":"速度就是「位置變了多少÷過了多久」","vi":"Tốc độ = «vị trí đổi bao nhiêu ÷ qua bao lâu»"},"opts":[{"v":"radar2","zh":"再多裝一顆雷達","vi":"Gắn thêm một radar"},{"v":"us","zh":"用超音波量","vi":"Dùng siêu âm đo"},{"v":"none","zh":"不用補，行人不會動","vi":"Không cần, người đi bộ không di chuyển"},{"v":"track","zh":"用光達（或相機）連續幾格的位置變化，算出他走多快","vi":"Dùng lidar (hoặc camera) theo dõi vị trí qua vài khung để tính tốc độ"}]}]}], HW7_FILL_OPTS = [{"v":"cam","zh":"相機","vi":"Camera"},{"v":"radar","zh":"雷達","vi":"Radar"},{"v":"lidar","zh":"光達","vi":"Lidar"},{"v":"us","zh":"超音波","vi":"Siêu âm"},{"v":"loc","zh":"衛星定位＋IMU＋地圖","vi":"GNSS + IMU + bản đồ"},{"v":"lidar-radar","zh":"光達或雷達","vi":"Lidar hoặc radar"},{"v":"cam-lidar","zh":"相機和光達","vi":"Camera và lidar"}], HW7_FILL = [{"id":"f1","zh":"不知道那是什麼（人？垃圾桶？）","vi":"Không biết đó là cái gì (người? thùng rác?)"},{"id":"f2","zh":"讀不出紅綠燈的顏色","vi":"Không đọc được màu đèn giao thông"},{"id":"f3","zh":"不知道接近得多快","vi":"Không biết lại gần nhanh bao nhiêu"},{"id":"f4","zh":"保險桿前面的近距離盲區","vi":"Vùng mù sát cản xe"},{"id":"f5","zh":"天黑，相機看不清楚","vi":"Trời tối, camera nhìn không rõ"},{"id":"f6","zh":"不知道自己在哪裡","vi":"Không biết mình đang ở đâu"},{"id":"f7","zh":"（今天新加）雷達量不出高度","vi":"(Mới hôm nay) Radar không đo được độ cao"},{"id":"f8","zh":"（今天新加）雷達很少抓到行人和機車","vi":"(Mới hôm nay) Radar ít khi bắt được người đi bộ, xe máy"}], HW7_CONCL = [{"v":"radar","zh":"雷達最可靠：下雨、晚上都不怕，所以只要裝雷達就好。","vi":"Radar đáng tin nhất: mưa, đêm đều không sợ, nên chỉ cần gắn radar."},{"v":"lidar","zh":"光達點最多，所以光達可以取代相機和雷達。","vi":"Lidar nhiều điểm nhất, nên lidar thay được camera và radar."},{"v":"fuse","zh":"同一個瞬間，三種感測器看到的東西不一樣：雷達量得到速度但抓不太到行人、量不出高度；光達有形狀但一遠就稀；相機認得出是什麼但怕暗和雨。所以要合起來用。","vi":"Cùng một khoảnh khắc, ba cảm biến thấy khác nhau: radar đo được tốc độ nhưng ít bắt được người, không có độ cao; lidar có hình dạng nhưng xa thì thưa; camera nhận ra là gì nhưng sợ tối và mưa. Vì vậy phải ghép lại."},{"v":"data","zh":"nuScenes 的資料太舊了，看不出什麼。","vi":"Dữ liệu nuScenes quá cũ, không thấy được gì."}], HW7_ANS = {"q1":"40","q2":"0","q3":"height","q4":"2","q5":"4","q6":"same","q7":"73-7","q8":"49-0","q9":"cam-lidar","q10":"away18","q11":"cam-lidar-radar","q12":"side","q13":"track","f1":"cam","f2":"cam","f3":"radar","f4":"us","f5":"lidar-radar","f6":"loc","f7":"lidar","f8":"cam-lidar","concl":"fuse"}, HW7_EXPL = {"q1":{"zh":"「數一數」第一格光達 2,295 個點，第二格雷達 56 個點。2,295 ÷ 56 ≈ 41，最接近「約 40 倍」。光達有 32 條雷射線一直轉，點又密又整齊；雷達每一輪只回報夠強的回波，所以少很多。","vi":"Ô đầu «Đếm thử» có 2.295 điểm lidar, ô thứ hai 56 điểm radar. 2.295 ÷ 56 ≈ 41, gần nhất là «khoảng 40 lần». Lidar có 32 tia quay liên tục nên điểm dày và đều; radar mỗi vòng chỉ báo sóng dội đủ mạnh nên ít hơn nhiều."},"q2":{"zh":"0 個。斑馬線上 6 個行人離車子只有 8 到 10 公尺，表格裡這 6 列的雷達點全部是 0，框都是橘色；光達每個人身上都有點（7 到 71 個）。人小、又不是金屬，反射很弱，橫著走又像靜止的東西，雷達看人抓不穩。第一節看過同一群人前後 15 秒：其實大約三成的時候抓得到，這一格剛好全部漏掉。照片上框裡看起來有雷達圈，看顏色是藍、紫色：它們離車子 18 公尺以上，在行人後面；雷達量不出高度，畫到照片上才疊進框裡。","vi":"0 người. Sáu người trên vạch qua đường chỉ cách xe 8–10 m, sáu dòng này trong bảng đều có 0 điểm radar, hộp đều màu cam; lidar thì người nào cũng có điểm (7–71). Người nhỏ, không phải kim loại nên phản xạ yếu, đi ngang lại trông như vật đứng yên; radar bắt người không ổn định. Tiết 1 đã xem cùng nhóm người trong 15 giây: khoảng 3/10 thời gian radar bắt được, khung này đúng lúc bỏ sót hết. Trên ảnh trong hộp trông như có vòng radar, nhìn màu thì là xanh, tím: chúng cách xe từ 18 m trở lên, ở phía sau người đi bộ; radar không đo được độ cao nên khi vẽ lên ảnh mới chồng vào hộp."},"q3":{"zh":"ARS 408 量不出高度：資料裡每個雷達點的高度都是 0，全部放在雷達自己的安裝高度（離地約半公尺）。照片上近的點低、遠的點貼著地平線，是透視，不是量到的高度；樓上、樹上、招牌上一個點都沒有。其他三個選項：雷達點落在車身上，不是只有地面；路邊靜止的東西也有點，不是只有車；照片沒拍歪，光達點就有高有低。","vi":"ARS 408 không đo được độ cao: trong dữ liệu mọi điểm radar có độ cao bằng 0, đều đặt ở độ cao lắp radar (cách đất khoảng nửa mét). Trên ảnh điểm gần thấp, điểm xa sát đường chân trời là do phối cảnh, không phải độ cao đo được; trên tầng lầu, ngọn cây, biển hiệu không có điểm nào. Ba lựa chọn kia sai: điểm radar nằm trên thân xe chứ không chỉ mặt đất; vật đứng yên bên đường cũng có điểm; ảnh không bị nghiêng vì điểm lidar có cao có thấp."},"q4":{"zh":"2 台。8 台機車裡，只有 16.8 m 那台（2 個點）和 21.8 m 其中一台（1 個點）有雷達點，其他 6 台都是 0。21.8 m 那台的「雷達：多快」是一條線，因為它唯一的點被官方過濾條件拿掉了，但點數還是 1。16.8 m 那台在表格比較上面，要往回捲才看得到。","vi":"2 chiếc. Trong 8 xe máy, chỉ chiếc 16,8 m (2 điểm) và một chiếc 21,8 m (1 điểm) có điểm radar, 6 chiếc còn lại đều 0. Chiếc 21,8 m có cột «Radar: km/h» là gạch ngang vì điểm duy nhất của nó bị bộ lọc chính thức loại, nhưng số điểm vẫn là 1. Chiếc 16,8 m nằm phía trên bảng, phải cuộn lên mới thấy."},"q5":{"zh":"4 台，每台 1 到 3 個點。機車比汽車近，雷達反而抓不太到：汽車是一大塊金屬，像一面鏡子；機車小、很多部分是塑膠，回波很弱。滿街機車的河內、胡志明市，這一點特別重要。","vi":"4 chiếc, mỗi chiếc 1–3 điểm. Xe máy gần hơn ô tô mà radar lại khó bắt: ô tô là khối kim loại lớn như tấm gương; xe máy nhỏ, nhiều phần bằng nhựa, sóng dội về rất yếu. Ở Hà Nội, TP. Hồ Chí Minh đầy xe máy, điều này đặc biệt quan trọng."},"q6":{"zh":"沒有變少。夜間 3,325 個光達點，白天 2,295 個，晚上反而多一些：兩格拍的地方不一樣，點數本來就會差一些，重點是天黑沒有讓它變少。光達自己打雷射出去，不需要外面的光；天黑了相機看不清楚，光達的點沒有少。","vi":"Không ít đi. Ban đêm 3.325 điểm lidar, ban ngày 2.295, đêm còn nhiều hơn: hai khung chụp ở hai nơi khác nhau nên số điểm vốn khác nhau, điều quan trọng là trời tối không làm nó ít đi. Lidar tự phát tia laser, không cần ánh sáng bên ngoài; trời tối camera nhìn không rõ nhưng lidar không mất điểm nào."},"q7":{"zh":"表格 15.6 m 那台車：光達 73 個點、雷達 7 個點。照片上黑色車身幾乎融進背景，可是光達和雷達照樣量得到，這就是「天黑，相機看不清楚」由光達或雷達來補。","vi":"Dòng ô tô 15,6 m: 73 điểm lidar, 7 điểm radar. Trên ảnh thân xe đen gần như hoà vào nền, nhưng lidar và radar vẫn đo được; đó là «trời tối camera không rõ» thì lidar hoặc radar bù."},"q8":{"zh":"表格 10.2 m 那位行人：光達 49 個點、雷達 0 個。十公尺已經很近，雷達還是沒有點。整份資料裡，行人在十公尺內也只有兩成多抓得到。","vi":"Người đi bộ 10,2 m: 49 điểm lidar, 0 điểm radar. 10 m đã rất gần mà radar vẫn không có điểm. Trong cả bộ dữ liệu, người đi bộ trong 10 m cũng chỉ khoảng hơn 2/10 bị radar bắt."},"q9":{"zh":"光達和相機。光達有 49 個點，知道他在哪、多遠；可是 49 個點只是一小團，要知道那是人、不是柱子，要靠相機。超音波只看得到幾公尺；衛星定位是知道自己在哪；多裝一顆雷達也沒用，雷達本來就不擅長看人。","vi":"Lidar và camera. Lidar có 49 điểm, biết người đó ở đâu, bao xa; nhưng 49 điểm chỉ là một cụm nhỏ, muốn biết đó là người chứ không phải cột thì cần camera. Siêu âm chỉ thấy vài mét; GNSS là biết mình ở đâu; gắn thêm radar cũng vô ích vì radar vốn không giỏi nhìn người."},"q10":{"zh":"表格 12.0 m 那台車，「雷達：多快」寫「遠離 18」。這一欄是那台車自己的速度：nuScenes 的雷達資料已經把我們自己的車速扣掉了（第一節講靜止的東西時用的那個減法）。所以是：一台車，約 12 公尺，正以時速約 18 公里往遠處開。用官方標註前後兩格的位置算，這台車真的以時速 18 左右在開，雷達量得很準。注意：我們的車這時候也以時速約 9 往前開，所以兩台車之間的距離，只以時速約 9 公里慢慢拉開。","vi":"Dòng ô tô 12,0 m, cột «Radar: km/h» ghi «ra xa 18». Cột này là tốc độ của chính xe kia: dữ liệu radar của nuScenes đã trừ tốc độ xe mình (phép trừ ở tiết 1 khi nói về vật đứng yên). Vậy là: một ô tô, khoảng 12 m, đang chạy ra xa khoảng 18 km/h. Tính từ vị trí của nhãn chính thức ở hai khung trước sau, xe này thật sự chạy khoảng 18 km/h, radar đo rất chuẩn. Lưu ý: lúc này xe mình cũng chạy tới khoảng 9 km/h, nên khoảng cách giữa hai xe chỉ tăng dần khoảng 9 km/h."},"q11":{"zh":"相機／光達／雷達。「一台車」只有相機認得出；「12 公尺」是表格的距離，用官方的框算的，那個框是照光達的點畫的；「時速 18 往遠處開」是雷達用都卜勒直接量的。三種感測器各給一塊，拼成一句完整的話，這就是融合。","vi":"Camera / lidar / radar. «Một ô tô» chỉ camera nhận ra; «12 m» là khoảng cách trong bảng, tính từ hộp chính thức vẽ theo điểm lidar; «chạy ra xa 18 km/h» là radar đo thẳng bằng Doppler. Ba cảm biến mỗi cái góp một phần, ghép thành một câu hoàn chỉnh — đó là hợp nhất."},"q12":{"zh":"它是橫著開。用官方標註算，這台車實際約時速 22，可是朝自己車子靠近的那一段只有約時速 5。雷達的都卜勒只量得到「靠近或遠離」的那一段，就像站在路邊看車從左開到右，它沒有變近也沒有變遠。橫著開的車，速度要靠追蹤位置的變化來算。","vi":"Nó chạy ngang. Theo nhãn chính thức, xe thật sự chạy khoảng 22 km/h, nhưng phần hướng về xe mình chỉ khoảng 5 km/h. Doppler của radar chỉ đo được phần «lại gần hay ra xa», như đứng bên đường nhìn xe chạy từ trái sang phải: nó không gần thêm cũng không xa thêm. Xe chạy ngang thì tốc độ phải tính bằng cách bám theo vị trí thay đổi."},"q13":{"zh":"用光達（或相機）追蹤。速度＝位置變了多少 ÷ 過了多久。光達每秒轉 20 圈，把他連續幾格的位置記下來，一除就知道他走多快。超音波太近；行人當然會動；多裝雷達也一樣抓不到。","vi":"Dùng lidar (hoặc camera) để bám theo. Tốc độ = vị trí thay đổi bao nhiêu ÷ qua bao lâu. Lidar quay 20 vòng mỗi giây, ghi vị trí của người đó qua vài khung liên tiếp rồi chia là biết đi nhanh bao nhiêu. Siêu âm quá gần; người đi bộ tất nhiên có di chuyển; thêm radar cũng vẫn khó bắt."},"f1":{"zh":"相機。光達、雷達只知道「那裡有一團東西」；分得出是人還是垃圾桶的，是相機。","vi":"Camera. Lidar, radar chỉ biết «ở đó có một khối»; phân biệt người hay thùng rác là camera."},"f2":{"zh":"相機。紅綠燈的顏色只有相機讀得出來，這一列沒有別人補得上。","vi":"Camera. Màu đèn giao thông chỉ camera đọc được, hàng này không ai khác bù được."},"f3":{"zh":"雷達。它用都卜勒直接量接近的速度；觀察台上雷達點分實心（在動）、空心（靜止），就是靠它量的速度。","vi":"Radar. Nó dùng Doppler đo thẳng tốc độ lại gần; trên Bàn quan sát, điểm radar đặc (đang chạy) hay rỗng (đứng yên) chính là nhờ tốc độ nó đo."},"f4":{"zh":"超音波。量保險桿前面幾十公分的距離，停車時嗶嗶叫的就是它（第六週）。","vi":"Siêu âm. Đo khoảng cách vài chục cm trước cản, chính là cái kêu bíp bíp khi đỗ xe (tuần 6)."},"f5":{"zh":"光達或雷達。任務三看到：晚上光達的點沒有變少，那台黑色轎車雷達也抓到 7 個點。","vi":"Lidar hoặc radar. Nhiệm vụ 3: ban đêm điểm lidar không ít đi, chiếc xe đen radar cũng bắt được 7 điểm."},"f6":{"zh":"衛星定位＋IMU＋地圖（第六週）：衛星給位置，衛星斷了 IMU 先撐，再拿地圖對照。","vi":"GNSS + IMU + bản đồ (tuần 6): vệ tinh cho vị trí, mất vệ tinh thì IMU gánh tạm, rồi đối chiếu bản đồ."},"f7":{"zh":"光達。任務一看到雷達點全部在同一個高度；光達 32 條雷射線各有上下的角度，點有高有低，量得出幾公尺高。相機看得出東西在畫面的上面還是下面，可是量不出它離地幾公尺，所以最直接的答案是光達。","vi":"Lidar. Nhiệm vụ 1 thấy điểm radar đều cùng một độ cao; 32 tia lidar mỗi tia có góc lên xuống riêng, điểm có cao có thấp, đo được cao mấy mét. Camera thấy vật nằm trên hay dưới trong ảnh, nhưng không đo được cách mặt đất mấy mét, nên câu trả lời trực tiếp nhất là lidar."},"f8":{"zh":"相機和光達。任務二：8 台機車只有 2 台有雷達點；任務四：10 公尺的行人雷達 0 點。光達有點，知道在哪；相機認得出是什麼。","vi":"Camera và lidar. Nhiệm vụ 2: 8 xe máy chỉ 2 chiếc có điểm radar; nhiệm vụ 4: người đi bộ 10 m có 0 điểm radar. Lidar có điểm, biết ở đâu; camera nhận ra là gì."},"concl":{"zh":"第三句：三種感測器在同一個瞬間看到的不一樣，各有強項和弱點，所以要合起來。其他三句都錯：雷達抓不太到人、也量不出高度，不能只裝雷達；光達點多，可是認不出那是什麼、一遠就稀，取代不了相機和雷達；資料舊不是理由，今天看到的弱點都是真的。","vi":"Câu thứ ba: cùng một khoảnh khắc ba cảm biến thấy khác nhau, mỗi cái có điểm mạnh điểm yếu, nên phải ghép lại. Ba câu kia đều sai: radar khó bắt người, không đo được độ cao nên không thể chỉ gắn radar; lidar nhiều điểm nhưng không nhận ra là gì, xa thì thưa, không thay được camera và radar; dữ liệu cũ không phải lý do, những điểm yếu hôm nay thấy đều là thật."}};
</script>
<script>
// 第七週作業頁的畫面程式。題庫（不含解答）由 build_hw7.js 塞進頁面。
const $ = (id) => document.getElementById(id);
let ZH = true;
const L = (zh, vi) => (ZH ? zh : vi);
const LO = (o) => (o ? L(o.zh, o.vi) : "");

const KEY = "w7hw";
const blank = () => ({ name: "", sid: "", a: {} });
let HW = blank();
try { const r = localStorage.getItem(KEY); if (r) HW = Object.assign(blank(), JSON.parse(r)); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(HW)); } catch (e) {} };

const ALLQ = [...HW7_TASKS.flatMap((t) => t.qs.map((q) => q.id)), ...HW7_FILL.map((f) => f.id), "concl"];

const opt = (v, cur, txt) => `<option value="${v}"${String(cur) === String(v) ? " selected" : ""}>${txt}</option>`;
// 提示：按了才顯示答案與說明
const OPEN = new Set();
const hint = (id, opts) => {
  const a = opts.find((o) => o.v === HW7_ANS[id]);
  return `<button class="hintbtn${OPEN.has(id) ? " on" : ""}" data-h="${id}">💡 ${L("提示：看答案與說明", "Gợi ý: xem đáp án và giải thích")}</button>` +
    `<div class="hintbox${OPEN.has(id) ? " on" : ""}" id="hb_${id}"><b>${L("答案：", "Đáp án: ")}${LO(a)}</b><br>${LO(HW7_EXPL[id])}</div>`;
};
const sel = (id, opts) => `<select data-q="${id}">${opt("", HW.a[id] || "", L("── 請選 ──", "── Chọn ──"))}${opts.map((o) => opt(o.v, HW.a[id] || "", LO(o))).join("")}</select>`;

function render() {
  document.documentElement.lang = ZH ? "zh-Hant" : "vi";
  $("title").innerHTML = L("第七週作業　同一個瞬間，三種感測器", "Bài tuần 7 — Cùng một khoảnh khắc, ba cảm biến") +
    `<small>${L("用 nuScenes 觀察台作答；做完按「產生作答單」，截圖傳 LINE", "Trả lời bằng Bàn quan sát nuScenes; xong bấm «Tạo phiếu», chụp màn hình gửi LINE")}</small>`;
  $("hwName").placeholder = L("姓名", "Họ tên"); $("hwName").value = HW.name;
  $("hwSid").placeholder = L("班級／學號", "Lớp / MSSV"); $("hwSid").value = HW.sid;
  $("toolLink").textContent = L("打開 nuScenes 觀察台 →", "Mở Bàn quan sát nuScenes →");
  let h = HW7_TASKS.map((t) => `<div class="panel"><div class="hwq">${L(t.zh, t.vi)}</div><div class="hwn">${LO(t.note)}</div>` +
    t.qs.map((q) => `<div class="q"><label>${q.id.slice(1)}. ${L(q.zh, q.vi)}<small>${LO(q.hint)}</small></label>${sel(q.id, q.opts)}${hint(q.id, q.opts)}</div>`).join("") + "</div>").join("");
  h += `<div class="panel"><div class="hwq">${L("任務六　把第三週那張表填完", "Nhiệm vụ 6 — Điền xong bảng của tuần 3")}</div>` +
    `<div class="hwn">${L("「每一種的弱點，由哪一種來補」：每一列選一個。最後兩列是今天在 nuScenes 裡看到的。", "«Điểm yếu của mỗi loại, loại nào bù»: mỗi dòng chọn một. Hai dòng cuối là điều hôm nay thấy trong nuScenes.")}</div>` +
    `<table class="filltab">${HW7_FILL.map((f) => `<tr><td>${L(f.zh, f.vi)}</td><td>${sel(f.id, HW7_FILL_OPTS)}</td></tr><tr class="hrow"><td colspan="2">${hint(f.id, HW7_FILL_OPTS)}</td></tr>`).join("")}</table></div>`;
  h += `<div class="panel"><div class="hwq">${L("任務七　選一句今天的結論", "Nhiệm vụ 7 — Chọn một câu kết luận")}</div>` +
    `<div class="hwn">${L("要選那句把三種感測器各自的強項和弱點都講對的。", "Chọn câu nói đúng điểm mạnh và điểm yếu của cả ba cảm biến.")}</div>${sel("concl", HW7_CONCL)}${hint("concl", HW7_CONCL)}</div>`;
  $("qs").innerHTML = h;
  document.querySelectorAll("[data-q]").forEach((e) => e.onchange = () => { HW.a[e.dataset.q] = e.value; save(); prog(); });
  document.querySelectorAll("[data-h]").forEach((b) => b.onclick = () => {
    const id = b.dataset.h; OPEN.has(id) ? OPEN.delete(id) : OPEN.add(id);
    b.classList.toggle("on"); $("hb_" + id).classList.toggle("on");
  });
  $("btnSheet").textContent = L("產生作答單（交這一頁）", "Tạo phiếu trả lời (nộp trang này)");
  if (!wipeTimer) wipeReset();
  $("btnBack").textContent = L("← 回去改", "← Quay lại sửa");
  prog();
}

function prog() {
  const n = ALLQ.filter((q) => HW.a[q]).length;
  $("progBox").innerHTML = L("已經填了 ", "Đã điền ") + `<b>${n}</b> / ${ALLQ.length}` + (n === ALLQ.length ? L("　全部填完了 ✓", "　Xong hết ✓") : "");
}

function sheet() {
  const miss = `<span class="miss">${L("（沒寫）", "(chưa điền)")}</span>`;
  const txt = (id, opts) => { const o = opts.find((x) => x.v === HW.a[id]); return o ? LO(o) : miss; };
  const d = new Date(), two = (n) => String(n).padStart(2, "0");
  let h = `<h3>${L("第七週作業　同一個瞬間，三種感測器", "Bài tuần 7 — Cùng một khoảnh khắc, ba cảm biến")}</h3>` +
    `<div class="who">${HW.name || miss}　${HW.sid || ""}</div>` +
    `<div class="when">${d.getFullYear()}-${two(d.getMonth() + 1)}-${two(d.getDate())} ${two(d.getHours())}:${two(d.getMinutes())}</div>`;
  HW7_TASKS.forEach((t) => {
    h += `<div class="sec">${L(t.zh, t.vi)}</div><div class="ans">` +
      t.qs.map((q) => `${q.id.slice(1)}. ${txt(q.id, q.opts)}`).join("<br>") + "</div>";
  });
  h += `<div class="sec">${L("任務六　誰來補", "Nhiệm vụ 6 — Ai bù")}</div><div class="ans">` +
    HW7_FILL.map((f) => `${L(f.zh, f.vi)} → ${txt(f.id, HW7_FILL_OPTS)}`).join("<br>") + "</div>";
  h += `<div class="sec">${L("任務七　結論", "Nhiệm vụ 7 — Kết luận")}</div><div class="ans">${txt("concl", HW7_CONCL)}</div>`;
  $("sheet").innerHTML = h;
  document.body.classList.add("sheet");
  $("btnBack").style.display = "";
  window.scrollTo(0, 0);
}

let wipeTimer = null;
function wipeReset() { const b = $("btnWipe"); b.textContent = L("全部清空", "Xoá hết"); b.classList.remove("danger"); }
$("btnWipe").onclick = () => {
  const b = $("btnWipe");
  if (!wipeTimer) {
    b.textContent = L("再按一次：整份作業都會清掉", "Bấm lần nữa: xoá toàn bộ bài");
    b.classList.add("danger");
    wipeTimer = setTimeout(() => { wipeTimer = null; wipeReset(); }, 3000);
    return;
  }
  clearTimeout(wipeTimer); wipeTimer = null;
  HW = blank(); save(); render(); window.scrollTo(0, 0);
};
$("hwName").oninput = (e) => { HW.name = e.target.value; save(); };
$("hwSid").oninput = (e) => { HW.sid = e.target.value; save(); };
$("btnSheet").onclick = sheet;
// 「打開觀察台」：GitHub Pages 上（…/week7/hw/）連 ../nusc/；直接開檔案時連同一個資料夾裡的觀察台檔。
if (!/\/week7\/hw\/?(index\.html)?$/.test(location.pathname)) $("toolLink").href = "第七週_nuScenes觀察台.html";
$("btnBack").onclick = () => { document.body.classList.remove("sheet"); $("btnBack").style.display = "none"; window.scrollTo(0, 0); };
$("btnZh").onclick = () => { ZH = true; $("btnZh").classList.add("on"); $("btnVi").classList.remove("on"); render(); if (document.body.classList.contains("sheet")) sheet(); };
$("btnVi").onclick = () => { ZH = false; $("btnVi").classList.add("on"); $("btnZh").classList.remove("on"); render(); if (document.body.classList.contains("sheet")) sheet(); };
render();

</script>
