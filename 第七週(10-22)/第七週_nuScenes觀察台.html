<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>nuScenes 觀察台（第七週）</title>
<style>
  :root{--navy:#0B1F3A;--navy2:#13314F;--teal:#00A896;--teal-d:#007F72;--amber:#FFB020;
        --line:#D8E0E8;--card:#F4F7FA;--mute:#5F7183;--ink:#1A2733;--red:#D9463E;--ok:#2E7D5B;--amber2:#7A4E00}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:#EEF2F6;color:var(--ink);
       font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",Arial,sans-serif;font-size:14px;line-height:1.5}
  #stick{position:sticky;top:0;z-index:6;background:#fff;border-bottom:1px solid var(--line)}
  #topbar{display:flex;align-items:center;gap:10px;padding:7px 12px;flex-wrap:wrap}
  #topbar h1{font-size:15px;margin:0;color:var(--navy);flex:0 0 auto}
  #topbar h1 small{display:block;font-size:10.5px;color:var(--mute);font-weight:400}
  #sceBtns{display:flex;gap:6px;flex:1 1 auto;flex-wrap:wrap}
  button{font-family:inherit;font-size:12px;padding:6px 9px;border:1px solid var(--line);
         background:#fff;color:var(--ink);border-radius:7px;cursor:pointer;line-height:1.25}
  button:hover{border-color:var(--teal)}
  button.on{background:var(--navy);border-color:var(--navy);color:#fff}
  button .vi{display:block;font-size:9.5px;opacity:.75}
  .lang{display:flex;flex:0 0 auto;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;margin-left:auto}
  .lang button{padding:5px 11px;font-size:11.5px;border:none;border-radius:0}
  .lang button.on{background:var(--navy);color:#fff}
  #app{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:12px;padding:12px;align-items:start}
  .panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}
  h2{font-size:13px;margin:0 0 6px;color:var(--teal-d)}
  .note{font-size:11.5px;color:var(--mute);margin:2px 0 8px;line-height:1.45}
  .tog{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
  .tog button{flex:1 1 0;min-width:80px}
  canvas{display:block;width:100%;height:auto;border-radius:6px;background:#0b1520}
  #cBev{max-width:560px;margin:0 auto}
  #app>div,#app>.panel{min-width:0}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--mute);margin-top:6px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:4px;vertical-align:-1px}
  .legend i.sq{border-radius:2px}
  .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:0 0 10px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 8px}
  .stat b{display:block;font-size:19px;color:var(--navy);line-height:1.2}
  .stat span{font-size:10.5px;color:var(--mute);line-height:1.3;display:block}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{background:var(--navy);color:#fff;font-weight:600;padding:5px 6px;text-align:left;font-size:11px;position:sticky;top:0}
  td{padding:5px 6px;border-top:1px solid var(--line)}
  tr.zero td.r{color:var(--red);font-weight:700}
  td .side{color:var(--mute);font-size:11px}
  tr.sel td{background:#FFF3C4}
  tbody tr{cursor:pointer}
  .tblwrap{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:8px}
  .foot{font-size:10.5px;color:var(--mute);margin-top:10px;border-top:1px solid var(--line);padding-top:6px;line-height:1.5}
  .foot a{color:var(--teal-d)}
  .hwlink{display:block;margin-top:10px;padding:9px 10px;border-radius:7px;text-align:center;background:var(--teal);color:#fff;font-size:12.5px;font-weight:700;text-decoration:none}
  @media (max-width:900px){
    #app{display:block;padding:8px}
    .panel{margin-bottom:8px}
    #topbar{padding:6px 8px;gap:7px}
    #topbar h1{order:1;flex:1 1 auto;min-width:0}
    .lang{order:2}
    #sceBtns{order:3;flex:1 1 100%;display:grid;grid-template-columns:1fr 1fr}
    #sceBtns button{min-width:0;padding:6px 2px;font-size:11.5px}
    .stat b{font-size:16px}
    table{font-size:11.5px}
    th,td{padding:5px 4px}
    button{font-size:12.5px;min-height:36px}
  }
</style>
</head>
<body>
<div id="stick">
<div id="topbar">
  <h1><span data-zh="nuScenes 觀察台" data-vi="Bàn quan sát nuScenes"></span><small data-zh="第七週：同一個瞬間，相機、光達、雷達各看到什麼" data-vi="Tuần 7: cùng một khoảnh khắc, camera, lidar, radar thấy gì"></small></h1>
  <div id="sceBtns"></div>
  <div class="lang"><button id="btnZh" class="on">中文</button><button id="btnVi">Tiếng Việt</button></div>
</div>
</div>

<div id="app">
  <div>
    <div class="panel">
      <h2 data-zh="一、前方相機（同一個瞬間）" data-vi="1. Camera phía trước (cùng một khoảnh khắc)"></h2>
      <div class="note" id="sceNote"></div>
      <div class="tog">
        <button id="tL" class="on" data-zh="光達點" data-vi="Điểm lidar"></button>
        <button id="tR" class="on" data-zh="雷達點" data-vi="Điểm radar"></button>
        <button id="tB" data-zh="物體框" data-vi="Hộp vật thể"></button>
        <button id="tF" data-zh="合起來" data-vi="Ghép lại"></button>
      </div>
      <canvas id="cCam" width="960" height="540"></canvas>
      <div class="legend" id="legCam"></div>
    </div>
    <div class="panel" style="margin-top:12px">
      <h2 data-zh="二、從上往下看（鳥瞰圖，前後左右各 40 公尺）" data-vi="2. Nhìn từ trên xuống (mỗi phía 40 m)"></h2>
      <div class="note" data-zh="自己的車在正中間、車頭朝上。灰點是光達，紅點是雷達（五顆，一圈都有），框是官方標註的物體。淺色扇形是前方相機看得到的範圍。"
           data-vi="Xe mình ở chính giữa, đầu xe hướng lên. Chấm xám là lidar, chấm đỏ là radar (năm cái, quanh xe), hộp là vật được gán nhãn. Hình quạt nhạt là vùng camera phía trước nhìn thấy."></div>
      <canvas id="cBev" width="640" height="640"></canvas>
      <div class="legend" id="legBev"></div>
    </div>
  </div>

  <div class="panel">
    <h2 data-zh="三、數一數" data-vi="3. Đếm thử"></h2>
    <div class="stats" id="stats"></div>
    <div class="note" data-zh="下表是這一格每個物體（50 公尺內）的框裡有幾個光達點、幾個雷達點，數字取自官方標註。點一列，兩張圖上會標出那個物體。紅字是一個雷達點都沒有。"
         data-vi="Bảng dưới: mỗi vật (trong 50 m) có bao nhiêu điểm lidar, bao nhiêu điểm radar trong hộp, số liệu từ nhãn chính thức. Bấm một dòng, hai hình sẽ đánh dấu vật đó. Chữ đỏ là không có điểm radar nào."></div>
    <div class="note" data-zh="「前方相機畫面」：● 表示這個物體在前方那台相機拍得到的範圍裡；沒有 ● 的，寫它在車子的哪一邊。表格列的是車子周圍一整圈的物體，所以大部分都不在前方相機的畫面裡。這一欄不是「相機有沒有認出來」——框是人工標註的。"
         data-vi="«Ảnh camera trước»: ● là vật nằm trong vùng camera phía trước chụp được; không có ● thì ghi vật ở phía nào của xe. Bảng liệt kê vật quanh cả vòng xe, nên phần lớn không nằm trong ảnh camera trước. Cột này không phải «camera có nhận ra không» — hộp do người gán nhãn."></div>
    <div class="note" data-zh="「雷達：多快」是雷達量到的、朝自己的車靠近或遠離的速度（都卜勒只量得到這一段，橫著走的會接近 0）。只用圖上畫出來的雷達點算；官方點數有算、但被過濾掉的點不算，所以偶爾會「有點數、沒有速度」。"
         data-vi="«Radar: nhanh bao nhiêu» là tốc độ lại gần hoặc ra xa xe mình mà radar đo được (Doppler chỉ đo được phần này, đi ngang thì gần 0). Chỉ tính các điểm radar vẽ trên hình; điểm đã bị lọc thì không tính, nên đôi khi «có số điểm, không có tốc độ»."></div>
    <div class="tblwrap"><table><thead><tr>
      <th data-zh="物體" data-vi="Vật"></th><th data-zh="距離" data-vi="Cách"></th>
      <th data-zh="光達點" data-vi="Lidar"></th><th data-zh="雷達點" data-vi="Radar"></th><th data-zh="雷達：多快 km/h" data-vi="Radar: km/h"></th><th data-zh="前方相機畫面" data-vi="Ảnh camera trước"></th>
    </tr></thead><tbody id="tbody"></tbody></table></div>
    <a class="hwlink" id="hwLink" href="../hw/" data-zh="作業在另一頁 →" data-vi="Bài tập ở trang khác →"></a>
    <div class="foot" id="foot"></div>
  </div>
</div>

<script>
// 第七週 nuScenes 觀察台的畫面程式。資料 FRAMES 由 build_nusc.js 從 nusc_data.js 塞進頁面。
const $ = (id) => document.getElementById(id);
let ZH = true, cur = 0, sel = -1;
const show = { L: true, R: true, B: false, F: false };
const L = (zh, vi) => (ZH ? zh : vi);
const CAT = {
  car: ["車", "Ô tô"], truck: ["卡車", "Xe tải"], bus: ["公車", "Xe buýt"], moto: ["機車", "Xe máy"],
  bike: ["腳踏車", "Xe đạp"], ped: ["行人", "Người đi bộ"],
};
const MOVING = 3;                       // 雷達點速度 > 3 km/h 算「在動」
// 雷達量到的速度（朝自己的車：負＝靠近、正＝遠離）寫成字
const rvTxt = (b) => b.rv == null ? "—" : Math.abs(b.rv) < MOVING ? L("≈0", "≈0") :
  (b.rv < 0 ? L("靠近 ", "lại gần ") : L("遠離 ", "ra xa ")) + Math.abs(b.rv);

function i18n() {
  document.querySelectorAll("[data-zh]").forEach((e) => { e.textContent = L(e.dataset.zh, e.dataset.vi); });
  document.documentElement.lang = ZH ? "zh-Hant" : "vi";
}

function sceneBtns() {
  $("sceBtns").innerHTML = FRAMES.map((f, i) =>
    `<button data-i="${i}" class="${i === cur ? "on" : ""}">${L(f.zh.split("・")[1] || f.zh, f.vi.split(" · ")[1] || f.vi)}<span class="vi">${f.scene}</span></button>`).join("");
  $("sceBtns").querySelectorAll("button").forEach((b) => b.onclick = () => { cur = +b.dataset.i; sel = -1; draw(); });
}

// 距離 → 顏色：紅近、藍遠（和投影片同一套）
const dcol = (dm) => { const x = Math.min(1, dm / 500); return `rgb(${Math.round(255 * (1 - x))},${Math.round(90 + 140 * x)},${Math.round(255 * x)})`; };

const img = new Image();
let imgFor = -1;
function drawCam() {
  const f = FRAMES[cur], c = $("cCam"), g = c.getContext("2d");
  const paint = () => {
    g.drawImage(img, 0, 0, 960, 540);
    if (show.L) for (const [u, v, d] of f.lc) { g.fillStyle = dcol(d); g.fillRect(u - 1.5, v - 1.5, 3, 3); }
    if (show.B || sel >= 0) f.boxes.forEach((b, i) => {
      if (!b.cam || (!show.B && i !== sel)) return;
      g.lineWidth = i === sel ? 5 : 2.5;
      g.strokeStyle = i === sel ? "#FFD400" : (b.nr > 0 ? "#3BE07A" : "#FFB020");
      g.strokeRect(b.cam[0], b.cam[1], b.cam[2] - b.cam[0], b.cam[3] - b.cam[1]);
    });
    if (show.R) for (const [u, v, , s] of f.rc) {
      g.beginPath(); g.arc(u, v, 8, 0, Math.PI * 2); g.lineWidth = 3; g.strokeStyle = "#FF3B30";
      if (s > MOVING) { g.fillStyle = "rgba(255,59,48,.85)"; g.fill(); }
      g.stroke();
    }
    // 合起來：相機說是什麼＋光達說多遠＋雷達說多快，寫在框上。
    // 由近到遠擺；和已經擺好的標籤重疊就往上挪，挪兩次還重疊就不寫（點表格那一列的一定寫）。只寫 30 公尺內的。
    if (show.F || sel >= 0) {
      const placed = [];
      const hit = (r) => placed.some((q) => r[0] < q[0] + q[2] && q[0] < r[0] + r[2] && r[1] < q[1] + q[3] && q[1] < r[1] + r[3]);
      g.font = "bold 15px Arial, sans-serif";
      // 先把要寫字的那些框畫成白框（物體框沒開的時候），字最後才寫，才不會被框和雷達圈蓋住
      if (!show.B) f.boxes.forEach((b, i) => { if (show.F && b.cam && b.d <= 30 && i !== sel) {
        g.lineWidth = 2.5; g.strokeStyle = "#FFFFFF"; g.strokeRect(b.cam[0], b.cam[1], b.cam[2] - b.cam[0], b.cam[3] - b.cam[1]); } });
      f.boxes.map((b, i) => ({ b, i })).filter(({ b, i }) => b.cam && (i === sel || (show.F && b.d <= 30)))

          while (hit(r) && k < 2) { y -= 22; r = [x, y - 19, w, 21]; k++; }
          if (hit(r) && i !== sel) return;
          placed.push(r);
          g.fillStyle = "rgba(11,31,58,.88)"; g.fillRect(r[0], r[1], r[2], r[3]);
          g.fillStyle = i === sel ? "#FFD400" : "#FFFFFF"; g.fillText(t, x + 5, y - 3);
        });
    }
  };
  if (imgFor !== cur) { img.onload = paint; img.src = f.img; imgFor = cur; } else paint();
  const nMov = f.rc.filter((r) => r[3] > MOVING).length;
  $("legCam").innerHTML =
    `<span><i style="background:linear-gradient(90deg,#ff5a00,#00e6ff)"></i>${L("光達點：顏色＝距離（紅近、藍遠）", "Điểm lidar: màu = khoảng cách (đỏ gần, xanh xa)")}</span>` +
    `<span><i style="background:#FF3B30"></i>${L("雷達點：實心＝在動，空心＝靜止", "Điểm radar: đặc = đang chạy, rỗng = đứng yên")}（${nMov}／${f.rc.length}）</span>` +
    `<span><i class="sq" style="background:#3BE07A"></i>${L("框：有雷達點", "Hộp: có điểm radar")}</span>` +
    `<span><i class="sq" style="background:#FFB020"></i>${L("框：沒有雷達點", "Hộp: không có điểm radar")}</span>`;
}

function drawBev() {
  const f = FRAMES[cur], c = $("cBev"), g = c.getContext("2d"), N = 640, R = 400; // R：40 m＝400 公寸
  const P = (x, y) => [N / 2 - (y / R) * (N / 2), N / 2 - (x / R) * (N / 2)];      // 車體座標 x 前、y 左 → 畫面
  g.fillStyle = "#0b1520"; g.fillRect(0, 0, N, N);
  g.strokeStyle = "rgba(255,255,255,.08)"; g.lineWidth = 1;
  for (let r = 100; r <= 400; r += 100) { g.beginPath(); g.arc(N / 2, N / 2, (r / R) * (N / 2), 0, Math.PI * 2); g.stroke(); }
  g.fillStyle = "rgba(255,255,255,.35)"; g.font = "13px Arial";
  for (let r = 10; r <= 40; r += 10) g.fillText(r + " m", N / 2 + 4, N / 2 - (r * 10 / R) * (N / 2) + 14);
  // 前方相機的視野扇形
  const h = (f.hfov / 2) * Math.PI / 180;
  g.fillStyle = "rgba(0,168,150,.10)"; g.beginPath(); g.moveTo(N / 2, N / 2);
  g.lineTo(...P(R * Math.cos(h) * 1.5, R * Math.sin(h) * 1.5)); g.lineTo(...P(R * Math.cos(h) * 1.5, -R * Math.sin(h) * 1.5)); g.closePath(); g.fill();
  if (show.L) { g.fillStyle = "rgba(200,210,220,.55)"; for (const [x, y] of f.lb) { const [u, v] = P(x, y); g.fillRect(u, v, 1.6, 1.6); } }
  if (show.B || sel >= 0) f.boxes.forEach((b, i) => {
    if (!show.B && i !== sel) return;
    g.beginPath(); b.bev.forEach(([x, y], k) => { const [u, v] = P(x, y); k ? g.lineTo(u, v) : g.moveTo(u, v); }); g.closePath();
    g.lineWidth = i === sel ? 3.5 : 1.8; g.strokeStyle = i === sel ? "#FFD400" : (b.nr > 0 ? "#3BE07A" : "#FFB020"); g.stroke();
  });
  if (show.R) for (const [x, y, s] of f.rb) {
    const [u, v] = P(x, y); g.beginPath(); g.arc(u, v, 4, 0, Math.PI * 2); g.lineWidth = 2; g.strokeStyle = "#FF3B30";
    if (s > MOVING) { g.fillStyle = "#FF3B30"; g.fill(); }
    g.stroke();
  }

  g.fillStyle = "#00A896"; g.fillRect(N / 2 - 7, N / 2 - 16, 14, 32);
  $("legBev").innerHTML = `<span>${L("灰點：光達（抽樣三分之一）", "Chấm xám: lidar (lấy 1/3)")}</span><span>${L("紅點：雷達，實心＝在動", "Chấm đỏ: radar, đặc = đang chạy")}</span><span>${L("綠色長方形：自己的車", "Hình chữ nhật xanh: xe mình")}</span>`;
}

// 不在前方相機畫面裡的物體，在車子的哪一邊（車體座標 x 前、y 左；用框的中心點算方向）
function sideTxt(b, f) {
  const x = b.bev.reduce((s, p) => s + p[0], 0) / 4, y = b.bev.reduce((s, p) => s + p[1], 0) / 4;
  const a = Math.atan2(y, x) * 180 / Math.PI;
  if (Math.abs(a) <= f.hfov / 2) return L("前方（太近）", "phía trước (quá gần)");
  if (Math.abs(a) <= 135) return a > 0 ? L("左側", "bên trái") : L("右側", "bên phải");
  return L("後方", "phía sau");
}

  const rows = f.boxes.map((b, i) => ({ b, i })).filter((r) => r.b.d <= 50).sort((a, b) => a.b.d - b.b.d);
  $("tbody").innerHTML = rows.map(({ b, i }) =>
    `<tr data-i="${i}" class="${b.nr === 0 ? "zero" : ""} ${i === sel ? "sel" : ""}"><td>${L(...CAT[b.k])}</td><td>${b.d.toFixed(1)} m</td>` +
    `<td>${b.nl}</td><td class="r">${b.nr}</td><td>${rvTxt(b)}</td><td>${b.cam ? "●" : `<span class="side">${sideTxt(b, f)}</span>`}</td></tr>`).join("");
  $("tbody").querySelectorAll("tr").forEach((tr) => tr.onclick = () => { const i = +tr.dataset.i; sel = sel === i ? -1 : i; drawCam(); drawBev(); table(); });
  const inCam = f.boxes.filter((b) => b.cam);
  $("stats").innerHTML =
    `<div class="stat"><b>${f.lc.length.toLocaleString()}</b><span>${L("畫面裡的光達點", "Điểm lidar trong khung")}</span></div>` +
    `<div class="stat"><b>${f.rc.length}</b><span>${L("畫面裡的雷達點（前方三顆）", "Điểm radar trong khung (3 cái trước)")}</span></div>` +
    `<div class="stat"><b>${inCam.filter((b) => b.nr > 0).length}／${inCam.length}</b><span>${L("畫面裡的物體，有雷達點的", "Vật trong khung có điểm radar")}</span></div>`;
}

function draw() {
  i18n(); sceneBtns();
  const f = FRAMES[cur];
  $("sceNote").textContent = L(`${f.zh}　${f.scene}，第 ${f.idx + 1} 個關鍵畫面。`, `${f.vi}　${f.scene}, khung chính thứ ${f.idx + 1}.`);
  ["L", "R", "B", "F"].forEach((k) => $("t" + k).classList.toggle("on", show[k]));
  drawCam(); drawBev(); table();
  $("foot").innerHTML = L(
    `資料：<a href="https://www.nuscenes.org" target="_blank" rel="noopener">nuScenes</a>（Motional），v1.0-mini，授權 CC BY-NC-SA 4.0（非商業使用、註明出處、同樣方式分享）。雷達是 Continental ARS 408-21，點已照官方工具的預設方式過濾；光達是 Velodyne HDL-32E。投影與數點由課程自己寫的程式完成（src/tools_nusc_export.py）。`,
    `Dữ liệu: <a href="https://www.nuscenes.org" target="_blank" rel="noopener">nuScenes</a> (Motional), v1.0-mini, giấy phép CC BY-NC-SA 4.0 (phi thương mại, ghi nguồn, chia sẻ cùng cách). Radar là Continental ARS 408-21, điểm đã lọc theo mặc định của công cụ chính thức; lidar là Velodyne HDL-32E. Chiếu và đếm điểm bằng chương trình của môn học (src/tools_nusc_export.py).`);
}
