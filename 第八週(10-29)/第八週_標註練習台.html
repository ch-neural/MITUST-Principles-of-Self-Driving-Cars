<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>標註練習台（第八週）</title>
<style>
  :root{--navy:#0B1F3A;--teal:#00A896;--teal-d:#007F72;--line:#D8E0E8;--card:#F4F7FA;--mute:#5F7183;--ink:#1A2733;
        --red:#D9463E;--ok:#2E7D5B;--veh:#00A896;--ped:#E5484D;--two:#F0A010}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:#EEF2F6;color:var(--ink);font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",Arial,sans-serif;font-size:14px;line-height:1.5}
  #stick{position:sticky;top:0;z-index:6;background:#fff;border-bottom:1px solid var(--line)}
  #topbar{display:flex;align-items:center;gap:10px;padding:7px 12px;flex-wrap:wrap}
  #topbar h1{font-size:15px;margin:0;color:var(--navy)}
  #topbar h1 small{display:block;font-size:10.5px;color:var(--mute);font-weight:400}
  #taskBtns{display:flex;gap:6px;flex:1 1 auto;flex-wrap:wrap}
  button{font-family:inherit;font-size:12px;padding:6px 9px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:7px;cursor:pointer;line-height:1.25}
  button:hover{border-color:var(--teal)}
  button.on{background:var(--navy);border-color:var(--navy);color:#fff}
  button .vi{display:block;font-size:9.5px;opacity:.75}
  button.done::after{content:" ✓";color:var(--teal)}
  .lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;margin-left:auto}
  .lang button{padding:5px 11px;font-size:11.5px;border:none;border-radius:0}
  #app{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr);gap:12px;padding:12px;align-items:start}
  #app>div{min-width:0}
  .panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
  h2{font-size:13px;margin:0 0 6px;color:var(--teal-d)}
  .note{font-size:11.5px;color:var(--mute);margin:2px 0 8px;line-height:1.45}
  .bar{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px;align-items:center}
  .cls button{font-weight:700;min-width:78px}
  .cls button[data-g=veh].on{background:var(--veh);border-color:var(--veh)}
  .cls button[data-g=ped].on{background:var(--ped);border-color:var(--ped)}
  .cls button[data-g=two].on{background:var(--two);border-color:var(--two)}
  .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:0}
  #wrap{position:relative;touch-action:none}
  canvas{display:block;width:100%;height:auto;border-radius:6px;background:#0b1520;cursor:crosshair}
  .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:0 0 8px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
  .stat b{display:block;font-size:19px;color:var(--navy);line-height:1.2}
  .stat span{font-size:10.5px;color:var(--mute);display:block;line-height:1.3}
  .stat.good b{color:var(--ok)} .stat.bad b{color:var(--red)}
  ol.rules{margin:0;padding-left:20px;font-size:12.5px}
  ol.rules li{margin:3px 0}
  ol.rules .vi{display:block;font-size:11px;color:var(--mute)}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{background:var(--navy);color:#fff;font-weight:600;padding:4px 6px;text-align:left;font-size:11px}
  td{padding:4px 6px;border-top:1px solid var(--line)}
  .tag{display:inline-block;padding:0 6px;border-radius:9px;font-size:11px;color:#fff}
  .miss{color:var(--red);font-weight:700} .hit{color:var(--ok);font-weight:700}
  #sheet{display:none}
  #sheet.show{display:block}
  .sheetbox{border:2px solid var(--navy);border-radius:10px;padding:10px;background:#fff}
  input[type=text]{font-family:inherit;font-size:13px;padding:5px 7px;border:1px solid var(--line);border-radius:6px;width:9em}
  .foot{font-size:10.5px;color:var(--mute);border-top:1px solid var(--line);padding-top:6px;margin-top:8px;line-height:1.5}
  .foot a{color:var(--teal-d)}
  .hint{font-size:11.5px;background:#FFF7E0;border:1px solid #F3D58A;border-radius:7px;padding:6px 8px;margin:6px 0}
  @media (max-width:900px){
    #app{display:block;padding:8px}
    #topbar{padding:6px 8px}
    #taskBtns{flex:1 1 100%;order:3;display:grid;grid-template-columns:1fr 1fr}
  }
</style>
</head>
<body>
<div id="stick">
  <div id="topbar">
    <h1><span data-zh="標註練習台" data-vi="Bàn tập gán nhãn"></span>
      <small data-zh="第八週：自己當一次標註員，再跟官方答案、跟模型比" data-vi="Tuần 8: tự làm người gán nhãn, rồi so với đáp án chính thức và với mô hình"></small></h1>
    <div id="taskBtns"></div>
    <div class="lang"><button id="lzh" class="on">中文</button><button id="lvi">Tiếng Việt</button></div>
  </div>
</div>

<div id="app">
  <div>
    <div class="panel">
      <h2 id="taskTitle"></h2>
      <div class="note" data-zh="選一個類別，在照片上按住拖曳畫框。點一下框可以選它，再按「刪掉」或換類別。手機請橫過來。"
           data-vi="Chọn một loại, nhấn giữ và kéo trên ảnh để vẽ khung. Chạm vào khung để chọn, rồi bấm «Xoá» hoặc đổi loại. Điện thoại thì xoay ngang."></div>
      <div class="bar cls">
        <button data-g="veh" class="on"><span class="sw" style="background:var(--veh)"></span><span data-zh="車" data-vi="Xe"></span></button>
        <button data-g="ped"><span class="sw" style="background:var(--ped)"></span><span data-zh="行人" data-vi="Người"></span></button>
        <button data-g="two"><span class="sw" style="background:var(--two)"></span><span data-zh="機車・腳踏車" data-vi="Xe 2 bánh"></span></button>
        <span style="flex:1"></span>
        <button id="bDel" data-zh="刪掉選的框" data-vi="Xoá khung"></button>
        <button id="bUndo" data-zh="復原" data-vi="Hoàn tác"></button>
        <button id="bClear" data-zh="全部清掉" data-vi="Xoá hết"></button>
      </div>
      <div id="wrap"><canvas id="cv" width="1280" height="720"></canvas></div>
      <div class="bar" style="margin-top:8px">
        <button id="bCheck" style="font-weight:700" data-zh="對答案" data-vi="So đáp án"></button>
        <button id="bModel" data-zh="看模型怎麼框" data-vi="Xem mô hình khoanh"></button>
        <span class="note" id="legend" style="margin:0"></span>
      </div>
      <div id="ownBar" class="bar" style="display:none">
        <input type="file" id="file" accept="image/*">
        <button id="bExport" data-zh="下載標註（YOLO 格式）" data-vi="Tải nhãn (định dạng YOLO)"></button>
        <span class="note" style="margin:0" data-zh="自己的照片沒有標準答案，只能下載標註，第十週訓練模型用。" data-vi="Ảnh của bạn không có đáp án, chỉ tải nhãn về để tuần 10 huấn luyện."></span>
      </div>
    </div>
  </div>

  <div>
    <div class="panel">
      <h2 data-zh="標註規則（照 nuScenes 官方規則改寫）" data-vi="Quy tắc gán nhãn (viết lại theo quy tắc chính thức của nuScenes)"></h2>
      <ol class="rules" id="rules"></ol>
    </div>

    <div class="panel">
      <h2 data-zh="成績" data-vi="Kết quả"></h2>
      <div class="stats" id="stats"></div>
      <div id="result"></div>
      <div class="foot" data-zh="參考答案：nuScenes 官方立體框投到照片上；左右改用框裡光達點的範圍，比較貼身。框重疊 IoU ≥ 0.3、類別相同，算「框到」。灰色虛線是「可標可不標」（太小、被擋太多）：標了不算多標，沒標也不算漏。"
           data-vi="Đáp án tham khảo: khung 3D chính thức của nuScenes chiếu lên ảnh; chiều ngang lấy theo điểm lidar trong khung cho sát hơn. Chồng lấn IoU ≥ 0,3 và cùng loại thì tính «khoanh trúng». Nét đứt xám là «khoanh cũng được, không cũng được» (quá nhỏ, bị che nhiều): khoanh không tính thừa, không khoanh không tính sót."></div>
    </div>

    <div class="panel">
      <h2 data-zh="作答單" data-vi="Phiếu kết quả"></h2>
      <div class="bar">
        <input type="text" id="nm" placeholder="姓名 Họ tên"><input type="text" id="sid" placeholder="學號 MSSV">
        <button id="bSheet" style="font-weight:700" data-zh="產生作答單" data-vi="Tạo phiếu"></button>
      </div>
      <div id="sheet"></div>
      <div class="foot">
        <span data-zh="照片：" data-vi="Ảnh: "></span><a href="https://www.nuscenes.org/" target="_blank" rel="noopener">nuScenes</a>（Motional）v1.0-mini，CC BY-NC-SA 4.0。
        <span data-zh="模型：YOLOX-s（Megvii，Apache-2.0），分數門檻 0.3。" data-vi="Mô hình: YOLOX-s (Megvii, Apache-2.0), ngưỡng điểm 0,3."></span>
      </div>
    </div>
  </div>
</div>

/* 標註練習台的畫面程式。資料 TASKS 由 tools_label_export.py 產生（label_data.js）。

 * 框的格式：[x0, y0, x1, y1]，照片像素。比對：同類別、IoU ≥ 0.3 算框到，一對一、IoU 大的先配。
 */
const $ = (id) => document.getElementById(id);

const IOU_OK = 0.3;
const RULES = [
  ["框要貼緊：剛好包住物體，不多留空白。", "Khung phải sát: vừa bao vật, không chừa khoảng trống."],

// ── 存檔（只存在自己的瀏覽器，換電腦就沒有）──
function save() { try { localStorage.setItem("w8label", JSON.stringify({ b: store.boxes, nm: $("nm").value, sid: $("sid").value })); } catch (e) {} }
function load() {
  try {
    const o = JSON.parse(localStorage.getItem("w8label") || "null");
    if (o && Array.isArray(o.b) && o.b.length === TASKS.length) store.boxes = o.b;
    if (o) { $("nm").value = o.nm || ""; $("sid").value = o.sid || ""; }
  } catch (e) {}
}

const boxes = () => (cur === OWN ? store.own.boxes : store.boxes[cur]);
const hist = () => (cur === OWN ? store.own.hist : store.hist[cur]);
function push() { hist().push(JSON.stringify(boxes())); if (hist().length > 50) hist().shift(); }

function iou(a, b) {
  const ix = Math.max(0, Math.min(a[2], b[2]) - Math.max(a[0], b[0])), iy = Math.max(0, Math.min(a[3], b[3]) - Math.max(a[1], b[1]));
  const I = ix * iy, U = (a[2] - a[0]) * (a[3] - a[1]) + (b[2] - b[0]) * (b[3] - b[1]) - I;
  return U > 0 ? I / U : 0;
}

// 比對：mine = [{b:[...], g}]，回傳每個參考答案配到誰、每個自己的框是什麼結果
function score(t, mine) {
  const pairs = [];
  t.req.forEach((r, ri) => mine.forEach((m, mi) => { const v = iou(r.b, m.b); if (v >= IOU_OK) pairs.push([v, ri, mi, r.g === m.g]); }));
  pairs.sort((a, b) => (b[3] - a[3]) || (b[0] - a[0]));          // 類別對的先配，再看 IoU
  const rHit = {}, mRes = {};
  for (const [v, ri, mi, same] of pairs) {
    if (ri in rHit || mi in mRes) continue;
    rHit[ri] = { mi, v, same }; mRes[mi] = { ri, v, same };
  }
  mine.forEach((m, mi) => {
    if (mi in mRes) return;
    const o = t.opt.some((r) => iou(r.b, m.b) >= IOU_OK);
    mRes[mi] = o ? { opt: true } : { extra: true };
  });
  const hit = Object.values(rHit).filter((x) => x.same).length;
  const wrong = Object.values(rHit).filter((x) => !x.same).length;
  const miss = t.req.length - hit - wrong;
  const extra = Object.values(mRes).filter((x) => x.extra).length;
  const ious = Object.values(rHit).filter((x) => x.same).map((x) => x.v);
  return { rHit, mRes, hit, wrong, miss, extra, n: t.req.length, mean: ious.length ? ious.reduce((a, b) => a + b, 0) / ious.length : 0 };
}

// ── 畫面 ──
function rect(b, col, w, dash) {
  g.save(); g.lineWidth = w; g.strokeStyle = col; if (dash) g.setLineDash(dash);
  g.strokeRect(b[0], b[1], b[2] - b[0], b[3] - b[1]); g.restore();
}
function tag(x, y, txt, col) {
  g.font = "bold 20px Arial, sans-serif"; const w = g.measureText(txt).width + 10;
  y = Math.max(22, y); g.fillStyle = col; g.fillRect(x, y - 22, w, 22); g.fillStyle = "#000"; g.fillText(txt, x + 5, y - 5);
}
function draw() {
  const im = cur === OWN ? store.own.img : imgs[cur];
  if (cur === OWN && im) { cv.width = im.naturalWidth > 1600 ? 1600 : im.naturalWidth; cv.height = Math.round(im.naturalHeight * cv.width / im.naturalWidth); }
  else if (cur !== OWN) { cv.width = 1280; cv.height = 720; }
  g.fillStyle = "#0b1520"; g.fillRect(0, 0, cv.width, cv.height);
  if (im && im.complete) g.drawImage(im, 0, 0, cv.width, cv.height);
  else if (cur === OWN) { g.fillStyle = "#8FA6BC"; g.font = "28px sans-serif"; g.fillText(L("先在下面選一張照片", "Chọn một ảnh ở bên dưới trước"), 40, 80); }
  const t = TASKS[cur], mine = boxes();
  let res = null;
  if (cur !== OWN && showAns) {
    res = score(t, mine);
    t.opt.forEach((r) => rect(r.b, "#C8CED6", 2, [6, 6]));
    t.req.forEach((r, ri) => {
      const h = res.rHit[ri];
      if (!h) { rect(r.b, "#FFFFFF", 3, [10, 7]); tag(r.b[0], r.b[1], L("漏 ", "Sót ") + L(...NAME[r.g]), "#FFFFFF"); }
      else rect(r.b, "#FFFFFF", 1.5, [4, 4]);
    });
  }
  if (cur !== OWN && showModel) t.det.forEach((d) => { rect(d, "#7FD8FF", 3, [3, 4]); tag(d[0], d[3] + 22, `AI ${d[4].toFixed(2)}`, "#7FD8FF"); });
  mine.forEach((m, i) => {
    rect(m.b, COL[m.g], i === sel ? 5 : 3);
    if (res) {
      const r = res.mRes[i];
      const txt = r.extra ? L("多標", "Thừa") : r.opt ? L("可標可不標", "Tuỳ") : r.same ? `IoU ${r.v.toFixed(2)}` : L("類別錯", "Sai loại");
      tag(m.b[0], m.b[1], txt, r.extra || (r.same === false) ? "#FFB3B3" : COL[m.g]);
    }
  });
  if (drag) rect(drag.b, COL[cls], 2, [6, 4]);
  panel(res);
}

function panel(res) {
  const t = TASKS[cur], mine = boxes();
  const cnt = (gg) => mine.filter((m) => m.g === gg).length;
  if (cur === OWN) {
    $("stats").innerHTML = ["veh", "ped", "two"].map((gg) => `<div class="stat"><b>${cnt(gg)}</b><span>${L(...NAME[gg])}</span></div>`).join("");
    $("result").innerHTML = ""; return;
  }
  if (!res) {
    $("stats").innerHTML = `<div class="stat"><b>${mine.length}</b><span>${L("你標了幾個框", "Bạn đã khoanh")}</span></div>` +
      `<div class="stat"><b>${t.req.length}</b><span>${L("這張要標幾個（參考答案）", "Ảnh này cần khoanh (đáp án)")}</span></div>` +
      `<div class="stat"><b>${t.opt.length}</b><span>${L("可標可不標", "Tuỳ chọn")}</span></div>`;
    $("result").innerHTML = `<div class="hint">${L("標完按「對答案」。對完還可以再改。", "Khoanh xong bấm «So đáp án». So xong vẫn sửa được.")}</div>`;
    return;
  }
  const m = score(t, t.det.map((d) => ({ b: d.slice(0, 4), g: d[5] })));
  $("stats").innerHTML =
    `<div class="stat good"><b>${res.hit} / ${res.n}</b><span>${L("框到（類別也對）", "Khoanh trúng (đúng loại)")}</span></div>` +
    `<div class="stat bad"><b>${res.miss}</b><span>${L("漏掉", "Bỏ sót")}</span></div>` +
    `<div class="stat ${res.extra ? "bad" : ""}"><b>${res.extra}</b><span>${L("多標", "Khoanh thừa")}</span></div>` +
    `<div class="stat"><b>${res.wrong}</b><span>${L("位置對、類別錯", "Đúng chỗ, sai loại")}</span></div>` +
    `<div class="stat"><b>${res.hit ? res.mean.toFixed(2) : "—"}</b><span>${L("框到的平均 IoU（1＝完全重疊）", "IoU trung bình (1 = trùng khít)")}</span></div>` +
    `<div class="stat"><b>${m.hit} / ${m.n}</b><span>${L("模型（AI）框到；多標 ", "Mô hình khoanh trúng; thừa ")}${m.extra}</span></div>`;
  const rows = t.req.map((r, ri) => {
    const h = res.rHit[ri];
    const st = !h ? `<span class="miss">${L("漏掉", "Sót")}</span>` : h.same ? `<span class="hit">IoU ${h.v.toFixed(2)}</span>` : `<span class="miss">${L("類別錯", "Sai loại")}</span>`;
    const ai = m.rHit[ri] && m.rHit[ri].same ? "●" : "";
    const vis = ["", "0–40%", "40–60%", "60–80%", "80–100%"][r.vis];
    const rider = (r.attr || []).includes("cycle.with_rider") ? L("（有人騎）", " (có người lái)") : (r.attr || []).includes("cycle.without_rider") ? L("（沒人騎）", " (không người lái)") : "";
    return `<tr><td><span class="tag" style="background:${COL[r.g]}">${L(...NAME[r.g])}</span>${rider}</td><td>${r.d.toFixed(1)} m</td><td>${vis}</td><td>${st}</td><td style="text-align:center">${ai}</td></tr>`;
  }).join("");
  $("result").innerHTML = `<table><thead><tr><th>${L("參考答案", "Đáp án")}</th><th>${L("距離", "Khoảng cách")}</th><th>${L("看得到", "Thấy được")}</th><th>${L("你", "Bạn")}</th><th>AI</th></tr></thead><tbody>${rows}</tbody></table>` +
    `<div class="note" style="margin-top:6px">${L("白色粗虛線＝你漏掉的；白色細虛線＝參考答案；灰色虛線＝可標可不標。AI 欄的 ● 表示模型也框到了。",
      "Nét đứt trắng đậm = bạn bỏ sót; nét đứt trắng mảnh = đáp án; nét đứt xám = tuỳ chọn. Cột AI có ● là mô hình cũng khoanh trúng.")}</div>`;
}

// ── 畫框（滑鼠、觸控都用 pointer 事件）──
let drag = null;
function pos(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; }
cv.addEventListener("pointerdown", (e) => {
  if (cur === OWN && !store.own.img) return;
  const [x, y] = pos(e);
  const hitI = boxes().map((m, i) => [m, i]).filter(([m]) => x >= m.b[0] && x <= m.b[2] && y >= m.b[1] && y <= m.b[3])
    .sort((a, b) => (a[0].b[2] - a[0].b[0]) * (a[0].b[3] - a[0].b[1]) - (b[0].b[2] - b[0].b[0]) * (b[0].b[3] - b[0].b[1]))[0];
  drag = { x, y, b: [x, y, x, y], hitI: hitI ? hitI[1] : -1 };
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener("pointermove", (e) => {
  if (!drag) return; const [x, y] = pos(e);
  drag.b = [Math.min(drag.x, x), Math.min(drag.y, y), Math.max(drag.x, x), Math.max(drag.y, y)]; draw();
});
cv.addEventListener("pointerup", () => {
  if (!drag) return;
  const b = drag.b.map((v, i) => Math.max(0, Math.min(i % 2 ? cv.height : cv.width, v)));
  if (b[2] - b[0] >= 6 && b[3] - b[1] >= 6) { push(); boxes().push({ b: b.map((v) => Math.round(v)), g: cls }); sel = boxes().length - 1; }
  else sel = drag.hitI;                                  // 只是點一下：選框
  drag = null; save(); draw();
});

// ── 按鈕 ──
document.querySelectorAll(".cls button").forEach((b) => b.onclick = () => {
  cls = b.dataset.g;
  document.querySelectorAll(".cls button").forEach((x) => x.classList.toggle("on", x === b));
  if (sel >= 0 && boxes()[sel]) { push(); boxes()[sel].g = cls; save(); }
  draw();
});
$("bDel").onclick = () => { if (sel >= 0 && boxes()[sel]) { push(); boxes().splice(sel, 1); sel = -1; save(); draw(); } };
$("bUndo").onclick = () => { const h = hist(); if (!h.length) return; const prev = JSON.parse(h.pop()); boxes().length = 0; boxes().push(...prev); sel = -1; save(); draw(); };
$("bClear").onclick = () => { if (!boxes().length) return; push(); boxes().length = 0; sel = -1; save(); draw(); };
$("bCheck").onclick = () => { showAns = !showAns; $("bCheck").classList.toggle("on", showAns); draw(); };
$("bModel").onclick = () => { showModel = !showModel; $("bModel").classList.toggle("on", showModel); draw(); };
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "Delete" || e.key === "Backspace") $("bDel").onclick();
  if ((e.ctrlKey || e.metaKey) && e.key === "z") { e.preventDefault(); $("bUndo").onclick(); }
});

// 自己的照片：載入、下載 YOLO 格式（類別 中心x 中心y 寬 高，都除以照片寬高）
$("file").onchange = (e) => {
  const f = e.target.files[0]; if (!f) return;
  const im = new Image(); im.onload = () => { store.own.img = im; store.own.boxes = []; store.own.name = f.name.replace(/\.[^.]+$/, ""); draw(); };
  im.src = URL.createObjectURL(f);
};
$("bExport").onclick = () => {
  if (!store.own.img || !store.own.boxes.length) return;
  const id = { veh: 0, ped: 1, two: 2 }, W = cv.width, H = cv.height;
  const txt = store.own.boxes.map((m) => [id[m.g], (m.b[0] + m.b[2]) / 2 / W, (m.b[1] + m.b[3]) / 2 / H, (m.b[2] - m.b[0]) / W, (m.b[3] - m.b[1]) / H]
    .map((v, i) => (i ? v.toFixed(6) : v)).join(" ")).join("\n") + "\n";
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([txt], { type: "text/plain" }));
  a.download = (store.own.name || "photo") + ".txt"; a.click();
};

// 作答單：四張的成績，截圖傳 LINE
$("bSheet").onclick = () => {
  save();
  const rows = TASKS.map((t, i) => {
    const r = score(t, store.boxes[i]);
    return `<tr><td>${i + 1}. ${L(t.zh, t.vi)}</td><td>${store.boxes[i].length}</td><td class="hit">${r.hit}/${r.n}</td><td class="miss">${r.miss}</td><td>${r.extra}</td><td>${r.hit ? r.mean.toFixed(2) : "—"}</td></tr>`;
  }).join("");
  const now = new Date();
  $("sheet").innerHTML = `<div class="sheetbox"><b>${L("第八週 標註練習 作答單", "Phiếu bài tập gán nhãn tuần 8")}</b><br>${$("nm").value || "（姓名）"}　${$("sid").value || "（學號）"}　${now.toLocaleString("zh-TW")}` +
    `<table style="margin-top:6px"><thead><tr><th>${L("任務", "Nhiệm vụ")}</th><th>${L("框數", "Số khung")}</th><th>${L("框到", "Trúng")}</th><th>${L("漏掉", "Sót")}</th><th>${L("多標", "Thừa")}</th><th>IoU</th></tr></thead><tbody>${rows}</tbody></table>` +
    `<div class="note">${L("截圖這一塊，傳到 LINE 群組。", "Chụp màn hình khung này, gửi vào nhóm LINE.")}</div></div>`;
  $("sheet").classList.add("show");
};
$("nm").oninput = save; $("sid").oninput = save;

function setTask(i) {
  cur = i; sel = -1; drag = null;
  $("ownBar").style.display = cur === OWN ? "flex" : "none";
  $("bCheck").style.display = $("bModel").style.display = cur === OWN ? "none" : "";
  i18n();
}
function i18n() {
  document.documentElement.lang = ZH ? "zh-Hant" : "vi";
  document.querySelectorAll("[data-zh]").forEach((el) => { el.textContent = ZH ? el.dataset.zh : el.dataset.vi; });
  $("lzh").classList.toggle("on", ZH); $("lvi").classList.toggle("on", !ZH);
  $("rules").innerHTML = RULES.map((r) => `<li>${L(...r)}</li>`).join("");
  $("taskBtns").innerHTML = TASKS.map((t, i) => `<button data-i="${i}" class="${i === cur ? "on" : ""} ${store.boxes[i].length ? "done" : ""}">${L("任務", "NV ")}${i + 1}<span class="vi">${L(t.zh, t.vi)}</span></button>`).join("") +
    `<button data-i="${OWN}" class="${cur === OWN ? "on" : ""}">${L("自己的照片", "Ảnh của bạn")}<span class="vi">${L("下載標註", "Tải nhãn")}</span></button>`;
  $("taskBtns").querySelectorAll("button").forEach((b) => b.onclick = () => setTask(+b.dataset.i));
  $("taskTitle").textContent = cur === OWN ? L("自己的照片：標好下載，第十週訓練用", "Ảnh của bạn: khoanh xong tải về, tuần 10 dùng để huấn luyện")
    : `${L("任務", "Nhiệm vụ ")}${cur + 1}　${L(TASKS[cur].zh, TASKS[cur].vi)}　(${TASKS[cur].key})`;
  $("legend").innerHTML = ["veh", "ped", "two"].map((k) => `<span class="sw" style="background:${COL[k]}"></span>${L(...NAME[k])}`).join("　") +
    `　<span class="sw" style="background:#7FD8FF"></span>AI`;
  draw();
}
$("lzh").onclick = () => { ZH = true; i18n(); };
$("lvi").onclick = () => { ZH = false; i18n(); };
load();
setTask(0);

</script>
</body>
</html>
